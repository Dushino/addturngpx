<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AddTurn GPX</title>
<meta name="theme-color" content="#f3f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141a17" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AddTurn GPX">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
  /* ---------- Barvy: světlý režim je výchozí, tmavý podle systému ---------- */
  :root{
    color-scheme: light;
    --bg: #f3f5f2;
    --surface: #ffffff;
    --surface-2: #e8ece8;
    --text: #1b231f;
    --text-muted: #5d6b63;
    --border: #cfd7d1;
    --accent: #2f7a55;
    --accent-text: #ffffff;
    --shadow: 0 2px 10px rgba(0,0,0,.15);
    --bar-h: 48px;
    --btn-h: 34px;
    --panel-w: 300px;
    --sheet-peek: 58px; /* výška sbaleného spodního panelu na mobilu */
  }
  @media (prefers-color-scheme: dark){
    :root{
      color-scheme: dark;
      --bg: #141a17;
      --surface: #1c2420;
      --surface-2: #26302b;
      --text: #e3ebe6;
      --text-muted: #97a69d;
      --border: #34413a;
      --accent: #5cb98a;
      --accent-text: #0e1612;
      --shadow: 0 2px 12px rgba(0,0,0,.5);
    }
  }
  /* Dotykové ovládání: větší tlačítka */
  @media (pointer: coarse){
    :root{ --bar-h: 56px; --btn-h: 44px; }
  }

  *{ box-sizing: border-box; }
  html, body{ height: 100%; margin: 0; }
  body{
    background: var(--bg);
    color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- Horní lišta ---------- */
  #topbar{
    flex: 0 0 auto;
    min-height: calc(var(--bar-h) + env(safe-area-inset-top, 0px));
    padding: env(safe-area-inset-top, 0px) max(10px, env(safe-area-inset-right, 0px)) 0 max(10px, env(safe-area-inset-left, 0px));
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    z-index: 1100;
  }
  #topbar .brand{
    display: flex; align-items: center; gap: 8px;
    font-weight: 650; white-space: nowrap; margin-right: auto;
  }
  #topbar .brand img{ width: 26px; height: 26px; border-radius: 6px; }
  .actions{ display: flex; gap: 6px; }
  button{
    font: inherit;
    height: var(--btn-h);
    min-width: var(--btn-h);
    padding: 0 12px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface-2);
    color: var(--text);
    cursor: pointer;
  }
  button:hover:not(:disabled){ border-color: var(--accent); }
  button:focus-visible{ outline: 2px solid var(--accent); outline-offset: 1px; }
  button:disabled{ opacity: .45; cursor: default; }
  button.primary{ background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button svg{ width: 18px; height: 18px; flex: 0 0 auto; }

  /* ---------- Hlavní plocha: mapa + panel ---------- */
  #main{ flex: 1 1 auto; display: flex; min-height: 0; position: relative; }
  #map{ flex: 1 1 auto; min-width: 0; background: #e6e4df; }
  /* Mapa zůstává vždy ve světlém provedení, i v tmavém režimu */
  #map, #map .leaflet-control{ color-scheme: light; color: #333; }

  #panel{
    flex: 0 0 var(--panel-w);
    width: var(--panel-w);
    display: flex; flex-direction: column;
    background: var(--surface);
    border-left: 1px solid var(--border);
    min-height: 0;
  }
  body.panel-hidden #panel{ display: none; }
  #panel-head{
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
  }
  #panel-head .count{ color: var(--text-muted); font-weight: 400; margin-right: auto; }
  #panel-grip{ display: none; }
  #panel-body{ flex: 1 1 auto; overflow: auto; padding: 12px; }
  .empty{ color: var(--text-muted); }

  /* ---------- Zpráva (toast) ---------- */
  #toast{
    position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%);
    max-width: min(90vw, 460px);
    padding: 10px 14px;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    box-shadow: var(--shadow);
    z-index: 1200;
  }

  /* Vlastní ovládací prvek mapy „moje poloha“ */
  .leaflet-control-locate a{ display: flex !important; align-items: center; justify-content: center; }
  .leaflet-control-locate svg{ width: 18px; height: 18px; }
  .leaflet-control-locate.busy a{ opacity: .5; }
  @media (pointer: coarse){
    .leaflet-touch .leaflet-bar a{ width: 44px; height: 44px; line-height: 44px; }
  }

  /* ---------- Mobilní rozložení ----------
     Úzká obrazovka, nebo dotykové zařízení s malou výškou (telefon na šířku).
     Boční panel se mění na vysouvací spodní panel. */
  @media (max-width: 760px), (pointer: coarse) and (max-height: 500px){
    #topbar .brand span{ display: none; }
    .actions button .label{ display: none; }
    #btn-panel{ display: none; }

    #main{ flex-direction: column; }
    #panel, body.panel-hidden #panel{
      display: flex;
      position: absolute; left: 0; right: 0; bottom: 0;
      width: auto;
      height: 50%;
      border-left: none;
      border-top: 1px solid var(--border);
      border-radius: 14px 14px 0 0;
      box-shadow: var(--shadow);
      z-index: 1000;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      transition: transform .22s ease;
    }
    /* Sbalený panel: vidět je jen hlavička */
    body:not(.sheet-open) #panel{
      transform: translateY(calc(100% - var(--sheet-peek) - env(safe-area-inset-bottom, 0px)));
    }
    #panel-head{ cursor: pointer; flex-wrap: wrap; row-gap: 0; padding-top: 0; height: var(--sheet-peek); }
    #panel-grip{
      display: block; flex: 0 0 100%; height: 14px;
      background: linear-gradient(var(--border), var(--border)) center / 40px 4px no-repeat;
    }
    /* Atribuce a spodní prvky mapy nad sbaleným panelem, ať nejsou zakryté */
    #map .leaflet-bottom{ bottom: calc(var(--sheet-peek) + env(safe-area-inset-bottom, 0px)); }
    #toast{ bottom: calc(var(--sheet-peek) + 16px + env(safe-area-inset-bottom, 0px)); }
  }
</style>
</head>
<body>

<header id="topbar">
  <div class="brand"><img src="icon.svg" alt=""><span>AddTurn GPX</span></div>
  <div class="actions">
    <button id="btn-open" disabled title="Open GPX file (coming soon)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span class="label">Open</span>
    </button>
    <button id="btn-url" disabled title="Open GPX from URL (coming soon)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
      <span class="label">Open URL</span>
    </button>
    <button id="btn-save" class="primary" disabled title="Save GPX (coming soon)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
      <span class="label">Save</span>
    </button>
    <button id="btn-panel" title="Show / hide waypoint panel" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
    </button>
  </div>
</header>

<div id="main">
  <div id="map"></div>
  <aside id="panel">
    <div id="panel-head">
      <div id="panel-grip"></div>
      <span>Waypoints</span><span class="count" id="wpt-count"></span>
    </div>
    <div id="panel-body">
      <p class="empty">No GPX file loaded.</p>
    </div>
  </aside>
  <div id="toast" hidden></div>
</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script>
"use strict";

// ---------- Nastavení a perzistence ----------
const VIEW_KEY = "addturngpx.view";
const PANEL_KEY = "addturngpx.panelHidden";
const DEFAULT_VIEW = { lat: 49.8, lng: 15.5, zoom: 7 }; // Česko

function loadJSON(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  }catch(e){ return fallback; }
}
function saveJSON(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){}
}

// ---------- Rozložení: mobil / desktop ----------
// Řídí se CSS media query (stejná jako v <style>), ne podle User-Agent,
// takže se GUI přizpůsobí i změně velikosti okna nebo otočení telefonu.
const mobileQuery = window.matchMedia("(max-width: 760px), (pointer: coarse) and (max-height: 500px)");
function isMobile(){ return mobileQuery.matches; }

// ---------- Mapa ----------
const savedView = loadJSON(VIEW_KEY, DEFAULT_VIEW);
const map = L.map("map", { zoomControl: true }).setView([savedView.lat, savedView.lng], savedView.zoom);

L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  // OSM vyžaduje hlavičku Referer — bez ní dlaždice blokuje (HTTP 403)
  referrerPolicy: "strict-origin-when-cross-origin",
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors'
}).addTo(map);

map.on("moveend", () => {
  const c = map.getCenter();
  saveJSON(VIEW_KEY, { lat: +c.lat.toFixed(6), lng: +c.lng.toFixed(6), zoom: map.getZoom() });
});

// ---------- Ovládací prvek „moje poloha“ ----------
let locationMarker = null;
const LocateControl = L.Control.extend({
  options: { position: "topleft" },
  onAdd(){
    const box = L.DomUtil.create("div", "leaflet-bar leaflet-control leaflet-control-locate");
    const a = L.DomUtil.create("a", "", box);
    a.href = "#";
    a.title = "Show my location";
    a.setAttribute("role", "button");
    a.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>';
    L.DomEvent.disableClickPropagation(box);
    L.DomEvent.on(a, "click", (ev) => {
      L.DomEvent.preventDefault(ev);
      box.classList.add("busy");
      map.locate({ setView: true, maxZoom: 16, enableHighAccuracy: true });
    });
    this._box = box;
    return box;
  }
});
const locateControl = new LocateControl().addTo(map);

map.on("locationfound", (e) => {
  locateControl._box.classList.remove("busy");
  if (locationMarker) locationMarker.remove();
  locationMarker = L.layerGroup([
    L.circle(e.latlng, { radius: e.accuracy, weight: 1, color: "#2a7de1", fillOpacity: .12 }),
    L.circleMarker(e.latlng, { radius: 7, weight: 3, color: "#fff", fillColor: "#2a7de1", fillOpacity: 1 })
  ]).addTo(map);
});
map.on("locationerror", (e) => {
  locateControl._box.classList.remove("busy");
  showToast("Location unavailable: " + e.message);
});

// ---------- Panel ----------
const btnPanel = document.getElementById("btn-panel");
function setPanelHidden(hidden){
  document.body.classList.toggle("panel-hidden", hidden);
  btnPanel.setAttribute("aria-pressed", String(!hidden));
  saveJSON(PANEL_KEY, hidden);
  map.invalidateSize();
}
setPanelHidden(loadJSON(PANEL_KEY, false));
btnPanel.addEventListener("click", () => setPanelHidden(!document.body.classList.contains("panel-hidden")));

// Na mobilu je panel vysouvací — klepnutí na hlavičku ho rozbalí / sbalí
document.getElementById("panel-head").addEventListener("click", () => {
  if (isMobile()) document.body.classList.toggle("sheet-open");
});

mobileQuery.addEventListener("change", () => {
  document.body.classList.remove("sheet-open");
  map.invalidateSize();
});
window.addEventListener("resize", () => map.invalidateSize());

// ---------- Toast ----------
const toastEl = document.getElementById("toast");
let toastTimer = null;
function showToast(text, ms = 4000){
  toastEl.textContent = text;
  toastEl.hidden = false;
  clearTimeout(toastTimer);
  if (ms > 0) toastTimer = setTimeout(() => { toastEl.hidden = true; }, ms);
}

// Při otevření přes file:// prohlížeč neposílá Referer a OSM dlaždice
// odmítne. Aplikace musí běžet přes http(s) — upozorníme na to.
if (location.protocol === "file:") {
  showToast("Map tiles may be blocked when the app is opened as a local file. " +
    "Open it over http(s) instead, e.g. run \"python3 -m http.server\" in the app folder " +
    "and go to http://localhost:8000.", 0);
}

// ---------- Service worker (offline chod) ----------
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
