// ---------- Automatické odbočky ----------
// Navrhne waypointy odboček z tvaru trasy. Úhel se měří na vzdálenost (okno =
// rozestup) před a za bodem, takže i hustě zaznamenaná zatáčka dá jeden úhel.
// Z kandidátů v rozestupu podél trasy vyhraje největší úhel; kolem zachovaných
// waypointů a začátku/konce čáry je ochranná zóna — nevzniknou body těsně u sebe.
const GEN_TYPES = new Set(["Left_turn", "Right_turn", "Slight_left_turn", "Slight_right_turn",
  "Sharp_left_turn", "Sharp_right_turn", "U_turn", "Left_at_fork_turn", "Right_at_fork_turn"]);  // typy, které generátor umí (a v režimu Replace maže)
const GEN_KEY = "addturngpx.generator";
const genLayer = L.layerGroup().addTo(map);
let gen = null;     // { mode, minAngle, spacing, result } — karta je otevřená

function turnTypeFor(delta){
  const ad = Math.abs(delta), R = delta > 0;
  if (ad <= 45) return R ? "Slight_right_turn" : "Slight_left_turn";
  if (ad <= 135) return R ? "Right_turn" : "Left_turn";
  if (ad <= 170) return R ? "Sharp_right_turn" : "Sharp_left_turn";
  return "U_turn";
}
// Bod ve vzdálenosti s od začátku čáry (cum = kumulativní vzdálenosti vrcholů)
function pointAtDist(pts, cum, s){
  if (s <= 0) return pts[0];
  if (s >= cum[cum.length - 1]) return pts[pts.length - 1];
  let lo = 0, hi = cum.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (cum[m] <= s) lo = m; else hi = m; }
  const t = (s - cum[lo]) / ((cum[hi] - cum[lo]) || 1);
  return L.latLng(pts[lo].lat + (pts[hi].lat - pts[lo].lat) * t, pts[lo].lng + (pts[hi].lng - pts[lo].lng) * t);
}

// ---- Síť cest z OpenStreetMap (Overpass API) ----
const OVERPASS_URL = "https://overpass-api.de/api/interpreter";
let OVERPASS_TIMEOUT_MS = 90000;           // (testy ho zkracují)
const OVERPASS_BUSY = "The OpenStreetMap data server is overloaded or temporarily refusing requests. Try again in a few minutes.";
const OVERPASS_EMPTY = "The OpenStreetMap data server returned no roads or paths near the route. If the route follows mapped roads or paths, this is a temporary server problem – try again in a moment.";
// Pauzy před 2. a 3. pokusem při opakovatelné chybě (testy je zkracují)
let OVERPASS_RETRY_DELAYS_MS = [5000, 15000];
const ROAD_DATA_MAX_AGE_MS = 30 * 24 * 3600 * 1000;   // data o křižovatkách v prohlížeči platí 30 dní
const SKIP_HIGHWAY = /^(proposed|construction|abandoned|razed|disused|platform)$/;
let junctionCache = null;        // { key, junctions, fetchedAt, stored } — poslední načtená trasa

// Zjednodušení čáry (Douglas–Peucker) pro dotaz — tolerance v metrech
function simplifyLine(pts, tolM){
  if (pts.length < 3) return pts.slice();
  const P = pts.map(P18);
  // metry → pixely na zoomu 18 (velikost pixelu v metrech závisí na zeměpisné šířce)
  const metersPerPx = 40075016.686 * Math.cos(pts[0].lat * Math.PI / 180) / (256 * 2 ** 18);
  const tol = tolM / metersPerPx;
  const keep = new Uint8Array(pts.length); keep[0] = keep[pts.length - 1] = 1;
  const stack = [[0, pts.length - 1]];
  while (stack.length) {
    const [a, b] = stack.pop();
    let md = -1, mi = -1;
    const ax = P[a].x, ay = P[a].y, dx = P[b].x - ax, dy = P[b].y - ay, len = Math.hypot(dx, dy) || 1;
    for (let i = a + 1; i < b; i++) {
      const d = Math.abs(dy * (P[i].x - ax) - dx * (P[i].y - ay)) / len;
      if (d > md) { md = d; mi = i; }
    }
    if (md > tol) { keep[mi] = 1; stack.push([a, mi], [mi, b]); }
  }
  return pts.filter((_, i) => keep[i]);
}

// Jeden dotaz na Overpass; vrací data, při jakémkoli selhání vyhodí Error se srozumitelnou zprávou
const overpassError = (msg, retryable) => Object.assign(new Error(msg), { retryable });
async function overpassQuery(query){
  let res, data;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), OVERPASS_TIMEOUT_MS);
  try{
    res = await fetch(OVERPASS_URL, { method: "POST", body: new URLSearchParams({ data: query }), signal: ctrl.signal });
    if (res.ok) data = await res.json();
  }catch(e){
    if (e.name === "AbortError") throw overpassError(`The OpenStreetMap data server did not answer within ${Math.round(OVERPASS_TIMEOUT_MS / 1000)} seconds. ` + OVERPASS_BUSY.split(". ")[1], true);
    // Bez připojení, nebo server odmítl dotaz bez hlaviček CORS (typicky při přetížení)
    if (navigator.onLine === false) throw overpassError("You are offline – generating turns needs an internet connection.", false);
    throw overpassError(OVERPASS_BUSY, true);
  }finally{
    clearTimeout(timer);
  }
  const busy = [429, 502, 503, 504].includes(res.status);
  if (!res.ok) throw overpassError(busy ? OVERPASS_BUSY : `The OpenStreetMap data server responded with HTTP ${res.status}.`, busy);
  // Při přetížení server odpoví „úspěšně“, ale bez dat a s poznámkou o chybě
  // (remark: "runtime error: Query timed out…") — to není „0 křižovatek“.
  if (data?.remark) throw overpassError(OVERPASS_BUSY + " (Server message: " + String(data.remark).slice(0, 120) + ")", true);
  if (!Array.isArray(data?.elements)) throw overpassError("The OpenStreetMap data server sent an unexpected answer. Try again later.", true);
  // Prázdná odpověď (žádná cesta v okolí trasy) bývá vada přetíženého serveru —
  // jedna instance vrátí data, jiná nic
  if (!data.elements.length) throw overpassError(OVERPASS_EMPTY, true);
  return data;
}

// Klíč dat o křižovatkách = zjednodušený tvar trasy. Bod vložený na čáru
// (bod zájmu na dlouhém úseku) zjednodušení odstraní, takže klíč nezmění.
function roadDataKey(){
  return trackLines.map(({ pts }) => simplifyLine(pts, 5).map(p => p.lat.toFixed(5) + "," + p.lng.toFixed(5)).join(";")).join("|");
}

// Křižovatky v okolí trasy: uzly sítě cest s ≥ 3 různými sousedy.
// Pořadí zdrojů: paměť → uložená data v prohlížeči (≤ 30 dní) → Overpass
// (až 3 pokusy u opakovatelných chyb). force = stáhnout znovu.
// onProgress(text) hlásí průběh; cancelled() = karta byla mezitím zavřena.
async function loadJunctions({ force = false, onProgress = () => {}, cancelled = () => false } = {}){
  const key = roadDataKey();
  if (!force && junctionCache?.key === key) return junctionCache;
  if (!force) {
    try{
      const rec = await idbRun("readonly", st => st.get(key), JUNCTION_STORE);
      if (rec && Date.now() - rec.fetchedAt < ROAD_DATA_MAX_AGE_MS) {
        junctionCache = { key, fetchedAt: rec.fetchedAt, stored: true,
          junctions: rec.junctions.map(j => ({ latlng: L.latLng(j.lat, j.lng), branches: j.branches })) };
        return junctionCache;
      }
    }catch(e){ /* úložiště nedostupné → stáhnout */ }
  }
  const parts = trackLines.map(({ pts }) => "way(around:30," +
    simplifyLine(pts, 5).map(p => p.lat.toFixed(6) + "," + p.lng.toFixed(6)).join(",") + ")[highway];");
  const query = `[out:json][timeout:90];(${parts.join("")});out geom;`;
  const attempts = OVERPASS_RETRY_DELAYS_MS.length + 1;
  let data;
  for (let n = 1; ; n++) {
    onProgress(n === 1 ? "" : `Attempt ${n} of ${attempts}…`);
    try{
      data = await overpassQuery(query);
      break;
    }catch(e){
      if (!e.retryable || n >= attempts || cancelled()) throw e;
      const wait = OVERPASS_RETRY_DELAYS_MS[n - 1];
      onProgress(`The server did not answer properly – trying again in ${Math.round(wait / 1000)} s (attempt ${n + 1} of ${attempts}).`);
      await new Promise(r => setTimeout(r, wait));
      if (cancelled()) throw e;
    }
  }
  const nodes = new Map();      // id → { latlng, nb: Set(id) }
  for (const w of data.elements) {
    if (w.type !== "way" || !w.nodes || !w.geometry || SKIP_HIGHWAY.test(w.tags?.highway || "")) continue;
    w.nodes.forEach((id, i) => {
      if (!nodes.has(id)) nodes.set(id, { latlng: L.latLng(w.geometry[i].lat, w.geometry[i].lon), nb: new Set() });
      if (i > 0 && w.nodes[i - 1] !== id) { nodes.get(id).nb.add(w.nodes[i - 1]); nodes.get(w.nodes[i - 1]).nb.add(id); }
    });
  }
  const junctions = [];
  for (const n of nodes.values()) {
    if (n.nb.size < 3) continue;
    junctions.push({ latlng: n.latlng, branches: [...n.nb].map(id => bearing(n.latlng, nodes.get(id).latlng)) });
  }
  // Ukládá se jen úspěšná odpověď — do paměti i natrvalo do prohlížeče
  const fetchedAt = Date.now();
  junctionCache = { key, junctions, fetchedAt, stored: false };
  storeRoadData(key, junctions, fetchedAt);
  return junctionCache;
}
const ROAD_DATA_KEEP = 30;     // počet tras, pro které se data v prohlížeči drží
async function storeRoadData(key, junctions, fetchedAt){
  try{
    await idbRun("readwrite", st => st.put({ fetchedAt, junctions: junctions.map(j => ({ lat: j.latlng.lat, lng: j.latlng.lng, branches: j.branches })) }, key), JUNCTION_STORE);
    // Nejstarší záznamy nad limit smazat
    const all = await idbRun("readonly", st => st.getAll(), JUNCTION_STORE);
    const keys = await idbRun("readonly", st => st.getAllKeys(), JUNCTION_STORE);
    if (keys.length > ROAD_DATA_KEEP) {
      const old = keys.map((k, i) => [k, all[i].fetchedAt]).sort((a, b) => a[1] - b[1]).slice(0, keys.length - ROAD_DATA_KEEP);
      await idbRun("readwrite", st => { let r; for (const [k] of old) r = st.delete(k); return r; }, JUNCTION_STORE);
    }
  }catch(e){
    console.warn("Could not store road data:", e);
  }
}

const angleDiff = (a, b) => ((a - b) % 360 + 540) % 360 - 180;     // −180…180

// Pevné délky, nezávislé na nastaveném rozestupu: na jakou vzdálenost se měří
// směr příjezdu/odjezdu a jak daleko smí být bod trasy od uzlu křižovatky.
const TURN_ANGLE_WINDOW_M = 15;
const JUNCTION_MATCH_M = 15;

function computeTurns({ mode, minAngle, spacing }, junctions){
  // Zachované waypointy (chrání své okolí): v režimu Replace bez odboček, které se smažou
  const removed = mode === "replace"
    ? wptItems.filter(w => isEditable(w) && GEN_TYPES.has(canonType(w.type))) : [];
  const kept = wptItems.filter(w => !removed.includes(w));
  const lines = trackLines.map(({ pts }) => {
    const cum = [0];
    for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + pts[i - 1].distanceTo(pts[i]));
    return { pts, cum, total: cum[cum.length - 1] };
  });
  const cands = [];
  for (const J of junctions) {
    // Nejbližší bod trasy ke křižovatce
    let best = null;
    lines.forEach(({ pts }, li) => pts.forEach((p, idx) => {
      const d = J.latlng.distanceTo(p);
      if (d <= JUNCTION_MATCH_M && (!best || d < best.d)) best = { li, idx, d };
    }));
    if (!best) continue;
    const { pts, cum, total } = lines[best.li];
    const i = best.idx, s = cum[i];
    if (i === 0 || i === pts.length - 1 || s < spacing || total - s < spacing) continue;  // u začátku/konce ne
    const a = pointAtDist(pts, cum, s - TURN_ANGLE_WINDOW_M), b = pointAtDist(pts, cum, s + TURN_ANGLE_WINDOW_M);
    if (a.equals(pts[i], 0) || b.equals(pts[i], 0)) continue;
    const inB = bearing(a, pts[i]), outB = bearing(pts[i], b);
    const delta = angleDiff(outB, inB);
    // Větve před jezdcem (bez té, kudy přijel); rozcestí = právě 2 větve do ±60° od příjezdu
    const ahead = J.branches.map(br => angleDiff(br, inB)).filter(r => Math.abs(r) < 150);
    const forward = ahead.filter(r => Math.abs(r) <= 60);
    let type = null, prio = Math.abs(delta);
    if (forward.length === 2 && ahead.length === 2) {
      const taken = forward.reduce((x, y) => Math.abs(angleDiff(y, delta)) < Math.abs(angleDiff(x, delta)) ? y : x);
      const other = forward.find(r => r !== taken);
      type = taken < other ? "Left_at_fork_turn" : "Right_at_fork_turn";
      prio = 1000;                                                       // rozcestí má přednost
    } else if (Math.abs(delta) >= minAngle) {
      type = turnTypeFor(delta);
    }
    if (type) cands.push({ li: best.li, idx: i, s, delta, type, prio, latlng: pts[i] });
  }
  // Jedna křižovatka/zatáčka = jeden bod; ochranná zóna kolem zachovaných waypointů
  cands.sort((x, y) => y.prio - x.prio);
  const chosen = [];
  for (const c of cands) {
    if (chosen.some(o => o.li === c.li && Math.abs(o.s - c.s) < spacing)) continue;
    if (kept.some(w => w.latlng.distanceTo(c.latlng) < spacing)) continue;
    chosen.push({ ...c, bearing: incomingBearing(trackLines[c.li].pts, c.idx) });
  }
  chosen.sort((x, y) => routePos(x.li, x.idx) - routePos(y.li, y.idx));
  return { add: chosen, remove: removed, junctions: junctions.length };
}

function drawGenPreview(){
  genLayer.clearLayers();
  wptItems.forEach(w => w.marker.setOpacity(1));
  if (!gen) return;
  for (const c of gen.result.add) {
    L.marker(c.latlng, {
      interactive: false, keyboard: false, opacity: 0.7, zIndexOffset: 2500,
      icon: L.divIcon({ className: "wpt-icon cat-turn gen-preview", html: "<div>" + typeIconHtml(c.type, c.bearing || 0) + "</div>", iconSize: [30, 30] })
    }).addTo(genLayer);
  }
  for (const w of gen.result.remove) w.marker.setOpacity(0.25);
}

async function openGenerator(){
  if (!gpx?.editable || !trackLines.length) return;
  if (selectedWpt >= 0) deselectWpt();
  const saved = loadJSON(GEN_KEY, {});
  gen = { mode: "missing", minAngle: saved.minAngle ?? 20, spacing: saved.spacing ?? 15, loading: true };
  if (isMobile()) document.body.classList.add("sheet-open");
  await loadGeneratorData(gen);
}
// Stáhne křižovatky pro otevřenou kartu (i opakovaně tlačítkem Try again)
async function loadGeneratorData(g, { force = false } = {}){
  g.loading = true;
  g.error = null;
  g.progress = "";
  renderGeneratorCard();
  try{
    g.road = await loadJunctions({
      force,
      cancelled: () => gen !== g,               // zavřená karta → přestat opakovat
      onProgress: (text) => { g.progress = text; if (gen === g) renderGeneratorCard(); }
    });
    g.junctions = g.road.junctions;
  }catch(e){
    g.junctions = null;
    g.error = e.message;
  }
  g.loading = false;
  if (gen === g) updateGenerator();
}
function closeGenerator(){
  gen = null;
  drawGenPreview();
  const card = document.getElementById("gen-card");
  if (card) card.remove();
}
function updateGenerator(){
  gen.result = gen.junctions ? computeTurns(gen, gen.junctions) : { add: [], remove: [], junctions: 0 };
  drawGenPreview();
  renderGeneratorCard();
}
function applyGenerator(){
  const { add, remove } = gen.result;
  if (!add.length && !remove.length) { closeGenerator(); return; }
  const template = templateWpt();
  let text = gpx.text;
  // Pořadí <wpt> v souboru a jejich pozice na trase; nejdřív mazání (od konce)
  let seq = wptItems.filter(w => !w.fromRoute).sort((a, b) => a.order - b.order);
  for (const w of [...remove].sort((a, b) => b.order - a.order)) text = deleteWptText(text, w.order);
  seq = seq.filter(w => !remove.includes(w)).map(w => w.pos ?? Infinity);
  for (const c of add) {
    const pos = routePos(c.li, c.idx);
    let k = seq.findIndex(p => p > pos);
    if (k < 0) k = seq.length;
    const v = vertexData(c.li, c.idx);
    text = insertWptText(text, k, buildWptXml(template, { lat: v.lat, lon: v.lon, ele: v.ele, type: c.type }));
    seq.splice(k, 0, pos);
  }
  const msg = `Added ${add.length} turn${add.length === 1 ? "" : "s"}` + (remove.length ? `, removed ${remove.length}` : "") + ". Undo reverts it in one step.";
  closeGenerator();
  commitEdit(text, null);
  showToast(msg);
}

function renderGeneratorCard(){
  const slot = document.getElementById("editor-slot");
  if (!slot || !gen) return;
  slot.replaceChildren();
  const card = el("div", "editor");
  card.id = "gen-card";
  card.append(el("h3", null, "Generate turns"));

  const modes = el("div", "gen-modes");
  for (const [val, label, hint] of [
    ["missing", "Add missing turns", "Keeps all existing waypoints."],
    ["replace", "Replace all turns", "Removes left/right/slight/sharp/U-turn and fork waypoints first. Roundabouts, straight on, points of interest and start/end are kept."]
  ]) {
    const lab = el("label", "gen-mode");
    const r = el("input"); r.type = "radio"; r.name = "gen-mode"; r.value = val; r.checked = gen.mode === val;
    r.addEventListener("change", () => { gen.mode = val; updateGenerator(); });
    const txt = el("span");
    txt.append(el("strong", null, label), el("span", "hint", hint));
    lab.append(r, txt);
    modes.append(lab);
  }
  card.append(modes);

  const num = (label, key, min, max, step, unit) => {
    const lab = el("label", "gen-num", label);
    const inp = el("input"); inp.type = "number"; inp.min = min; inp.max = max; inp.step = step; inp.value = gen[key];
    inp.addEventListener("change", () => {
      const v = Math.min(max, Math.max(min, Number(inp.value) || gen[key]));
      inp.value = v; gen[key] = v;
      saveJSON(GEN_KEY, { minAngle: gen.minAngle, spacing: gen.spacing });
      updateGenerator();
    });
    lab.append(inp, el("span", null, unit));
    return lab;
  };
  const row = el("div", "gen-row");
  row.append(num("Minimum angle", "minAngle", 5, 170, 5, "°"), num("Minimum spacing", "spacing", 5, 500, 5, "m"));
  card.append(row);

  const { add, remove } = gen.result || { add: [], remove: [] };
  if (gen.loading) {
    card.append(el("div", "gen-summary", "Loading the road network from OpenStreetMap…"));
    card.append(el("div", "hint", gen.progress || "The public data server is sometimes busy – this can take up to a minute."));
  }
  else if (gen.error) {
    card.append(el("div", "wwarn", "⚠ " + gen.error));
    const retry = el("button", null, "Try again"); retry.type = "button";
    retry.style.marginTop = "8px";
    retry.addEventListener("click", () => loadGeneratorData(gen));
    card.append(retry);
  }
  else card.append(el("div", "gen-summary",
    add.length || remove.length
      ? `${add.length} turn${add.length === 1 ? "" : "s"} will be added` + (remove.length ? `, ${remove.length} removed` : "") + " (preview on the map)."
      : "No new turns found with these settings."));
  if (!gen.loading && !gen.error) {
    card.append(el("div", "gen-junctions", gen.result.junctions
      ? `${gen.result.junctions} junctions found near the route.`
      : "No junctions found near the route – the route may not follow roads or paths mapped in OpenStreetMap."));
    // Odkud data jsou; uložená data jde stáhnout znovu (OSM se mění)
    const age = el("div", "hint gen-data");
    const when = new Date(gen.road.fetchedAt).toLocaleDateString();
    age.append(gen.road.stored ? `Road data stored in this browser on ${when}. ` : "Road data downloaded now and stored in this browser. ");
    const refresh = el("button", "linkish", "Refresh road data"); refresh.type = "button";
    refresh.addEventListener("click", () => loadGeneratorData(gen, { force: true }));
    age.append(refresh);
    card.append(age);
    card.append(el("div", "hint", "Turns are placed only at junctions of the road and path network. Forks are detected; roundabouts and “straight on” must be added manually."));
  }
  card.append(el("div", "hint", "Junction data © OpenStreetMap contributors (via Overpass API)."));

  const btns = el("div", "row");
  btns.style.marginTop = "10px";
  const ok = el("button", "primary", "Apply"); ok.type = "button"; ok.disabled = gen.loading || (!add.length && !remove.length);
  const cancel = el("button", null, "Cancel"); cancel.type = "button";
  ok.addEventListener("click", applyGenerator);
  cancel.addEventListener("click", closeGenerator);
  btns.append(ok, cancel);
  card.append(btns);
  slot.append(card);
  card.scrollIntoView({ block: "nearest" });
}

// ---- Potvrzení před zahozením neuložených změn ----
const confirmDialog = document.getElementById("confirm-dialog");
function confirmDiscard(){
  if (!gpx?.dirty) return Promise.resolve(true);
  document.getElementById("confirm-text").textContent =
    `“${gpx.fileName}” has changes that have not been saved to a file. They will be lost.`;
  confirmDialog.showModal();
  return new Promise((resolve) => {
    const done = (v) => { confirmDialog.close(); cleanup(); resolve(v); };
    const ok = (e) => { e.preventDefault(); done(true); };
    const cancel = () => done(false);
    const onClose = () => { cleanup(); resolve(false); };
    const form = document.getElementById("confirm-form");
    const cbtn = document.getElementById("confirm-cancel");
    function cleanup(){ form.removeEventListener("submit", ok); cbtn.removeEventListener("click", cancel); confirmDialog.removeEventListener("close", onClose); }
    form.addEventListener("submit", ok);
    cbtn.addEventListener("click", cancel);
    confirmDialog.addEventListener("close", onClose);
  });
}

// ---------- GPX: načtení a zavření ----------
function setGpx(next, { fit = true, persist = true } = {}){
  if (next) {
    next.dirty = !!next.dirty;
    next.cleanText = next.dirty ? null : next.text;   // text, který odpovídá souboru na disku
  }
  editHistory.undo.length = editHistory.redo.length = 0;
  gpx = next;
  renderGpx(fit);
  if (persist) saveSession();
}

// Vrací true při úspěchu; chybu ukáže uživateli
function loadGpxText(text, meta){
  try{
    const parsed = parseGpx(text);
    setGpx({ ...parsed, fileName: meta.fileName || "track.gpx", sourceUrl: meta.sourceUrl || null, handle: meta.handle || null });
    return true;
  }catch(e){
    showToast(`Could not open ${meta.fileName || "the file"}: ${e.message}`, 8000);
    return false;
  }
}

async function closeGpx(){
  if (!(await confirmDiscard())) return;
  setGpx(null, { fit: false });
}

const dropEl = document.getElementById("drop");
let dragDepth = 0;
const hasFiles = (e) => Array.from(e.dataTransfer?.types || []).includes("Files");
window.addEventListener("dragenter", (e) => { if (hasFiles(e)) { dragDepth++; dropEl.hidden = false; } });
window.addEventListener("dragleave", (e) => { if (hasFiles(e) && --dragDepth <= 0) { dragDepth = 0; dropEl.hidden = true; } });
window.addEventListener("dragover", (e) => { if (hasFiles(e)) e.preventDefault(); });
window.addEventListener("drop", async (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  dragDepth = 0;
  dropEl.hidden = true;
  const item = Array.from(e.dataTransfer.items).find(it => it.kind === "file");
  if (!item) return;
  // Chrome umí i u přetaženého souboru vrátit handle (pro pozdější uložení zpět)
  const handlePromise = item.getAsFileSystemHandle ? item.getAsFileSystemHandle().catch(() => null) : Promise.resolve(null);
  const file = item.getAsFile();
  const handle = await handlePromise;
  if (!(await confirmDiscard())) return;
  loadGpxText(await decodeText(file), { fileName: file.name, handle: handle?.kind === "file" ? handle : null });
});

// ---------- Otevření z URL ----------
// Odkaz na soubor na github.com převedeme na „raw“ adresu, která povoluje CORS
function normalizeUrl(u){
  const m = u.match(/^https:\/\/github\.com\/([^/]+)\/([^/]+)\/blob\/(.+)$/);
  return m ? `https://raw.githubusercontent.com/${m[1]}/${m[2]}/${m[3]}` : u;
}
// Název souboru: z URL, pokud končí na .gpx; jinak (např. Suunto export,
// kde je v URL jen dlouhý kód) podle <metadata><name> ze souboru.
// Hlavička Content-Disposition s názvem se čte, jen pokud ji server zpřístupní.
function fileNameFor(url, res, parsed){
  const cd = res.headers.get("Content-Disposition") || "";
  const m = cd.match(/filename\*?=(?:UTF-8'')?"?([^";]+)"?/i);
  if (m) return decodeURIComponent(m[1]);
  const last = decodeURIComponent(url.pathname.split("/").filter(Boolean).pop() || "");
  if (/\.gpx$/i.test(last)) return last;
  const meta = metadataName(parsed.doc, parsed.ns).replace(/[\\/:*?"<>|]+/g, "_");
  return (meta || "track") + ".gpx";
}

// Stáhne a otevře GPX; při chybě vyhodí Error se srozumitelnou zprávou
async function openFromUrl(input){
  let url;
  try{ url = new URL(normalizeUrl(input.trim())); }
  catch(e){ throw new Error("This is not a valid URL."); }
  if (!/^https?:$/.test(url.protocol)) throw new Error("Only http:// and https:// URLs are supported.");
  if (location.protocol === "https:" && url.protocol === "http:") {
    throw new Error("The browser does not allow loading an http:// URL from this secure (https://) page. Try the https:// version of the link, or download the file and use Open.");
  }
  let res;
  try{
    res = await fetch(url.href, { credentials: "omit", cache: "no-store" });
  }catch(e){
    throw new Error("The file could not be downloaded. Most likely the server does not allow other websites to read its files (CORS), or the network is unavailable. Download the file in your browser and open it with “Open local file” instead.");
  }
  if (!res.ok) throw new Error(`The server responded with HTTP ${res.status}${res.statusText ? " " + res.statusText : ""}.`);
  const parsed = parseGpx(await decodeText(res));
  setGpx({ ...parsed, fileName: fileNameFor(url, res, parsed), sourceUrl: url.href, handle: null });
}

// ---------- Uložení ----------
// Ukládá se přesně text v paměti (UTF-8). Nezměněné části souboru jsou tak
// bajt po bajtu stejné jako originál — včetně BOM, konců řádků a deklarace.
const btnSave = document.getElementById("btn-save");
const canPickSave = typeof window.showSaveFilePicker === "function";
const GPX_TYPE = "application/gpx+xml";

// Text k uložení; soubor v jiném kódování se převede na UTF-8 (upraví se deklarace)
function textForSave(){
  if (!gpx.encoding || /^utf-?8$/i.test(gpx.encoding)) return { text: gpx.text, converted: false };
  const text = gpx.text.replace(/^(\uFEFF?<\?xml[^>]*?encoding\s*=\s*)(["'])[^"']*\2/i, (all, pre, q) => pre + q + "UTF-8" + q);
  return { text, converted: true };
}
const gpxFile = (text) => new File([new TextEncoder().encode(text)], gpx.fileName, { type: GPX_TYPE });

async function writeToHandle(handle, file){
  if (handle.queryPermission && (await handle.queryPermission({ mode: "readwrite" })) !== "granted") {
    if ((await handle.requestPermission({ mode: "readwrite" })) !== "granted") throw new Error("Permission to write the file was denied.");
  }
  const w = await handle.createWritable();
  await w.write(file);
  await w.close();
}
function downloadFile(file){
  const url = URL.createObjectURL(file);
  const a = el("a");
  a.href = url;
  a.download = file.name;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}

// as = true → vždy se zeptat, kam uložit (Save as…)
async function saveGpx({ as = false } = {}){
  if (!gpx) return;
  document.activeElement?.blur?.();            // potvrdit rozepsaný název waypointu
  const { text, converted } = textForSave();
  const fromEncoding = gpx.encoding;
  const file = gpxFile(text);
  let how;
  try{
    if (!as && gpx.handle) {
      await writeToHandle(gpx.handle, file);
      how = `Saved to ${gpx.handle.name}.`;
    } else if (canPickSave) {
      const handle = await window.showSaveFilePicker({
        suggestedName: gpx.fileName,
        types: [{ description: "GPX file", accept: { [GPX_TYPE]: [".gpx"] } }]
      });
      await writeToHandle(handle, file);
      gpx.handle = handle;
      gpx.fileName = handle.name;
      how = `Saved as ${handle.name}.`;
    } else {
      downloadFile(file);
      how = `Downloaded ${file.name}.`;
    }
  }catch(e){
    if (e.name !== "AbortError") showToast("Could not save the file: " + e.message, 8000);
    return;
  }
  markSaved(text);
  showToast(how + (converted ? ` The file was converted from ${fromEncoding} to UTF-8.` : ""));
}

// Uložený text je nový výchozí stav („Modified“ zmizí; Undo dál funguje)
function markSaved(text){
  gpx.cleanText = text;
  const sel = selectedOrder();
  applyText(text, sel);
}

}

// ---------- Relace v IndexedDB (přežije obnovení stránky) ----------
const DB_NAME = "addturngpx";
const DB_STORE = "session";
const JUNCTION_STORE = "junctions";     // data o křižovatkách pro generátor (podle tvaru trasy)
function idbOpen(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 2);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
      if (!db.objectStoreNames.contains(JUNCTION_STORE)) db.createObjectStore(JUNCTION_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbRun(mode, fn, store = DB_STORE){
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, mode);
    const req = fn(tx.objectStore(store));
    tx.oncomplete = () => { db.close(); resolve(req.result); };
    tx.onerror = tx.onabort = () => { db.close(); reject(tx.error); };
  });
}
async function saveSession(){
  try{
    if (!gpx) { await idbRun("readwrite", s => s.delete("current")); return; }
    const rec = {
      xml: gpx.text,
      fileName: gpx.fileName, sourceUrl: gpx.sourceUrl, handle: gpx.handle, dirty: !!gpx.dirty, savedAt: Date.now()
    };
    try{
      await idbRun("readwrite", s => s.put(rec, "current"));
    }catch(e){
      // Některé prohlížeče neumí uložit file handle — uložíme relaci bez něj
      if (!rec.handle) throw e;
      rec.handle = null;
      await idbRun("readwrite", s => s.put(rec, "current"));
    }
  }catch(e){
    console.warn("Could not save the session:", e);
  }
}
async function restoreSession(){
  try{
    const rec = await idbRun("readonly", s => s.get("current"));
    if (!rec?.xml) return false;
    setGpx({ ...parseGpx(rec.xml), fileName: rec.fileName, sourceUrl: rec.sourceUrl, handle: rec.handle || null, dirty: !!rec.dirty }, { fit: false, persist: false });
    return true;
  }catch(e){
    console.warn("Could not restore the session:", e);
    return false;
  }
}

// ---------- Start ----------
// ?url=… otevře GPX z odkazu; parametr pak z adresy odstraníme, aby obnovení
// stránky načetlo uloženou relaci (i s úpravami), ne znovu původní soubor.
async function startup(){
  const params = new URLSearchParams(location.search);
  const linkUrl = params.get("url");
  if (linkUrl) {
    params.delete("url");
    const rest = params.toString();
    history.replaceState(null, "", location.pathname + (rest ? "?" + rest : "") + location.hash);
    // Neuložené úpravy v relaci nezahodit bez zeptání
    await restoreSession();
    if (!(await confirmDiscard())) return;
    try{
      await openFromUrl(linkUrl);
      return;
    }catch(e){
      openUrlDialog(linkUrl, e.message);
      return;
    }
  }
  if (!(await restoreSession())) renderGpx(false);
}
startup();

// ---------- Service worker (offline chod) ----------
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
