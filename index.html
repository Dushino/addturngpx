<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AddTurn GPX</title>
<meta name="theme-color" content="#f3f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141a17" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AddTurn GPX">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
  /* ---------- Barvy: světlý režim je výchozí, tmavý podle systému ---------- */
  :root{
    color-scheme: light;
    --bg: #f3f5f2;
    --surface: #ffffff;
    --surface-2: #e8ece8;
    --text: #1b231f;
    --text-muted: #5d6b63;
    --border: #cfd7d1;
    --accent: #2f7a55;
    --accent-text: #ffffff;
    --shadow: 0 2px 10px rgba(0,0,0,.15);
    --bar-h: 48px;
    --btn-h: 34px;
    --panel-w: 300px;
    --sheet-peek: 58px; /* výška sbaleného spodního panelu na mobilu */
  }
  @media (prefers-color-scheme: dark){
    :root{
      color-scheme: dark;
      --bg: #141a17;
      --surface: #1c2420;
      --surface-2: #26302b;
      --text: #e3ebe6;
      --text-muted: #97a69d;
      --border: #34413a;
      --accent: #5cb98a;
      --accent-text: #0e1612;
      --shadow: 0 2px 12px rgba(0,0,0,.5);
    }
  }
  /* Dotykové ovládání: větší tlačítka */
  @media (pointer: coarse){
    :root{ --bar-h: 56px; --btn-h: 44px; }
  }

  *{ box-sizing: border-box; }
  /* Atribut hidden musí vyhrát i nad display: flex apod. */
  [hidden]{ display: none !important; }
  html, body{ height: 100%; margin: 0; }
  body{
    background: var(--bg);
    color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- Horní lišta ---------- */
  #topbar{
    flex: 0 0 auto;
    min-height: calc(var(--bar-h) + env(safe-area-inset-top, 0px));
    padding: env(safe-area-inset-top, 0px) max(10px, env(safe-area-inset-right, 0px)) 0 max(10px, env(safe-area-inset-left, 0px));
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    z-index: 1100;
  }
  #topbar .brand{
    display: flex; align-items: center; gap: 8px;
    font-weight: 650; white-space: nowrap; margin-right: auto;
  }
  #topbar .brand img{ width: 26px; height: 26px; border-radius: 6px; }
  #topbar a.brand{ color: inherit; text-decoration: none; border-radius: 8px; }
  #topbar a.brand:hover span{ text-decoration: underline; }
  #topbar a.brand:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }
  .actions{ display: flex; gap: 6px; }
  button{
    font: inherit;
    height: var(--btn-h);
    min-width: var(--btn-h);
    padding: 0 12px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface-2);
    color: var(--text);
    cursor: pointer;
  }
  button:hover:not(:disabled){ border-color: var(--accent); }
  button:focus-visible{ outline: 2px solid var(--accent); outline-offset: 1px; }
  button:disabled{ opacity: .45; cursor: default; }
  button.primary{ background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button svg{ width: 18px; height: 18px; flex: 0 0 auto; }

  /* ---------- Hlavní plocha: mapa + panel ---------- */
  #main{ flex: 1 1 auto; display: flex; min-height: 0; position: relative; }
  #map{ flex: 1 1 auto; min-width: 0; background: #e6e4df; }
  /* Mapa zůstává vždy ve světlém provedení, i v tmavém režimu */
  #map, #map .leaflet-control{ color-scheme: light; color: #333; }

  #panel{
    flex: 0 0 var(--panel-w);
    width: var(--panel-w);
    display: flex; flex-direction: column;
    background: var(--surface);
    border-left: 1px solid var(--border);
    min-height: 0;
  }
  body.panel-hidden #panel{ display: none; }
  #panel-head{
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
  }
  #panel-head .count{ color: var(--text-muted); font-weight: 400; margin-right: auto; }
  #panel-grip{ display: none; }
  #panel-body{ flex: 1 1 auto; overflow: auto; padding: 12px; }
  .empty{ color: var(--text-muted); }

  /* ---------- Zpráva (toast) ---------- */
  #toast{
    position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%);
    max-width: min(90vw, 460px);
    padding: 10px 14px;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    box-shadow: var(--shadow);
    z-index: 1200;
  }

  /* Vlastní ovládací prvek mapy „moje poloha“ */
  .leaflet-control-locate a{ display: flex !important; align-items: center; justify-content: center; }
  .leaflet-control-locate svg{ width: 18px; height: 18px; }
  .leaflet-control-locate.busy a{ opacity: .5; }
  .leaflet-control-fit.disabled a{ opacity: .35; pointer-events: none; }
  @media (pointer: coarse){
    .leaflet-touch .leaflet-bar a{ width: 44px; height: 44px; line-height: 44px; }
  }

  /* ---------- Panel: info o souboru a seznam waypointů ---------- */
  .file-info{
    display: flex; gap: 8px; align-items: flex-start;
    padding: 10px; margin-bottom: 12px;
    background: var(--surface-2); border-radius: 8px;
  }
  .file-info .text{ flex: 1 1 auto; min-width: 0; }
  .file-info .name{ font-weight: 600; overflow-wrap: anywhere; }
  .file-info .meta{ color: var(--text-muted); font-size: 13px; }
  .file-actions{ display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .file-info .file-actions button{ width: auto; padding: 0 12px; background: var(--surface); border-color: var(--border); }
  .file-info button{ flex: 0 0 auto; padding: 0; width: var(--btn-h); background: transparent; border-color: transparent; }
  .file-info button:hover{ border-color: var(--border); }
  #wpt-list{ list-style: none; margin: 0; padding: 0; }
  #wpt-list li{
    display: flex; gap: 10px; align-items: flex-start;
    padding: 8px 10px; border-radius: 8px; cursor: pointer;
  }
  #wpt-list li:hover{ background: var(--surface-2); }
  #wpt-list li.selected{ background: var(--surface-2); outline: 2px solid var(--accent); outline-offset: -2px; }
  #wpt-list .idx{ color: var(--text-muted); font-variant-numeric: tabular-nums; min-width: 1.4em; text-align: right; align-self: center; }
  #wpt-list .wname{ font-weight: 500; overflow-wrap: anywhere; }
  #wpt-list .wdesc{ color: var(--text-muted); font-size: 13px; overflow-wrap: anywhere; }
  .hint{ color: var(--text-muted); font-size: 13px; }
  .add-hint{ margin: 0 0 10px; }

  /* ---------- Prvky na mapě ---------- */
  /* Waypoint: kroužek se šipkou typu odbočky (šipka natočená podle příjezdu) */
  .wpt-icon div, .ticon{
    width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: #f08c00; color: #fff; border: 2px solid #fff;
    box-shadow: 0 0 0 1px rgba(0,0,0,.35), 0 1px 4px rgba(0,0,0,.4);
    transition: transform .12s ease;
  }
  .wpt-icon svg, .ticon svg{ width: 18px; height: 18px; display: block; }
  .wpt-icon div, .ticon{ position: relative; }
  /* Barvy skupin bodů zájmu (POI_GROUPS); odbočky zůstávají oranžové */
  .wpt-icon.cat-danger div, .ticon.cat-danger{ background: #e03131; }
  .wpt-icon.cat-water div, .ticon.cat-water{ background: #1c7ed6; }
  .wpt-icon.cat-nature div, .ticon.cat-nature{ background: #5c940d; }
  .wpt-icon.cat-food div, .ticon.cat-food{ background: #8d5a2b; }
  .wpt-icon.cat-orient div, .ticon.cat-orient{ background: #1098ad; }
  .wpt-icon.cat-generic div, .ticon.cat-generic{ background: #7048e8; }
  /* Číslo výjezdu z kruhového objezdu — uprostřed kruhu, nenatáčí se */
  .rnum{ position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 700 10px/1 system-ui, sans-serif; }
  .ticon .rnum{ font-size: 8px; }
  .wpt-icon.selected div{ transform: scale(1.3); box-shadow: 0 0 0 3px #1f6feb, 0 2px 8px rgba(0,0,0,.5); }
  /* Mimo bod trasy — Suunto by waypoint ignoroval */
  .wpt-icon.warn div, .ticon.warn{ background: #868e96; outline: 2px dashed #e03131; outline-offset: 1px; }

  .ticon{ flex: 0 0 auto; width: 24px; height: 24px; align-self: center; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
  .ticon svg{ width: 16px; height: 16px; }
  .ticon.start{ background: #2f9e44; font: 700 11px/1 system-ui, sans-serif; }
  .ticon.finish{ background: #e03131; font: 700 11px/1 system-ui, sans-serif; }
  #wpt-list .wwarn{ color: #b35c00; font-size: 13px; }
  .file-info .warn{ color: #b35c00; }
  @media (prefers-color-scheme: dark){ #wpt-list .wwarn, .file-info .warn{ color: #ffc078; } }
  .end-icon div{
    width: 20px; height: 20px; border-radius: 50%;
    border: 3px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.35);
    color: #fff; font: 700 10px/14px system-ui, sans-serif; text-align: center;
  }
  .end-icon.start div{ background: #2f9e44; }
  .end-icon.finish div{ background: #e03131; }
  .end-icon.selected div{ transform: scale(1.3); box-shadow: 0 0 0 3px #1f6feb; }
  #wpt-list li.fixed .wname{ color: var(--text-muted); }
  .dir-arrow svg{ display: block; width: 14px; height: 14px; }

  /* ---------- Editor waypointu ---------- */
  .editor{
    margin-bottom: 12px; padding: 12px;
    border: 2px solid var(--accent); border-radius: 10px;
    background: var(--surface);
  }
  .editor h3{ margin: 0 0 10px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .editor label, .editor .elabel{ display: block; margin: 10px 0 4px; font-size: 13px; color: var(--text-muted); }
  .editor input[type=text]{
    width: 100%; height: var(--btn-h); padding: 0 10px;
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px;
  }
  .editor input[type=text]:focus{ outline: 2px solid var(--accent); outline-offset: -1px; }
  .editor .row{ display: flex; flex-wrap: wrap; gap: 6px; }
  .editor .row button{ flex: 1 1 auto; }
  .editor .hint{ margin-top: 4px; }
  .gen-modes{ display: flex; flex-direction: column; gap: 8px; }
  .gen-mode{ display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
  .gen-mode input{ margin-top: 3px; accent-color: var(--accent); }
  .gen-mode .hint{ display: block; }
  .gen-row{ display: flex; flex-wrap: wrap; gap: 10px 16px; margin-top: 12px; }
  .gen-num{ display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-muted); }
  .gen-num input{
    width: 72px; height: var(--btn-h); padding: 0 8px; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  }
  .gen-summary{ margin-top: 12px; font-weight: 600; }
  .gen-junctions{ margin-top: 4px; font-size: 13px; }
  .gen-data{ margin-top: 4px; }
  button.linkish{ height: auto; min-width: 0; padding: 0; border: none; background: none; color: var(--accent); text-decoration: underline; font-size: inherit; cursor: pointer; }
  .gen-preview div{ outline: 2px dashed #1f6feb; outline-offset: 2px; }
  .tgroup{ grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; margin: 8px 0 2px; font-size: 12px; font-weight: 600; color: var(--text-muted); }
  .tgroup:first-child{ margin-top: 2px; }
  .ticon.dot{ width: 10px; height: 10px; box-shadow: none; border: none; }
  .tgrid{ display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 4px; }
  .tbtn{
    position: relative; padding: 0; height: 38px; min-width: 0;
    background: transparent; border-color: transparent;
  }
  .tbtn .ticon{ margin: auto; }
  .tbtn.selected{ background: var(--surface-2); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  /* Navržený typ podle úhlu trasy */
  .tbtn.suggested::after{
    content: ""; position: absolute; top: 3px; right: 3px;
    width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
  }
  .tlabel{ margin-top: 6px; font-size: 13px; }
  .editor details{ margin-top: 8px; }
  .editor summary{ cursor: pointer; font-size: 13px; color: var(--text-muted); padding: 4px 0; }
  .editor .confirm{ display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .editor .confirm span{ flex: 1 1 100%; font-size: 13px; }
  button.danger{ background: #e03131; border-color: #e03131; color: #fff; }
  button.danger-outline{ color: #e03131; }
  @media (prefers-color-scheme: dark){ button.danger-outline{ color: #ff8787; } }
  @media (pointer: coarse){ .tgrid{ grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); } .tbtn{ height: 44px; } }
  .badge{
    display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 9px;
    font-size: 12px; font-weight: 600; background: #f08c00; color: #fff; vertical-align: 1px;
  }

  .vdot{ pointer-events: none; }

  /* ---------- Dialog „Open URL“ ---------- */
  dialog{
    width: min(92vw, 520px);
    padding: 18px;
    color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--shadow);
  }
  dialog::backdrop{ background: rgba(0,0,0,.4); }
  dialog h2{ margin: 0 0 12px; font-size: 17px; }
  dialog input[type=url]{
    width: 100%; height: var(--btn-h); padding: 0 10px;
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px;
  }
  dialog input[type=url]:focus{ outline: 2px solid var(--accent); outline-offset: -1px; }
  dialog .error{ margin: 10px 0 0; color: #e03131; }
  @media (prefers-color-scheme: dark){ dialog .error{ color: #ff8787; } }
  .dialog-actions{ display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .dialog-actions .spacer{ flex: 1 1 auto; }

  /* ---------- Přetažení souboru ---------- */
  #drop{
    position: fixed; inset: 10px;
    display: flex; align-items: center; justify-content: center;
    border: 3px dashed var(--accent); border-radius: 16px;
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    font-size: 20px; font-weight: 600;
    z-index: 2000; pointer-events: none;
  }

  /* ---------- Mobilní rozložení ----------
     Úzká obrazovka, nebo dotykové zařízení s malou výškou (telefon na šířku).
     Boční panel se mění na vysouvací spodní panel. */
  @media (max-width: 760px), (pointer: coarse) and (max-height: 500px){
    #topbar .brand span{ display: none; }
    .actions button .label{ display: none; }
    #btn-panel{ display: none; }

    #main{ flex-direction: column; }
    #panel, body.panel-hidden #panel{
      display: flex;
      position: absolute; left: 0; right: 0; bottom: 0;
      width: auto;
      height: 50%;
      border-left: none;
      border-top: 1px solid var(--border);
      border-radius: 14px 14px 0 0;
      box-shadow: var(--shadow);
      z-index: 1000;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      transition: transform .22s ease;
    }
    /* Sbalený panel: vidět je jen hlavička */
    body:not(.sheet-open) #panel{
      transform: translateY(calc(100% - var(--sheet-peek) - env(safe-area-inset-bottom, 0px)));
    }
    #panel-head{ cursor: pointer; flex-wrap: wrap; row-gap: 0; padding-top: 0; height: var(--sheet-peek); }
    #panel-grip{
      display: block; flex: 0 0 100%; height: 14px;
      background: linear-gradient(var(--border), var(--border)) center / 40px 4px no-repeat;
    }
    /* Atribuce a spodní prvky mapy nad sbaleným panelem, ať nejsou zakryté */
    #map .leaflet-bottom{ bottom: calc(var(--sheet-peek) + env(safe-area-inset-bottom, 0px)); }
    #toast{ bottom: calc(var(--sheet-peek) + 16px + env(safe-area-inset-bottom, 0px)); }
  }
</style>
</head>
<body>

<header id="topbar">
  <a class="brand" href="https://github.com/Dushino/addturngpx" target="_blank" rel="noopener" title="AddTurn GPX on GitHub – documentation and source code"><img src="icon.svg" alt=""><span>AddTurn GPX</span></a>
  <div class="actions">
    <button id="btn-open" title="Open GPX file">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span class="label">Open</span>
    </button>
    <button id="btn-url" title="Open GPX from URL">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
      <span class="label">Open URL</span>
    </button>
    <button id="btn-undo" disabled title="Undo (Ctrl+Z)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
    </button>
    <button id="btn-redo" disabled title="Redo (Ctrl+Y)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
    </button>
    <button id="btn-save" class="primary" disabled title="Save GPX">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
      <span class="label">Save</span>
    </button>
    <button id="btn-panel" title="Show / hide waypoint panel" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
    </button>
  </div>
</header>

<div id="main">
  <div id="map"></div>
  <aside id="panel">
    <div id="panel-head">
      <div id="panel-grip"></div>
      <span>Waypoints</span><span class="count" id="wpt-count"></span>
    </div>
    <div id="panel-body"></div>
  </aside>
  <div id="toast" hidden></div>
</div>

<input type="file" id="file-input" hidden>

<dialog id="url-dialog">
  <form id="url-form">
    <h2>Open GPX from URL</h2>
    <input type="url" id="url-input" placeholder="https://example.com/track.gpx" required autocomplete="url">
    <p class="error" id="url-error" hidden></p>
    <div class="dialog-actions">
      <button type="button" id="url-local" hidden>Open local file instead</button>
      <span class="spacer"></span>
      <button type="button" id="url-cancel">Cancel</button>
      <button type="submit" class="primary" id="url-ok">Open</button>
    </div>
  </form>
</dialog>

<div id="drop" hidden>Drop a GPX file to open it</div>

<dialog id="confirm-dialog">
  <form id="confirm-form">
    <h2 id="confirm-title">Discard changes?</h2>
    <p id="confirm-text"></p>
    <div class="dialog-actions">
      <span class="spacer"></span>
      <button type="button" id="confirm-cancel">Cancel</button>
      <button type="submit" class="primary danger" id="confirm-ok">Discard</button>
    </div>
  </form>
</dialog>

<script src="vendor/leaflet/leaflet.js"></script>
<script>
"use strict";

// ---------- Nastavení a perzistence ----------
const VIEW_KEY = "addturngpx.view";
const PANEL_KEY = "addturngpx.panelHidden";
const DEFAULT_VIEW = { lat: 49.8, lng: 15.5, zoom: 7 }; // Česko

function loadJSON(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  }catch(e){ return fallback; }
}
function saveJSON(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){}
}

// ---------- Rozložení: mobil / desktop ----------
// Řídí se CSS media query (stejná jako v <style>), ne podle User-Agent,
// takže se GUI přizpůsobí i změně velikosti okna nebo otočení telefonu.
const mobileQuery = window.matchMedia("(max-width: 760px), (pointer: coarse) and (max-height: 500px)");
function isMobile(){ return mobileQuery.matches; }

// ---------- Mapa ----------
const savedView = loadJSON(VIEW_KEY, DEFAULT_VIEW);
// Jemnější zoom: kolečko myši po ~½ úrovně (zoomSnap ¼), tlačítka +/− dál po celé úrovni
// Dvojklik nepřibližuje: klik na trasu přidává waypoint, dvojklik by přidal a hned vybral

let locationMarker = null;

  options: { position: "topleft" },
  onAdd(){
    const box = L.DomUtil.create("div", "leaflet-bar leaflet-control leaflet-control-locate");
    const a = L.DomUtil.create("a", "", box);
    a.href = "#";
    a.title = "Show my location";
    a.setAttribute("role", "button");
    a.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>';

    L.DomEvent.on(a, "click", (ev) => {
      L.DomEvent.preventDefault(ev);

  onAdd(){

    const a = L.DomUtil.create("a", "", box);

    L.DomEvent.disableClickPropagation(box);
    L.DomEvent.on(a, "click", (ev) => { L.DomEvent.preventDefault(ev); fitRoute(); });
    this._box = box;
    return box;
  },
  update(){ this._box.classList.toggle("disabled", !gpxBounds); }
});
const fitControl = new FitControl().addTo(map);

map.on("locationfound", (e) => {
  locateControl._box.classList.remove("busy");
  if (locationMarker) locationMarker.remove();
  locationMarker = L.layerGroup([
    L.circle(e.latlng, { radius: e.accuracy, weight: 1, color: "#2a7de1", fillOpacity: .12 }),
    L.circleMarker(e.latlng, { radius: 7, weight: 3, color: "#fff", fillColor: "#2a7de1", fillOpacity: 1 })

});
map.on("locationerror", (e) => {

// ---------- GPX: stav ----------
// Drží se původní text souboru (přesně, jak byl načten) a z něj vytvořený
// DOM pro čtení. Editují se jen <wpt>; vše ostatní (deklarace XML, metadata,
// <extensions>, formátování) musí při uložení zůstat beze změny.
let gpx = null;          // { doc, ns, text, fileName, sourceUrl, handle }
let trackLines = [];     // pole polí L.LatLng — pro šipky směru
let wptItems = [];       // [{ el, latlng, marker, fixed }]
let selectedWpt = -1;

const TRACK_COLOR = "#1f6feb";
const ROUTE_COLOR = "#7c3aed";

// Přímí potomci elementu v jmenném prostoru GPX (GPX 1.0 i 1.1)
function kids(parent, name, ns){
  return Array.from(parent.children).filter(el => el.localName === name && el.namespaceURI === ns);
}
function childText(parent, name, ns){
  const el = kids(parent, name, ns)[0];
  return el ? el.textContent.trim() : "";
}
function readLatLng(el){
  const lat = parseFloat(el.getAttribute("lat"));
  const lon = parseFloat(el.getAttribute("lon"));
  return (isFinite(lat) && isFinite(lon)) ? L.latLng(lat, lon) : null;
}
function lineLength(pts){
  let d = 0;
  for (let i = 1; i < pts.length; i++) d += pts[i - 1].distanceTo(pts[i]);
  return d;
}

// Všechny typy, které Suunto zná (apizone.suunto.com/route-description).
// Suunto je porovnává bez ohledu na velikost písmen; neznámý typ → "Waypoint".
const SUUNTO_TYPES = ("Aid_station Avalanche Beach Bedding Begin Big_fish Biggame Bird Building Cafe Camp " +
  "Campfire Camping Car Cave Cliff Coast Coral_reef Crossroads Danger Emergency End Fish Fishing_spot Food " +
  "Forest Geocache Hill Home Hostel Hotel Info Kelp_forest Lagoon Lake Left_at_fork_turn Left_turn Lodging " +
  "Marine_mammals Marine_reserve Meadow Mountain Mushrooms Parking Peak Prints Restaurant Right_at_fork_turn " +
  "Right_turn River Road Rock Roundabout_exit_1_turn Roundabout_exit_2_turn Roundabout_exit_3_turn " +
  "Roundabout_exit_4_turn Roundabout_exit_5_turn Roundabout_exit_n_turn Rub Scrape Sharp_left_turn " +
  "Sharp_right_turn Shot Sight Slight_left_turn Slight_right_turn Smallgame Stand Straight_turn Trail " +
  "Trailcam U_turn Valley Water Water_point Waterfall Waypoint Wreck").split(" ");
const TYPE_BY_LC = new Map(SUUNTO_TYPES.map(t => [t.toLowerCase(), t]));
// Kanonický tvar typu ("right_turn" → "Right_turn"); "" = bez typu, null = neznámý typ
function canonType(type){
  if (!type) return "";
  return TYPE_BY_LC.get(type.toLowerCase()) ?? null;
}

// Skupiny bodů zájmu: určují barvu značky a pořadí ve výběru typu v editoru.
// Pokyny k odbočení mají vlastní skupinu „turn“ (oranžová, TURN_TYPES).
const POI_GROUPS = [
  { id: "generic", label: "General", types: ["Waypoint"] },
  { id: "danger", label: "Safety", types: ["Danger", "Avalanche", "Emergency", "Aid_station"] },
  { id: "water", label: "Water & sea", types: ["Water", "Water_point", "River", "Lake", "Lagoon", "Waterfall",
    "Coast", "Beach", "Coral_reef", "Kelp_forest", "Marine_mammals", "Marine_reserve", "Wreck"] },
  { id: "nature", label: "Nature, terrain & wildlife", types: ["Forest", "Meadow", "Mushrooms", "Hill", "Mountain", "Peak",
    "Valley", "Cliff", "Rock", "Cave", "Biggame", "Smallgame", "Bird", "Prints", "Rub", "Scrape", "Shot", "Stand",
    "Trailcam", "Fish", "Big_fish", "Fishing_spot"] },
  { id: "food", label: "Food & lodging", types: ["Cafe", "Restaurant", "Food", "Hotel", "Hostel", "Lodging", "Bedding",
    "Camp", "Camping", "Campfire", "Home", "Building"] },
  { id: "orient", label: "Orientation & transport", types: ["Info", "Sight", "Parking", "Car", "Road", "Trail",
    "Crossroads", "Geocache"] }
];
for (const g of POI_GROUPS) for (const t of g.types) POI_TYPES[t].cat = g.id;
if (Object.values(POI_TYPES).some(v => !POI_GROUPS.some(g => g.id === v.cat))) console.warn("A point-of-interest type has no group");

// Bez typu nebo neznámý typ → Suunto ho načte jako „Waypoint“
function typeInfo(type){
  const c = canonType(type);
  return TURN_TYPES[c] || POI_TYPES[c] || POI_TYPES.Waypoint;
}
// Kategorie pro barvu: "turn" | "poi" | "danger" | "generic"
function typeCat(type){
  const info = typeInfo(type);
  return info.cat || "turn";
}
// Obsah ikony (SVG + případně číslo výjezdu z kruhového objezdu).
// deg = natočení podle příjezdu; používá se jen u pokynů k odbočení.
function typeIconHtml(type, deg = 0){
  const info = typeInfo(type);
  const rot = deg ? ` style="transform:rotate(${deg.toFixed(1)}deg)"` : "";
  const sw = info.sw || (info.cat ? 2.2 : 2.6);   // Tabler ikony jsou jemnější, šipky silnější
  return `<svg viewBox="0 0 24 24"${rot} fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${info.svg}</svg>` +
    (info.num ? `<span class="rnum">${info.num}</span>` : "");
}
function typeLabel(type){
  const c = canonType(type);
  if (!c) return "Waypoint";          // bez typu nebo neznámý typ — Suunto použije Waypoint
  return typeInfo(c).label || c.replace(/_/g, " ");
}
// Upozornění na typ, který Suunto nezná
function typeWarning(type){
  return canonType(type) === null ? `Unknown type “${type}” – Suunto will show it as Waypoint` : null;
}

// Název trasy tak, jak ho ukážou hodinky: rte/trk name → rte/trk desc →
// metadata name → metadata desc → „Unnamed route“
function suuntoRouteName(doc, ns, routeEl){
  const meta = kids(doc.documentElement, "metadata", ns)[0];
  return (routeEl && (childText(routeEl, "name", ns) || childText(routeEl, "desc", ns))) ||
    (meta && (childText(meta, "name", ns) || childText(meta, "desc", ns))) || "Unnamed route";
}
// Surová hodnota <type>, např. "Sharp_right_turn"
function wptType(el, ns){ return childText(el, "type", ns); }
function wptLabel(el, ns){
  const name = childText(el, "name", ns);
  const tl = typeLabel(wptType(el, ns));
  return name ? (name === tl ? name : `${name} · ${tl}`) : tl;
}

// ---------- Poloha waypointu vůči trase ----------
// Suunto načte waypoint jen tehdy, když má stejné souřadnice jako některý
// rtept/trkpt. Zároveň z toho bodu trasy určíme příchozí směr pro natočení.
const CRS = L.CRS.EPSG3857;
const P18 = (ll) => CRS.latLngToPoint(ll, 18);  // Mercator je konformní → úhly nezávisí na zoomu
function bearing(a, b){
  const pa = P18(a), pb = P18(b);
  return Math.atan2(pb.x - pa.x, pa.y - pb.y) * 180 / Math.PI;  // 0° = sever, po směru hodin
}
const ptKey = (ll) => ll.lat + "," + ll.lng;

// Příchozí směr do vrcholu idx (přeskočí opakované body se stejnou polohou)
function incomingBearing(pts, idx){
  const here = pts[idx];
  for (let k = idx - 1; k >= 0; k--) if (!pts[k].equals(here, 0)) return bearing(pts[k], here);
  for (let k = idx + 1; k < pts.length; k++) if (!pts[k].equals(here, 0)) return bearing(here, pts[k]);
  return null;
}

// Klíč polohy → všechny výskyty na trase (trasa tam a zpět projde stejným
// bodem víckrát). li = pořadí čáry, idx = pořadí bodu v čáře.
function buildVertexIndex(lines){
  const index = new Map();
  lines.forEach(({ pts }, li) => pts.forEach((p, idx) => {
    const key = ptKey(p);
    if (!index.has(key)) index.set(key, []);
    index.get(key).push({ pts, li, idx });
  }));
  return index;
}

// → { onRoute, bearing (° nebo null), dist (m k nejbližšímu bodu trasy), hit }
// cursor = výskyt, na kterém ležel předchozí waypoint: waypointy jsou (u Suunto)
// seřazené podél trasy, takže z více výskytů bereme první, který leží za ním.
function analyzeWpt(latlng, lines, index, cursor){
  if (!lines.length) return { onRoute: false, bearing: null, dist: null };
  const hits = index.get(ptKey(latlng));
  if (hits) {
    const after = (h) => !cursor || h.li > cursor.li || (h.li === cursor.li && h.idx >= cursor.idx);
    const hit = hits.find(after) || hits[0];
    return { onRoute: true, bearing: incomingBearing(hit.pts, hit.idx), dist: 0, hit, pos: routePos(hit.li, hit.idx) };
  }

  // Mimo vrchol: směr z nejbližšího úseku, vzdálenost k nejbližšímu vrcholu
  const p = P18(latlng);
  let bestSeg = Infinity, segBearing = null, dist = Infinity, pos = null;
  lines.forEach(({ pts }, li) => {
    for (let i = 0; i < pts.length; i++) {
      dist = Math.min(dist, latlng.distanceTo(pts[i]));
      if (i === 0 || pts[i - 1].equals(pts[i], 0)) continue;
      const a = P18(pts[i - 1]), b = P18(pts[i]);
      const dx = b.x - a.x, dy = b.y - a.y;
      const t = Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / (dx * dx + dy * dy)));
      const d2 = (a.x + dx * t - p.x) ** 2 + (a.y + dy * t - p.y) ** 2;
      if (d2 < bestSeg) { bestSeg = d2; segBearing = bearing(pts[i - 1], pts[i]); pos = routePos(li, i - 1 + t); }
    }
  });
  return { onRoute: false, bearing: segBearing, dist, pos };
}
// Pozice na trase pro řazení seznamu: pořadí čáry, pak (desetinné) pořadí bodu
function routePos(li, idx){ return li * 1e7 + idx; }
function fmtDist(m){ return m < 1 ? m.toFixed(2) + " m" : m < 1000 ? Math.round(m) + " m" : (m / 1000).toFixed(2) + " km"; }

function metadataName(doc, ns){
  const meta = kids(doc.documentElement, "metadata", ns)[0];   // GPX 1.1
  return (meta ? childText(meta, "name", ns) : childText(doc.documentElement, "name", ns)); // GPX 1.0
}

// Dekódování bez zahození BOM (file.text() i res.text() ho tiše odstraní),
// aby se soubor dal později uložit bajt po bajtu stejně.
// Soubor v jiném kódování (podle deklarace <?xml … encoding="…"?>) se dekóduje
// v něm; při uložení se pak převede na UTF-8.
async function decodeText(blobOrResponse){
  const buf = await blobOrResponse.arrayBuffer();
  const head = new TextDecoder("latin1").decode(new Uint8Array(buf, 0, Math.min(buf.byteLength, 300)));
  const m = head.match(/^(?:\xEF\xBB\xBF)?<\?xml[^>]*?encoding\s*=\s*["']([^"']+)["']/i);
  let enc = m ? m[1] : "utf-8";
  try{ return new TextDecoder(enc, { ignoreBOM: true }).decode(buf); }
  catch(e){ return new TextDecoder("utf-8", { ignoreBOM: true }).decode(buf); }
}
// Kódování deklarované v textu (výchozí pro XML je UTF-8)
function declaredEncoding(text){
  const m = text.match(/^\uFEFF?<\?xml[^>]*?encoding\s*=\s*["']([^"']+)["']/i);
  return m ? m[1] : "UTF-8";
}

function parseGpx(text){
  const doc = new DOMParser().parseFromString(text.replace(/^\uFEFF/, ""), "application/xml");
  if (doc.getElementsByTagName("parsererror").length) {
    throw new Error("The file is not valid XML, so it cannot be a GPX file.");
  }
  const root = doc.documentElement;
  if (root.localName !== "gpx") {
    throw new Error(`The file is not a GPX file (its root element is <${root.localName}>, expected <gpx>).`);
  }
  // text = původní obsah souboru beze změny; DOM slouží jen ke čtení.
  // Při uložení se v textu nahradí jen úseky <wpt>, zbytek zůstane přesně.
  return { doc, ns: root.namespaceURI, text, encoding: declaredEncoding(text) };
}

// ---------- GPX: úpravy přímo v textu souboru ----------
// Aby zůstal formát souboru přesně zachován, nepracuje se s DOM + XMLSerializer,
// ale mění se jen dotčené úseky původního textu. Jednoduchý tokenizer najde
// elementy (komentáře, CDATA a instrukce přeskočí; „>“ v uvozovkách atributů nevadí).
const XML_TOKEN_RE = /<!--[\s\S]*?-->|<!\[CDATA\[[\s\S]*?\]\]>|<\?[\s\S]*?\?>|<!DOCTYPE(?:[^>[]|\[[\s\S]*?\])*>|<(\/?)([A-Za-z_][\w.:-]*)((?:"[^"]*"|'[^']*'|[^'">])*?)(\/?)>/g;
const localNameOf = (qname) => qname.slice(qname.indexOf(":") + 1);

// Přímí potomci kořenového elementu v textu s: [{ qname, name, start, openEnd, end, self }]
// (offsety v s; u párového elementu je closeStart začátek koncové značky)
function scanChildren(s){
  const out = [];
  let depth = 0, cur = null;
  XML_TOKEN_RE.lastIndex = 0;
  for (const m of s.matchAll(XML_TOKEN_RE)) {
    if (!m[2]) continue;                       // komentář, CDATA, instrukce
    const end = m.index + m[0].length;
    if (m[1] === "/") {
      depth--;
      if (depth === 1 && cur) { cur.closeStart = m.index; cur.end = end; out.push(cur); cur = null; }
      continue;
    }
    const self = m[4] === "/";
    if (depth === 1 && !cur) {
      cur = { qname: m[2], name: localNameOf(m[2]), start: m.index, openEnd: end, self };
      if (self) { cur.end = cur.closeStart = end; out.push(cur); cur = null; continue; }
    }
    if (!self) depth++;
  }
  return out;
}

const xmlEscape = (v) => String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const prefixOf = (qname) => qname.includes(":") ? qname.slice(0, qname.indexOf(":") + 1) : "";
const isWs = (str) => /^\s*$/.test(str);

// Odstraní úsek [a, b) textu; když úsek zabírá celé řádky (před ním i za ním je
// zalomení), odebere i odsazení před ním, aby nezůstal prázdný řádek.
function cutElement(text, a, b){
  let c = a;
  while (c > 0 && /[ \t\r\n]/.test(text[c - 1])) c--;
  const before = text.slice(c, a);
  const after = /^[ \t]*(\r?\n|$)/.test(text.slice(b)) || /^[ \t]*<\//.test(text.slice(b));
  return text.slice(0, before.includes("\n") && after ? c : a) + text.slice(b);
}

// Změní hodnotu atributu v počáteční značce elementu s (zachová uvozovky a mezery)
function setAttrText(s, attr, value){
  const tagEnd = s.indexOf(">") + 1;
  const re = new RegExp(`(\\s${attr}\\s*=\\s*)(["'])[^"']*\\2`);
  const head = s.slice(0, tagEnd);
  if (!re.test(head)) throw new Error(`Attribute ${attr} not found`);
  return head.replace(re, (all, pre, q) => pre + q + value + q) + s.slice(tagEnd);
}

// Pořadí potomků <wpt> podle schématu GPX 1.1 — nový element se vloží na správné místo
const WPT_CHILD_ORDER = ["ele", "time", "magvar", "geoidheight", "name", "cmt", "desc", "src", "link",
  "sym", "type", "fix", "sat", "hdop", "vdop", "pdop", "ageofdgpsdata", "dgpsid", "extensions"];

// Nastaví textový obsah potomka elementu s (value == null nebo "" → potomka odebere).
// Formátování (odsazení / vše na jednom řádku) převezme od stávajících potomků.
function setChildText(s, name, value){
  const root = scanChildren("<r>" + s + "</r>")[0];  // obalení: s je pak potomek kořene
  if (!root) throw new Error("Element not found");
  const off = 3;                                       // délka "<r>"
  const kidsArr = scanChildren(s);                     // přímí potomci s
  const prefix = prefixOf(root.qname);
  const child = kidsArr.find(c => c.name === name);
  const remove = value == null || value === "";

  if (child) {
    if (remove) return cutElement(s, child.start, child.end);
    const inner = xmlEscape(value);
    if (child.self) return s.slice(0, child.start) + `<${child.qname}>${inner}</${child.qname}>` + s.slice(child.end);
    return s.slice(0, child.openEnd) + inner + s.slice(child.closeStart);
  }
  if (remove) return s;

  const xml = `<${prefix}${name}>${xmlEscape(value)}</${prefix}${name}>`;
  const openEnd = root.openEnd - off;
  if (root.self) {
    // <wpt .../> → <wpt ...><name>…</name></wpt>
    const tag = s.slice(0, openEnd).replace(/\s*\/>$/, ">");
    return tag + xml + `</${root.qname}>` + s.slice(openEnd);
  }
  // Oddělovač mezi potomky (např. "\n    ") a před koncovou značkou
  const sep = kidsArr.length && isWs(s.slice(openEnd, kidsArr[0].start)) ? s.slice(openEnd, kidsArr[0].start) : "";
  const rank = (n) => { const i = WPT_CHILD_ORDER.indexOf(n); return i < 0 ? WPT_CHILD_ORDER.length : i; };
  const next = kidsArr.find(c => rank(c.name) > rank(name));
  if (next) return s.slice(0, next.start) + xml + sep + s.slice(next.start);
  const last = kidsArr[kidsArr.length - 1];
  if (last) return s.slice(0, last.end) + sep + xml + s.slice(last.end);
  return s.slice(0, openEnd) + xml + s.slice(openEnd);
}

// Úseky <wpt> v celém textu souboru (přímí potomci <gpx>), v pořadí souboru
function locateWpts(text){
  const body = text.replace(/^﻿/, "");
  const shift = text.length - body.length;
  const top = scanChildren(body);        // potomci „kořene“ = elementy na úrovni 1 → to je jen <gpx>
  // scanChildren vrací potomky kořene; kořenem je <gpx>, takže dostaneme přímo jeho děti
  return top.filter(c => c.name === "wpt").map(c => ({ ...c, start: c.start + shift, openEnd: c.openEnd + shift, end: c.end + shift, closeStart: c.closeStart + shift }));
}
function locateTop(text){
  const body = text.replace(/^﻿/, "");
  const shift = text.length - body.length;
  return scanChildren(body).map(c => ({ ...c, start: c.start + shift, openEnd: c.openEnd + shift, end: c.end + shift, closeStart: c.closeStart + shift }));
}

// Smaže k-tý <wpt> (i s odsazením jeho řádku)
function deleteWptText(text, k){
  const w = locateWpts(text)[k];
  return cutElement(text, w.start, w.end);
}

// Nahradí k-tý <wpt> novým textem elementu
function replaceWptText(text, k, wptXml){
  const w = locateWpts(text)[k];
  return text.slice(0, w.start) + wptXml + text.slice(w.end);
}

// Přesune k-tý <wpt> na pozici to (a nahradí ho textem wptXml). Mezery mezi
// waypointy zůstanou na svých místech — posunou se jen samotné elementy.
function moveWptText(text, from, to, wptXml){
  const slots = locateWpts(text);
  const items = slots.map(w => text.slice(w.start, w.end));
  items.splice(from, 1);
  items.splice(to, 0, wptXml);
  let out = text;
  for (let i = slots.length - 1; i >= 0; i--) out = out.slice(0, slots[i].start) + items[i] + out.slice(slots[i].end);
  return out;
}

// Vytvoří text nového <wpt> ve stylu vzoru (jiného <wpt> ze souboru, může být null)
function buildWptXml(template, { lat, lon, ele, name, type }){
  let prefix = "", sep = "", closeSep = "";
  if (template) {
    const root = scanChildren("<r>" + template + "</r>")[0];
    prefix = prefixOf(root.qname);
    const kidsArr = scanChildren(template);
    const openEnd = root.openEnd - 3;
    if (kidsArr.length) {
      const before = template.slice(openEnd, kidsArr[0].start);
      if (isWs(before)) sep = before;
      const after = template.slice(kidsArr[kidsArr.length - 1].end, root.closeStart - 3);
      if (isWs(after)) closeSep = after;
    }
  }
  const t = (n, v) => `<${prefix}${n}>${xmlEscape(v)}</${prefix}${n}>`;
  const parts = [];
  if (ele != null && ele !== "") parts.push(t("ele", ele));
  if (name) parts.push(t("name", name));
  if (type) parts.push(t("type", type));
  return `<${prefix}wpt lat="${lat}" lon="${lon}">` + (parts.length ? sep + parts.join(sep) + closeSep : "") + `</${prefix}wpt>`;
}

// Vloží nový <wpt> tak, aby byl na pozici k mezi ostatními wpt (k = počet wpt před ním).
// Bez wpt v souboru se vloží před první rte/trk/extensions, jinak před </gpx>.
function insertWptText(text, k, wptXml){
  const wpts = locateWpts(text);
  if (wpts.length) {
    // Mezera mezi sousedními elementy podle souboru (u Suunto často žádná)
    const top = locateTop(text);
    const i0 = top.indexOf(top.find(c => c.start === wpts[0].start));
    const nextEl = top[i0 + 1];
    const gapRaw = nextEl ? text.slice(wpts[0].end, nextEl.start) : "";
    const gap = isWs(gapRaw) ? gapRaw : "";
    if (k < wpts.length) return text.slice(0, wpts[k].start) + wptXml + gap + text.slice(wpts[k].start);
    const last = wpts[wpts.length - 1];
    return text.slice(0, last.end) + gap + wptXml + text.slice(last.end);
  }
  const top = locateTop(text);
  const before = top.find(c => ["rte", "trk", "extensions"].includes(c.name));
  if (before) {
    let a = before.start, ws = "";
    // převezmi odsazení řádku, na kterém element začíná
    let b = a; while (b > 0 && /[ \t]/.test(text[b - 1])) b--;
    if (b > 0 && text[b - 1] === "\n") ws = "\n" + text.slice(b, a);
    return text.slice(0, a) + wptXml + (ws ? ws : "") + text.slice(a);
  }
  const close = text.lastIndexOf("</");
  return text.slice(0, close) + wptXml + text.slice(close);
}

// Posune offsety úseku o d znaků
const shiftBy = (c, d) => ({ ...c, start: c.start + d, openEnd: c.openEnd + d, end: c.end + d, closeStart: c.closeStart + d });

// Body čáry v textu: kind "rte" → n-tý <rte> a jeho <rtept>; kind "trkseg" →
// n-tý <trkseg> (napříč všemi <trk>) a jeho <trkpt>. Vrací úseky všech bodů v pořadí.
function locateLinePoints(text, kind, n){
  const top = locateTop(text);
  let parents = [];
  if (kind === "rte") parents = top.filter(c => c.name === "rte");
  else for (const trk of top.filter(c => c.name === "trk")) {
    for (const c of scanChildren(text.slice(trk.start, trk.end))) if (c.name === "trkseg") parents.push(shiftBy(c, trk.start));
  }
  const par = parents[n];
  if (!par) return null;
  const ptName = kind === "rte" ? "rtept" : "trkpt";
  return scanChildren(text.slice(par.start, par.end)).filter(c => c.name === ptName).map(c => shiftBy(c, par.start));
}

// Vloží bod trasy hned za bod s indexem after (mezi body stejná mezera jako v souboru)
function insertPointText(text, kind, n, after, xml){
  const pts = locateLinePoints(text, kind, n);
  const a = pts?.[after];
  if (!a) throw new Error("Route point not found in the file text");
  const b = pts[after + 1];
  const gapRaw = b ? text.slice(a.end, b.start) : "";
  const gap = isWs(gapRaw) ? gapRaw : "";
  return text.slice(0, a.end) + gap + xml + text.slice(a.end);
}

// Nový bod trasy ve stylu vzoru (sousední bod): stejný název elementu, prefix,
// odsazení i zápis prázdného elementu („<rtept … />“). Bez name/type/desc.
function buildPointXml(template, { lat, lon, ele, time }){
  const root = scanChildren("<r>" + template + "</r>")[0];
  const qname = root.qname, prefix = prefixOf(qname);
  const kidsArr = scanChildren(template);
  const openEnd = root.openEnd - 3;
  let sep = "", closeSep = "";
  if (kidsArr.length) {
    const before = template.slice(openEnd, kidsArr[0].start);
    if (isWs(before)) sep = before;
    const after = template.slice(kidsArr[kidsArr.length - 1].end, root.closeStart - 3);
    if (isWs(after)) closeSep = after;
  }
  const parts = [];
  if (ele != null && ele !== "") parts.push(`<${prefix}ele>${xmlEscape(ele)}</${prefix}ele>`);
  if (time) parts.push(`<${prefix}time>${xmlEscape(time)}</${prefix}time>`);
  const open = `<${qname} lat="${lat}" lon="${lon}"`;
  if (!parts.length) return root.self ? open + (/\s\/>$/.test(template.slice(0, openEnd)) ? " />" : "/>") : open + `></${qname}>`;
  return open + ">" + sep + parts.join(sep) + closeSep + `</${qname}>`;
}

// ---------- Suunto Routeplanner: waypointIndices ----------
// Soubory z plánovače Suunto mají v <rte><extensions> seznam indexů bodů trasy,
// na kterých leží waypointy (např. "0,36" = Begin a End). Po každé úpravě se
// seznam přepočítá ze skutečných <wpt>, aby po vložení bodu trasy či přidání /
// smazání waypointu neukazoval jinam. Mění se jen text tohoto elementu.
const SUUNTO_RP_NS = "http://www.suunto.com/routeplanner/gpx/1.0";
function syncSuuntoIndices(text){
  let parsed;
  try{ parsed = parseGpx(text); }catch(e){ return text; }
  const { doc, ns } = parsed, root = doc.documentElement;
  const rtes = kids(root, "rte", ns);
  if (!rtes.some(r => r.getElementsByTagNameNS(SUUNTO_RP_NS, "waypointIndices").length)) return text;
  const wpts = kids(root, "wpt", ns).map(readLatLng).filter(Boolean);
  const lists = rtes.map(rte => {
    const where = new Map();                  // poloha → indexy rtept (trasa může bodem projít víckrát)
    kids(rte, "rtept", ns).forEach((e, i) => {
      const p = readLatLng(e);
      if (!p) return;
      const k = ptKey(p);
      if (!where.has(k)) where.set(k, []);
      where.get(k).push(i);
    });
    const out = new Set();
    let cursor = -1;                          // waypointy jsou v pořadí trasy
    for (const w of wpts) {
      const hits = where.get(ptKey(w));
      if (!hits) continue;
      const h = hits.find(i => i >= cursor) ?? hits[0];
      out.add(h);
      cursor = h;
    }
    return [...out].sort((a, b) => a - b).join(",");
  });
  let out = text;
  const tops = locateTop(text).filter(c => c.name === "rte");
  for (let r = tops.length - 1; r >= 0; r--) {          // od konce, ať se offsety neposunou
    const R = tops[r];
    const ext = scanChildren(out.slice(R.start, R.end)).find(c => c.name === "extensions");
    if (!ext) continue;
    const eS = R.start + ext.start;
    const wi = scanChildren(out.slice(eS, R.start + ext.end)).find(c => c.name === "waypointIndices");
    if (!wi || wi.self) continue;
    const a = eS + wi.openEnd, b = eS + wi.closeStart;
    if (out.slice(a, b) !== lists[r]) out = out.slice(0, a) + lists[r] + out.slice(b);
  }
  return out;
}

// ---------- GPX: vykreslení na mapu ----------
function endIcon(kind, selected = false){
  return L.divIcon({ className: "end-icon " + kind + (selected ? " selected" : ""), html: "<div>" + (kind === "start" ? "S" : "F") + "</div>", iconSize: [20, 20] });
}
function wptIcon(item, selected){
  const cat = typeCat(item.type);
  const cls = `wpt-icon cat-${cat}` + (selected ? " selected" : "") + (item.warn ? " warn" : "");
  // Natáčí se jen pokyny k odbočení; body zájmu směr nemají
  const deg = cat === "turn" ? (item.bearing || 0) : 0;
  return L.divIcon({ className: cls, html: "<div>" + typeIconHtml(item.type, deg) + "</div>", iconSize: [30, 30] });
}
// Suunto ukládá začátek a konec trasy jako waypointy s <type>Begin/End</type>.
// Zobrazují se jako značky start/cíl a needitují se.
function fixedKind(el, ns){
  const t = childText(el, "type", ns).toLowerCase();
  return t === "begin" ? "start" : t === "end" ? "finish" : null;
}
function wptZ(item){ return item.fixed ? 900 : 1000; }
function iconFor(item, selected){
  return item.fixed ? endIcon(item.fixed, selected) : wptIcon(item, selected);
}

// Výřez celé trasy (stejně jako po načtení souboru)
let gpxBounds = null;
function fitRoute(){
  if (!gpxBounds) return;
  const sheet = isMobile() ? parseInt(getComputedStyle(document.documentElement).getPropertyValue("--sheet-peek")) || 0 : 0;
  map.fitBounds(gpxBounds, { paddingTopLeft: [30, 30], paddingBottomRight: [30, 30 + sheet], maxZoom: 16 });
}

function renderGpx(fit){
  gpxLayer.clearLayers();
  trackLines = [];
  wptItems = [];
  selectedWpt = -1;
  const stats = { trk: 0, trkPts: 0, trkLen: 0, rte: 0, rtePts: 0, rteLen: 0 };
  const allPts = [];

  if (gpx) {
    const { doc, ns } = gpx;
    const root = doc.documentElement;
    // Čára si pamatuje i své místo v souboru (kind + parent = n-tý <trkseg>/<rte>,
    // idxs = pořadí bodu mezi všemi body rodiče) — kvůli vkládání nových bodů trasy
    const addLine = (line, dashed) => {
      const color = dashed ? ROUTE_COLOR : TRACK_COLOR;
      L.polyline(line.pts, { color: "#fff", weight: 7, opacity: .8, interactive: false }).addTo(gpxLayer);
      L.polyline(line.pts, { color, weight: 4, dashArray: dashed ? "8 8" : null, interactive: false }).addTo(gpxLayer);
      trackLines.push({ ...line, color });
      allPts.push(...line.pts);
    };
    // Body čáry s platnou polohou: { pts: [L.LatLng], els: [Element], idxs: [číslo] }
    const linePoints = (ptEls) => {
      const pts = [], els = [], idxs = [];
      ptEls.forEach((e, i) => { const ll = readLatLng(e); if (ll) { pts.push(ll); els.push(e); idxs.push(i); } });
      return { pts, els, idxs };
    };
    let segN = 0;

    for (const trk of kids(root, "trk", ns)) {
      stats.trk++;
      for (const seg of kids(trk, "trkseg", ns)) {
        const line = { ...linePoints(kids(seg, "trkpt", ns)), kind: "trkseg", parent: segN++ };
        if (!line.pts.length) continue;
        stats.trkPts += line.pts.length;
        stats.trkLen += lineLength(line.pts);
        addLine(line, false);
      }
    }
    // Routa je přerušovaná jen vedle tracku; samotná routa (např. export
    // ze Suunto) je hlavní čára a kreslí se plně.
    const dashRoutes = trackLines.length > 0;
    let rteN = 0;
    for (const rte of kids(root, "rte", ns)) {
      const line = { ...linePoints(kids(rte, "rtept", ns)), kind: "rte", parent: rteN++ };
      stats.rte++;
      if (!line.pts.length) continue;
      stats.rtePts += line.pts.length;
      stats.rteLen += line.pts.length > 1 ? lineLength(line.pts) : 0;
      addLine(line, dashRoutes);
    }

    const wpts = kids(root, "wpt", ns);
    // Editovat jde jen tehdy, když textový tokenizer našel stejné <wpt> jako DOM
    try{ gpx.editable = locateWpts(gpx.text).length === wpts.length; }catch(e){ gpx.editable = false; }
    // Waypointy, které Suunto vytvoří přímo z rtept/trkpt s <name> nebo <type>.
    // Jen se zobrazují — editují se výhradně <wpt>.
    const routeWpts = [];
    trackLines.forEach(({ pts, els }, li) => els.forEach((e, idx) => {
      if (kids(e, "name", ns).length || kids(e, "type", ns).length) routeWpts.push({ el: e, latlng: pts[idx], bearing: incomingBearing(pts, idx), pos: routePos(li, idx) });
    }));
    const kinds = wpts.map(el => fixedKind(el, ns)).concat(routeWpts.map(r => fixedKind(r.el, ns)));
    // Start/cíl odvozený z čáry jen tam, kde ho soubor nemá jako waypoint
    if (trackLines.length) {
      const first = trackLines[0].pts[0];
      const last = trackLines[trackLines.length - 1].pts.at(-1);
      if (!kinds.includes("start")) L.marker(first, { icon: endIcon("start"), keyboard: false, zIndexOffset: 500 }).bindTooltip("Start").addTo(gpxLayer);
      if (!kinds.includes("finish")) L.marker(last, { icon: endIcon("finish"), keyboard: false, zIndexOffset: 600 }).bindTooltip("Finish").addTo(gpxLayer);
    }

    const vertexIndex = buildVertexIndex(trackLines);
    let cursor = null;
    wpts.forEach((el, k) => {
      const latlng = readLatLng(el);
      if (!latlng) return;
      const item = { el, latlng, fixed: kinds[k], type: wptType(el, ns), order: k };
      // Begin/End patří vždy na začátek/konec seznamu
      item.pos = item.fixed === "start" ? -Infinity : item.fixed === "finish" ? Infinity : null;
      if (!item.fixed) {
        const a = analyzeWpt(latlng, trackLines, vertexIndex, cursor);
        if (a.hit) cursor = a.hit;
        item.hit = a.hit || null;
        item.pos = a.pos;
        item.bearing = a.bearing;
        // Varování jen když trasa existuje; soubor bez trasy hlásí panel
        item.warn = trackLines.length && !a.onRoute ? `Not on a route point – Suunto will ignore it (nearest point ${fmtDist(a.dist)})` : null;
        item.typeWarn = typeWarning(item.type);
      }
      const label = item.fixed ? (childText(el, "name", ns) || (item.fixed === "start" ? "Start" : "Finish")) : wptLabel(el, ns);
      const drag = canDrag && gpx.editable && !item.fixed;
      item.marker = L.marker(latlng, { icon: iconFor(item, false), zIndexOffset: wptZ(item), title: label, draggable: drag, autoPan: true })
        .bindTooltip(label, { direction: "top", offset: [0, -14] })
        .on("click", () => selectWpt(wptItems.indexOf(item), { from: "map" }))
        .addTo(gpxLayer);
      if (drag) {
        item.marker.on("dragstart", () => { selectWpt(wptItems.indexOf(item), { from: "map" }); showVertices(true); });
        item.marker.on("dragend", () => {
          // Přichytit na trasu (k bodu, nebo vložit nový bod na čáru); daleko od trasy → vrátit zpět
          const target = routeTargetAt(map.latLngToContainerPoint(item.marker.getLatLng()), SNAP_PX * 1.5);
          if (target) moveWptToTarget(item, target);
          else { showToast("Drop the waypoint on the route line – waypoints can only be placed on the route."); applyText(gpx.text, item.order); }
        });
      }
      wptItems.push(item);
      allPts.push(latlng);
    });

    routeWpts.forEach((r, k) => {
      const item = { el: r.el, latlng: r.latlng, fixed: fixedKind(r.el, ns), type: wptType(r.el, ns), bearing: r.bearing, fromRoute: true, order: wpts.length + k };
      item.pos = item.fixed === "start" ? -Infinity : item.fixed === "finish" ? Infinity : r.pos;
      item.typeWarn = item.fixed ? null : typeWarning(item.type);
      const label = item.fixed ? (childText(r.el, "name", ns) || (item.fixed === "start" ? "Start" : "Finish")) : wptLabel(r.el, ns);
      item.marker = L.marker(r.latlng, { icon: iconFor(item, false), zIndexOffset: wptZ(item), title: label })
        .bindTooltip(label + " (route point)", { direction: "top", offset: [0, -14] })
        .on("click", () => selectWpt(wptItems.indexOf(item), { from: "map" }))
        .addTo(gpxLayer);
      wptItems.push(item);
    });

    // Seznam v pořadí podél trasy (jak na body jezdec narazí); při shodě a bez
    // trasy rozhoduje pořadí v souboru.
    wptItems.sort((a, b) => (a.pos ?? Infinity) - (b.pos ?? Infinity) || a.order - b.order);
  }

  renderPanel(stats);
  updateArrows();
  showVertices(false);
  updateEditButtons();
  updateSaveButton();
  document.title = gpx ? `${gpx.fileName} – AddTurn GPX` : "AddTurn GPX";

  gpxBounds = allPts.length ? L.latLngBounds(allPts) : null;
  fitControl?.update();
  if (fit) fitRoute();
}

// Šipky směru: v pravidelných rozestupech (v pixelech) podél čar, jen ve
// viditelném výřezu. Přepočítávají se po každém posunu a zoomu.
const ARROW_SPACING = 110;
const ARROW_MAX = 400;
function updateArrows(){
  arrowLayer.clearLayers();
  if (!trackLines.length) return;
  const zoom = map.getZoom();
  const view = map.getPixelBounds().pad(0.1);
  let count = 0;
  for (const { pts, color } of trackLines) {
    let prev = map.project(pts[0], zoom);
    let next = ARROW_SPACING / 2;   // vzdálenost od začátku úseku k další šipce
    for (let i = 1; i < pts.length && count < ARROW_MAX; i++) {
      const cur = map.project(pts[i], zoom);
      const dx = cur.x - prev.x, dy = cur.y - prev.y;
      const len = Math.hypot(dx, dy);
      while (next <= len && count < ARROW_MAX) {
        const t = next / len;
        const p = L.point(prev.x + dx * t, prev.y + dy * t);
        if (view.contains(p)) {
          const deg = Math.atan2(dy, dx) * 180 / Math.PI;
          L.marker(map.unproject(p, zoom), {
            interactive: false, keyboard: false,
            icon: L.divIcon({
              className: "dir-arrow", iconSize: [14, 14],
              html: `<svg viewBox="0 0 14 14" style="transform:rotate(${deg}deg)"><path d="M3 2 L12 7 L3 12 L5.5 7 Z" fill="${color}" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>`
            })
          }).addTo(arrowLayer);
          count++;
        }
        next += ARROW_SPACING;
      }
      next -= len;
      prev = cur;
    }
  }
}
map.on("moveend", updateArrows);

// ---------- Panel: obsah ----------
const panelBody = document.getElementById("panel-body");
const wptCountEl = document.getElementById("wpt-count");

function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function fmtKm(m){ return (m / 1000).toFixed(m < 10000 ? 2 : 1) + " km"; }

function renderPanel(stats){
  panelBody.replaceChildren();
  wptCountEl.textContent = gpx ? `(${wptItems.length})` : "";

  if (!gpx) {
    panelBody.append(
      el("p", "empty", "No GPX file loaded."),
      el("p", "hint", "Use Open or Open URL" + (isMobile() ? "." : ", or drag a .gpx file into this window."))
    );
    return;
  }

  const info = el("div", "file-info");
  const text = el("div", "text");
  const nameEl = el("div", "name", gpx.fileName);
  if (gpx.dirty) { const b = el("span", "badge", "Modified"); b.title = "Changes not saved to a file yet"; nameEl.append(b); }
  text.append(nameEl);
  const lines = [];
  if (stats.trk) lines.push(`Track: ${fmtKm(stats.trkLen)} · ${stats.trkPts} points` + (stats.trk > 1 ? ` · ${stats.trk} tracks` : ""));
  if (stats.rte) lines.push(`Route: ${fmtKm(stats.rteLen)} · ${stats.rtePts} points` + (stats.rte > 1 ? ` · ${stats.rte} routes` : ""));
  const noRoute = !stats.trk && !stats.rte;
  if (!noRoute) {
    const routeEl = Array.from(gpx.doc.documentElement.children)
      .find(e => e.namespaceURI === gpx.ns && (e.localName === "trk" || e.localName === "rte"));
    lines.unshift("Name on watch: " + suuntoRouteName(gpx.doc, gpx.ns, routeEl));
  }
  if (noRoute) lines.push("No track or route in this file.");
  if (gpx.sourceUrl) lines.push("Downloaded from " + new URL(gpx.sourceUrl).hostname);
  for (const l of lines) text.append(el("div", "meta", l));
  if (noRoute && wptItems.length) text.append(el("div", "meta warn", "⚠ Without a route, Suunto will not import any waypoints."));
  const routeCount = stats.trk + stats.rte;
  if (routeCount > 1) text.append(el("div", "meta warn", `⚠ ${routeCount} tracks/routes in this file – Suunto imports each one as a separate route.`));
  const close = el("button");
  close.title = "Close file";
  close.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';
  close.addEventListener("click", closeGpx);
  if (gpx.editable === false) text.append(el("div", "meta warn", "⚠ Editing is disabled: the file structure was not recognized."));
  if (!/^utf-?8$/i.test(gpx.encoding || "UTF-8")) text.append(el("div", "meta warn", `⚠ Encoding ${gpx.encoding}: the file will be saved as UTF-8.`));
  const acts = el("div", "file-actions");
  if (canPickSave) {
    const b = el("button", null, "Save as…"); b.type = "button"; b.title = "Save to a new file (Ctrl+Shift+S)";
    b.addEventListener("click", () => saveGpx({ as: true }));
    acts.append(b);
  }
  if (canShareGpx()) {
    const b = el("button", null, "Share…"); b.type = "button"; b.title = "Send the file to another app (e.g. Suunto)";
    b.addEventListener("click", shareGpx);
    acts.append(b);
  } else if (matchMedia("(pointer: coarse)").matches) {
    // Např. Chrome na Androidu nedovolí sdílet soubory .gpx (Web Share je povoluje jen pro vybrané typy)
    text.append(el("div", "meta", "Sharing GPX files is not supported by this browser. Save the file, then open it from Downloads in the Suunto app."));
  }
  if (gpx.editable && trackLines.length) {
    const b = el("button", null, "Generate turns…"); b.type = "button"; b.title = "Add turn waypoints automatically from the route shape";
    b.addEventListener("click", openGenerator);
    acts.append(b);
  }
  if (acts.children.length) text.append(acts);
  info.append(text, close);
  panelBody.append(info);
  const slot = el("div");
  slot.id = "editor-slot";
  panelBody.append(slot);
  if (gpx.editable && trackLines.length) {
    const tap = matchMedia("(pointer: coarse)").matches ? "Tap" : "Click";
    panelBody.append(el("p", "hint add-hint", `${tap} the route to add a waypoint, ${tap.toLowerCase()} a waypoint to edit it.`));
  }

  if (!wptItems.length) {
    panelBody.append(el("p", "empty", "No waypoints in this file."));
    return;
  }
  const ul = el("ul");
  ul.id = "wpt-list";
  let num = 0;   // číslují se jen editovatelné body (bez Begin/End a bodů z trasy)
  wptItems.forEach((w, i) => {
    const li = el("li");
    const body = el("div");
    const name = childText(w.el, "name", gpx.ns);
    const tl = typeLabel(w.type);
    body.append(el("div", "wname", name || tl));
    const desc = childText(w.el, "desc", gpx.ns) || childText(w.el, "cmt", gpx.ns);
    const sub = w.fixed
      ? (w.fixed === "start" ? "Route start" : "Route end") + " · not editable"
      : [name && name !== tl ? tl : "", desc, w.fromRoute ? "in route point · not editable" : ""].filter(Boolean).join(" · ");
    if (sub) body.append(el("div", "wdesc", sub));
    if (w.warn) body.append(el("div", "wwarn", "⚠ " + w.warn));
    if (w.typeWarn) body.append(el("div", "wwarn", "⚠ " + w.typeWarn));
    if (w.fixed || w.fromRoute) li.classList.add("fixed");
    const icon = el("span", "ticon " + (w.fixed || "cat-" + typeCat(w.type)) + (w.warn ? " warn" : ""));
    if (w.fixed) icon.textContent = w.fixed === "start" ? "S" : "F";
    else icon.innerHTML = typeIconHtml(w.type);
    li.append(el("span", "idx", w.fixed || w.fromRoute ? "" : String(++num)), icon, body);
    li.addEventListener("click", () => selectWpt(i, { from: "list" }));
    ul.append(li);
  });
  panelBody.append(ul);
}

function selectWpt(i, { from }){
  const prev = wptItems[selectedWpt];
  if (prev) {
    // Popisek předchozího bodu zavřít — u blízkých bodů by jinak překryl nový
    prev.marker.closeTooltip();
    prev.marker.setIcon(iconFor(prev, false));
    prev.marker.setZIndexOffset(wptZ(prev));
  }
  selectedWpt = i;
  const w = wptItems[i];
  w.marker.setIcon(iconFor(w, true));
  w.marker.setZIndexOffset(3000);   // vybraný bod vždy nahoře
  const lis = panelBody.querySelectorAll("#wpt-list li");
  lis.forEach((li, j) => li.classList.toggle("selected", j === i));
  renderEditor();
  showVertices(isEditable(w));
  const editing = isEditable(w);
  if (from === "list") {
    map.setView(w.latlng, Math.max(map.getZoom(), 15), { animate: false });
    if (isMobile()) {
      if (editing) {
        // Panel s editorem zůstane otevřený; bod posuneme do horní (viditelné) části mapy
        document.body.classList.add("sheet-open");
        map.panBy([0, document.getElementById("map").clientHeight / 4], { animate: false });
      } else {
        // Na mobilu panel sbalíme, aby byl vybraný bod na mapě vidět
        document.body.classList.remove("sheet-open");
      }
    }
    w.marker.openTooltip();
  } else {
    if (isMobile() && editing) document.body.classList.add("sheet-open");
    if (from === "edit") {
      // Po úpravě: bod udržet ve výřezu, editor nahoře
      if (!map.getBounds().contains(w.latlng)) map.panTo(w.latlng);
      document.getElementById("editor-slot")?.scrollIntoView({ block: "nearest" });
    } else {
      lis[i]?.scrollIntoView({ block: "nearest" });
    }
    if (from === "edit") w.marker.openTooltip();
  }
}

// ---------- Editace waypointů ----------
// Každá úprava vytvoří nový text souboru (změní se jen dotčený <wpt>), ten se
// znovu načte a vykreslí. Undo/Redo drží předchozí texty v paměti.
const editHistory = { undo: [], redo: [] };     // položky: { text, sel }
const vertexLayer = L.layerGroup().addTo(map);
// Tažení značek jen bez dotykového ovládání (na dotyku by se pletlo s posunem mapy)
const canDrag = !matchMedia("(pointer: coarse)").matches;
const btnUndo = document.getElementById("btn-undo");
const btnRedo = document.getElementById("btn-redo");

const isEditable = (item) => !!(gpx?.editable && item && !item.fixed && !item.fromRoute);
// Pořadí vybraného <wpt> v souboru (pro obnovení výběru po úpravě)
const selectedOrder = () => { const w = wptItems[selectedWpt]; return w && !w.fromRoute ? w.order : null; };

function wptTextAt(k){
  const w = locateWpts(gpx.text)[k];
  return gpx.text.slice(w.start, w.end);
}
// Přesné textové hodnoty bodu trasy (souřadnice se kopírují znak po znaku)
function vertexData(li, idx){
  const e = trackLines[li].els[idx];
  return { lat: e.getAttribute("lat"), lon: e.getAttribute("lon"), ele: childText(e, "ele", gpx.ns) || null };
}

function updateEditButtons(){
  const hasRoute = !!(gpx && trackLines.length);
  btnUndo.disabled = !editHistory.undo.length;
  btnRedo.disabled = !editHistory.redo.length;
}

// Použije nový text souboru (po úpravě nebo z historie) a obnoví výběr
function applyText(text, selOrder){
  let parsed;
  try{ parsed = parseGpx(text); }
  catch(e){ showToast("Edit failed: " + e.message, 8000); return false; }
  gpx = { ...gpx, ...parsed, dirty: text !== gpx.cleanText };
  renderGpx(false);
  if (selOrder != null) selectByOrder(selOrder, { from: "edit" });
  saveSession();
  updateEditButtons();
  return true;
}
function commitEdit(text, selOrder){
  text = syncSuuntoIndices(text);
  if (text === gpx.text) return;
  const prev = { text: gpx.text, sel: selectedOrder() };
  if (applyText(text, selOrder)) {
    editHistory.undo.push(prev);
    editHistory.redo.length = 0;
    updateEditButtons();
  }
}
function undo(){
  const step = editHistory.undo.pop();
  if (!step) return;
  editHistory.redo.push({ text: gpx.text, sel: selectedOrder() });
  applyText(step.text, step.sel);
}
function redo(){
  const step = editHistory.redo.pop();
  if (!step) return;
  editHistory.undo.push({ text: gpx.text, sel: selectedOrder() });
  applyText(step.text, step.sel);
}
btnUndo.addEventListener("click", undo);
btnRedo.addEventListener("click", redo);

function selectByOrder(order, opts){
  const i = wptItems.findIndex(w => !w.fromRoute && w.order === order);
  if (i >= 0) selectWpt(i, opts);
}

// Index, na který vložit wpt s pozicí pos mezi ostatní <wpt> (bez exclude),
// aby pořadí v souboru odpovídalo pořadí na trase
function insertIndexFor(pos, exclude = -1){
  const others = wptItems.filter(w => !w.fromRoute && w.order !== exclude).sort((a, b) => a.order - b.order);
  const k = others.findIndex(w => (w.pos ?? Infinity) > pos);
  return k < 0 ? others.length : k;
}
// Vzor formátování pro nový <wpt>: nejlépe běžný waypoint, jinak Begin/End
function templateWpt(){
  const w = wptItems.find(w => !w.fromRoute && !w.fixed) || wptItems.find(w => !w.fromRoute);
  return w ? wptTextAt(w.order) : null;
}

// ---- Návrh typu podle úhlu trasy ----
// Směr příjezdu a odjezdu se měří na ~15 m (u hustých záznamů tras by
// sousední body dávaly náhodný úhel).
function suggestType(li, idx){
  const pts = trackLines[li].pts, here = pts[idx];
  let a = null, b = null;
  for (let k = idx - 1; k >= 0; k--) { a = pts[k]; if (here.distanceTo(a) >= 15) break; }
  for (let k = idx + 1; k < pts.length; k++) { b = pts[k]; if (here.distanceTo(b) >= 15) break; }
  if (!a || !b || a.equals(here, 0) || b.equals(here, 0)) return null;
  const delta = ((bearing(here, b) - bearing(a, here)) % 360 + 540) % 360 - 180;  // −180…180, + = doprava
  const ad = Math.abs(delta), R = delta > 0;
  if (ad <= 15) return "Straight_turn";
  if (ad <= 45) return R ? "Slight_right_turn" : "Slight_left_turn";
  if (ad <= 135) return R ? "Right_turn" : "Left_turn";
  if (ad <= 170) return R ? "Sharp_right_turn" : "Sharp_left_turn";
  return "U_turn";
}

// ---- Místo na trase ----
// Cíl je buď existující bod trasy { li, idx }, nebo místo na úseku
// { li, seg, t } (mezi body seg a seg+1), kam se vloží nový bod trasy.
const VERTEX_SNAP_PX = 12;
function nearestOnRoutePx(cp){
  let best = null;
  trackLines.forEach(({ pts }, li) => {
    for (let i = 0; i < pts.length - 1; i++) {
      const a = map.latLngToContainerPoint(pts[i]), b = map.latLngToContainerPoint(pts[i + 1]);
      const dx = b.x - a.x, dy = b.y - a.y, len2 = dx * dx + dy * dy;
      const t = len2 ? Math.max(0, Math.min(1, ((cp.x - a.x) * dx + (cp.y - a.y) * dy) / len2)) : 0;
      const d = Math.hypot(a.x + dx * t - cp.x, a.y + dy * t - cp.y);
      if (!best || d < best.d) best = { li, seg: i, t, d, len: Math.sqrt(len2) };
    }
  });
  return best;
}
function routeTargetAt(cp, maxPx = SNAP_PX){
  const v = nearestVertexPx(cp);
  if (v && v.d <= VERTEX_SNAP_PX) return { li: v.li, idx: v.idx };
  const s = nearestOnRoutePx(cp);
  if (!s || s.d > maxPx) return v && v.d <= maxPx ? { li: v.li, idx: v.idx } : null;
  // Těsně u konce úseku → raději existující bod než nový hned vedle něj
  if (s.t * s.len <= VERTEX_SNAP_PX) return { li: s.li, idx: s.seg };
  if ((1 - s.t) * s.len <= VERTEX_SNAP_PX) return { li: s.li, idx: s.seg + 1 };
  return { li: s.li, seg: s.seg, t: s.t };
}

// Údaje nového bodu na úseku: poloha na čáře (desetinná místa jako sousedé,
// min. 6 ≈ 0,1 m), ele a u trkpt i time interpolované mezi sousedy
function pointOnSegment(li, seg, t){
  const line = trackLines[li], ea = line.els[seg], eb = line.els[seg + 1];
  const pa = P18(line.pts[seg]), pb = P18(line.pts[seg + 1]);
  const ll = CRS.pointToLatLng(L.point(pa.x + (pb.x - pa.x) * t, pa.y + (pb.y - pa.y) * t), 18);
  const dec = (v) => ((v || "").split(".")[1] || "").length;
  const nd = Math.min(9, Math.max(6, ...["lat", "lon"].flatMap(k => [dec(ea.getAttribute(k)), dec(eb.getAttribute(k))])));
  const out = { lat: ll.lat.toFixed(nd), lon: ll.lng.toFixed(nd), ele: null, time: null };
  const ta = childText(ea, "ele", gpx.ns), tb = childText(eb, "ele", gpx.ns);
  if (ta && tb && isFinite(ta) && isFinite(tb)) out.ele = (+ta + (tb - ta) * t).toFixed(Math.max(dec(ta), dec(tb)));
  const da = Date.parse(childText(ea, "time", gpx.ns)), db = Date.parse(childText(eb, "time", gpx.ns));
  if (line.kind === "trkseg" && isFinite(da) && isFinite(db)) {
    const iso = new Date(da + (db - da) * t).toISOString();
    out.time = /\.\d+/.test(childText(ea, "time", gpx.ns)) ? iso : iso.replace(/\.\d{3}Z$/, "Z");
  }
  return out;
}

// Připraví text a údaje pro waypoint na cíli; u místa na úseku vloží nový bod trasy
function placeAt(target){
  if (target.idx != null) {
    return { text: gpx.text, v: vertexData(target.li, target.idx), pos: routePos(target.li, target.idx),
             li: target.li, idx: target.idx, inserted: false };
  }
  const line = trackLines[target.li];
  const pts = locateLinePoints(gpx.text, line.kind, line.parent);
  const tmplEl = pts?.[line.idxs[target.seg]];
  if (!tmplEl) throw new Error("The route could not be located in the file.");
  const v = pointOnSegment(target.li, target.seg, target.t);
  const xml = buildPointXml(gpx.text.slice(tmplEl.start, tmplEl.end), v);
  return { text: insertPointText(gpx.text, line.kind, line.parent, line.idxs[target.seg], xml), v,
           pos: routePos(target.li, target.seg + target.t), inserted: true };
}

// ---- Operace ----
// presetType = typ převzatý z editoru (bod zájmu), jinak návrh podle úhlu
function addWptAtTarget(target, presetType = null){
  let pl;
  try{ pl = placeAt(target); }catch(e){ showToast("Could not add the waypoint: " + e.message, 8000); return; }
  const k = insertIndexFor(pl.pos);
  // Uprostřed rovného úseku žádná odbočka není → výchozí typ Waypoint (typicky POI)
  const type = presetType || (pl.inserted ? "Waypoint" : (suggestType(pl.li, pl.idx) || "Waypoint"));
  const xml = buildWptXml(templateWpt(), { lat: pl.v.lat, lon: pl.v.lon, ele: pl.v.ele, type });
  commitEdit(insertWptText(pl.text, k, xml), k);
  if (pl.inserted) showToast("A new route point was added on the line for this waypoint.");
}
function moveWptToTarget(item, target){
  let pl;
  try{ pl = placeAt(target); }catch(e){ showToast("Could not move the waypoint: " + e.message, 8000); return; }
  let x = wptTextAt(item.order);
  x = setAttrText(x, "lat", pl.v.lat);
  x = setAttrText(x, "lon", pl.v.lon);
  x = setChildText(x, "ele", pl.v.ele);
  const k = insertIndexFor(pl.pos, item.order);
  // Stejné místo v souboru → úprava na místě; jinak přesun mezi „sloty“ wpt
  const text = k === item.order ? replaceWptText(pl.text, item.order, x)
                                : moveWptText(pl.text, item.order, k, x);
  commitEdit(text, k);
}
const moveWptTo = (item, li, idx) => moveWptToTarget(item, { li, idx });
function setWptField(item, field, value){
  commitEdit(replaceWptText(gpx.text, item.order, setChildText(wptTextAt(item.order), field, value)), item.order);
}
function deleteWpt(item){
  commitEdit(deleteWptText(gpx.text, item.order), null);
}

// ---- Body trasy: hledání a zobrazení ----
function nearestVertexPx(containerPoint){
  let best = null;
  trackLines.forEach(({ pts }, li) => pts.forEach((p, idx) => {
    const d = map.latLngToContainerPoint(p).distanceTo(containerPoint);
    if (!best || d < best.d) best = { li, idx, d };
  }));
  return best;
}
function nearestVertexGeo(latlng){
  let best = null;
  trackLines.forEach(({ pts }, li) => pts.forEach((p, idx) => {
    const d = latlng.distanceTo(p);
    if (!best || d < best.d) best = { li, idx, d };
  }));
  return best;
}
const VERTEX_MAX = 4000;
function showVertices(on){
  vertexLayer.clearLayers();
  if (!on) return;
  let n = 0;
  for (const { pts } of trackLines) for (const p of pts) {
    if (n++ > VERTEX_MAX) return;
    L.circleMarker(p, { radius: 3.5, weight: 1.5, color: "#1f6feb", fillColor: "#fff", fillOpacity: 1, interactive: false, className: "vdot" }).addTo(vertexLayer);
  }
}

// ---- Klik do mapy: přidat / vybrat / zavřít ----
// Je-li v editoru vybraný waypoint s typem bodu zájmu, nový bod dostane stejný
// typ (rychlé přidávání více POI stejného druhu). Typy odboček se nepřebírají —
// ty se navrhují podle úhlu trasy v místě nového bodu.
function presetAddType(){
  const w = wptItems[selectedWpt];
  const c = isEditable(w) ? canonType(w.type) || "Waypoint" : null;
  return c && POI_TYPES[c] ? c : null;
}
// Zrušit výběr waypointu a zavřít editor
function deselectWpt(){
  const w = wptItems[selectedWpt];
  if (w) {
    w.marker.closeTooltip();
    w.marker.setIcon(iconFor(w, false));
    w.marker.setZIndexOffset(wptZ(w));
  }
  selectedWpt = -1;
  panelBody.querySelectorAll("#wpt-list li.selected").forEach(li => li.classList.remove("selected"));
  document.getElementById("editor-slot")?.replaceChildren();
  showVertices(false);
  if (isMobile()) document.body.classList.remove("sheet-open");
}
// Waypoint, jehož značka je do maxPx od bodu kliknutí (nejbližší)
const NEAR_WPT_PX = 20;
function nearestWptPx(cp, maxPx = NEAR_WPT_PX){
  let best = -1, bd = maxPx;
  wptItems.forEach((w, i) => {
    const d = map.latLngToContainerPoint(w.latlng).distanceTo(cp);
    if (d <= bd) { bd = d; best = i; }
  });
  return best;
}
const SNAP_PX = 40;
// Klik na trasu přidá waypoint; klik u existujícího waypointu ho vybere (editor);
// klik jinam zruší výběr (a zavře kartu generátoru). Klik přímo na značku
// obslouží značka sama.
map.on("click", (e) => {
  if (!gpx) return;
  const cp = e.containerPoint;
  if (gen) {                    // otevřená karta generátoru: klik mimo trasu ji zavře, jinak nic
    if (nearestWptPx(cp) < 0 && !routeTargetAt(cp)) closeGenerator();
    return;
  }
  const near = nearestWptPx(cp);
  if (near >= 0) { selectWpt(near, { from: "map" }); return; }
  const target = gpx.editable ? routeTargetAt(cp) : null;
  if (target) { addWptAtTarget(target, presetAddType()); return; }
  deselectWpt();
});

// ---- Klávesnice ----
window.addEventListener("keydown", (e) => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
  if (e.key === "Escape" && !typing) { if (gen) closeGenerator(); else if (selectedWpt >= 0) deselectWpt(); return; }
  if (!(e.ctrlKey || e.metaKey)) return;
  const k = e.key.toLowerCase();
  if (k === "s") { e.preventDefault(); if (gpx) saveGpx({ as: e.shiftKey }); return; }
  if (typing) return;
  if (k === "z" && !e.shiftKey) { e.preventDefault(); undo(); }
  else if (k === "y" || (k === "z" && e.shiftKey)) { e.preventDefault(); redo(); }
});
