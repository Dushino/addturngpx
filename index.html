// Všechny typy, které Suunto zná (apizone.suunto.com/route-description).
// Suunto je porovnává bez ohledu na velikost písmen; neznámý typ → "Waypoint".
const SUUNTO_TYPES = ("Aid_station Avalanche Beach Bedding Begin Big_fish Biggame Bird Building Cafe Camp " +
  "Campfire Camping Car Cave Cliff Coast Coral_reef Crossroads Danger Emergency End Fish Fishing_spot Food " +
  "Forest Geocache Hill Home Hostel Hotel Info Kelp_forest Lagoon Lake Left_at_fork_turn Left_turn Lodging " +
  "Marine_mammals Marine_reserve Meadow Mountain Mushrooms Parking Peak Prints Restaurant Right_at_fork_turn " +
  "Right_turn River Road Rock Roundabout_exit_1_turn Roundabout_exit_2_turn Roundabout_exit_3_turn " +
  "Roundabout_exit_4_turn Roundabout_exit_5_turn Roundabout_exit_n_turn Rub Scrape Sharp_left_turn " +
  "Sharp_right_turn Shot Sight Slight_left_turn Slight_right_turn Smallgame Stand Straight_turn Trail " +
  "Trailcam U_turn Valley Water Water_point Waterfall Waypoint Wreck").split(" ");
const TYPE_BY_LC = new Map(SUUNTO_TYPES.map(t => [t.toLowerCase(), t]));
// Kanonický tvar typu ("right_turn" → "Right_turn"); "" = bez typu, null = neznámý typ
function canonType(type){
  if (!type) return "";
  return TYPE_BY_LC.get(type.toLowerCase()) ?? null;
}

// Bez typu nebo neznámý typ → Suunto ho načte jako „Waypoint“
function typeInfo(type){
  const c = canonType(type);
  return TURN_TYPES[c] || POI_TYPES[c] || POI_TYPES.Waypoint;
}
// Kategorie pro barvu: "turn" | "poi" | "danger" | "generic"
function typeCat(type){
  const info = typeInfo(type);
  return info.cat || "turn";
}
// Obsah ikony (SVG + případně číslo výjezdu z kruhového objezdu).
// deg = natočení podle příjezdu; používá se jen u pokynů k odbočení.
function typeIconHtml(type, deg = 0){
  const info = typeInfo(type);
  const rot = deg ? ` style="transform:rotate(${deg.toFixed(1)}deg)"` : "";
  const sw = info.sw || (info.cat ? 2.2 : 2.6);   // Tabler ikony jsou jemnější, šipky silnější
  return `<svg viewBox="0 0 24 24"${rot} fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${info.svg}</svg>` +
    (info.num ? `<span class="rnum">${info.num}</span>` : "");
}
function typeLabel(type){
  const c = canonType(type);
  if (!c) return "Waypoint";          // bez typu nebo neznámý typ — Suunto použije Waypoint
  return typeInfo(c).label || c.replace(/_/g, " ");
}
// Upozornění na typ, který Suunto nezná
function typeWarning(type){
  return canonType(type) === null ? `Unknown type “${type}” – Suunto will show it as Waypoint` : null;
}

// Název trasy tak, jak ho ukážou hodinky: rte/trk name → rte/trk desc →
// metadata name → metadata desc → „Unnamed route“
function suuntoRouteName(doc, ns, routeEl){
  const meta = kids(doc.documentElement, "metadata", ns)[0];
  return (routeEl && (childText(routeEl, "name", ns) || childText(routeEl, "desc", ns))) ||
    (meta && (childText(meta, "name", ns) || childText(meta, "desc", ns))) || "Unnamed route";
}
// Surová hodnota <type>, např. "Sharp_right_turn"
function wptType(el, ns){ return childText(el, "type", ns); }
function wptLabel(el, ns){
  const name = childText(el, "name", ns);
  const tl = typeLabel(wptType(el, ns));
  return name ? (name === tl ? name : `${name} · ${tl}`) : tl;
}

// ---------- Poloha waypointu vůči trase ----------
// Suunto načte waypoint jen tehdy, když má stejné souřadnice jako některý
// rtept/trkpt. Zároveň z toho bodu trasy určíme příchozí směr pro natočení.
const CRS = L.CRS.EPSG3857;
const P18 = (ll) => CRS.latLngToPoint(ll, 18);  // Mercator je konformní → úhly nezávisí na zoomu
function bearing(a, b){
  const pa = P18(a), pb = P18(b);
  return Math.atan2(pb.x - pa.x, pa.y - pb.y) * 180 / Math.PI;  // 0° = sever, po směru hodin
}
const ptKey = (ll) => ll.lat + "," + ll.lng;

// Příchozí směr do vrcholu idx (přeskočí opakované body se stejnou polohou)
function incomingBearing(pts, idx){
  const here = pts[idx];
  for (let k = idx - 1; k >= 0; k--) if (!pts[k].equals(here, 0)) return bearing(pts[k], here);
  for (let k = idx + 1; k < pts.length; k++) if (!pts[k].equals(here, 0)) return bearing(here, pts[k]);
  return null;
}

// Klíč polohy → všechny výskyty na trase (trasa tam a zpět projde stejným
// bodem víckrát). li = pořadí čáry, idx = pořadí bodu v čáře.
function buildVertexIndex(lines){
  const index = new Map();
  lines.forEach(({ pts }, li) => pts.forEach((p, idx) => {
    const key = ptKey(p);
    if (!index.has(key)) index.set(key, []);
    index.get(key).push({ pts, li, idx });
  }));
  return index;
}

// → { onRoute, bearing (° nebo null), dist (m k nejbližšímu bodu trasy), hit }
// cursor = výskyt, na kterém ležel předchozí waypoint: waypointy jsou (u Suunto)
// seřazené podél trasy, takže z více výskytů bereme první, který leží za ním.
function analyzeWpt(latlng, lines, index, cursor){
  if (!lines.length) return { onRoute: false, bearing: null, dist: null };
  const hits = index.get(ptKey(latlng));
  if (hits) {
    const after = (h) => !cursor || h.li > cursor.li || (h.li === cursor.li && h.idx >= cursor.idx);
    const hit = hits.find(after) || hits[0];
    return { onRoute: true, bearing: incomingBearing(hit.pts, hit.idx), dist: 0, hit, pos: routePos(hit.li, hit.idx) };
  }

  // Mimo vrchol: směr z nejbližšího úseku, vzdálenost k nejbližšímu vrcholu
  const p = P18(latlng);
  let bestSeg = Infinity, segBearing = null, dist = Infinity, pos = null;
  lines.forEach(({ pts }, li) => {
    for (let i = 0; i < pts.length; i++) {
      dist = Math.min(dist, latlng.distanceTo(pts[i]));
      if (i === 0 || pts[i - 1].equals(pts[i], 0)) continue;
      const a = P18(pts[i - 1]), b = P18(pts[i]);
      const dx = b.x - a.x, dy = b.y - a.y;
      const t = Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / (dx * dx + dy * dy)));
      const d2 = (a.x + dx * t - p.x) ** 2 + (a.y + dy * t - p.y) ** 2;
      if (d2 < bestSeg) { bestSeg = d2; segBearing = bearing(pts[i - 1], pts[i]); pos = routePos(li, i - 1 + t); }
    }
  });
  return { onRoute: false, bearing: segBearing, dist, pos };
}
// Pozice na trase pro řazení seznamu: pořadí čáry, pak (desetinné) pořadí bodu
function routePos(li, idx){ return li * 1e7 + idx; }
function fmtDist(m){ return m < 1 ? m.toFixed(2) + " m" : m < 1000 ? Math.round(m) + " m" : (m / 1000).toFixed(2) + " km"; }

function metadataName(doc, ns){
  const meta = kids(doc.documentElement, "metadata", ns)[0];   // GPX 1.1
  return (meta ? childText(meta, "name", ns) : childText(doc.documentElement, "name", ns)); // GPX 1.0
}

// Dekódování bez zahození BOM (file.text() i res.text() ho tiše odstraní),
// aby se soubor dal později uložit bajt po bajtu stejně.
// Soubor v jiném kódování (podle deklarace <?xml … encoding="…"?>) se dekóduje
// v něm; při uložení se pak převede na UTF-8.
async function decodeText(blobOrResponse){
  const buf = await blobOrResponse.arrayBuffer();
  const head = new TextDecoder("latin1").decode(new Uint8Array(buf, 0, Math.min(buf.byteLength, 300)));
  const m = head.match(/^(?:\xEF\xBB\xBF)?<\?xml[^>]*?encoding\s*=\s*["']([^"']+)["']/i);
  let enc = m ? m[1] : "utf-8";
  try{ return new TextDecoder(enc, { ignoreBOM: true }).decode(buf); }
  catch(e){ return new TextDecoder("utf-8", { ignoreBOM: true }).decode(buf); }
}
// Kódování deklarované v textu (výchozí pro XML je UTF-8)
function declaredEncoding(text){
  const m = text.match(/^\uFEFF?<\?xml[^>]*?encoding\s*=\s*["']([^"']+)["']/i);
  return m ? m[1] : "UTF-8";
}

function parseGpx(text){
  const doc = new DOMParser().parseFromString(text.replace(/^\uFEFF/, ""), "application/xml");
  if (doc.getElementsByTagName("parsererror").length) {
    throw new Error("The file is not valid XML, so it cannot be a GPX file.");
  }
  const root = doc.documentElement;
  if (root.localName !== "gpx") {
    throw new Error(`The file is not a GPX file (its root element is <${root.localName}>, expected <gpx>).`);
  }
  // text = původní obsah souboru beze změny; DOM slouží jen ke čtení.
  // Při uložení se v textu nahradí jen úseky <wpt>, zbytek zůstane přesně.
  return { doc, ns: root.namespaceURI, text, encoding: declaredEncoding(text) };
}

// ---------- GPX: úpravy přímo v textu souboru ----------
// Aby zůstal formát souboru přesně zachován, nepracuje se s DOM + XMLSerializer,
// ale mění se jen dotčené úseky původního textu. Jednoduchý tokenizer najde
// elementy (komentáře, CDATA a instrukce přeskočí; „>“ v uvozovkách atributů nevadí).
const XML_TOKEN_RE = /<!--[\s\S]*?-->|<!\[CDATA\[[\s\S]*?\]\]>|<\?[\s\S]*?\?>|<!DOCTYPE(?:[^>[]|\[[\s\S]*?\])*>|<(\/?)([A-Za-z_][\w.:-]*)((?:"[^"]*"|'[^']*'|[^'">])*?)(\/?)>/g;
const localNameOf = (qname) => qname.slice(qname.indexOf(":") + 1);

// Přímí potomci kořenového elementu v textu s: [{ qname, name, start, openEnd, end, self }]
// (offsety v s; u párového elementu je closeStart začátek koncové značky)
function scanChildren(s){
  const out = [];
  let depth = 0, cur = null;
  XML_TOKEN_RE.lastIndex = 0;
  for (const m of s.matchAll(XML_TOKEN_RE)) {
    if (!m[2]) continue;                       // komentář, CDATA, instrukce
    const end = m.index + m[0].length;
    if (m[1] === "/") {
      depth--;
      if (depth === 1 && cur) { cur.closeStart = m.index; cur.end = end; out.push(cur); cur = null; }
      continue;
    }
    const self = m[4] === "/";
    if (depth === 1 && !cur) {
      cur = { qname: m[2], name: localNameOf(m[2]), start: m.index, openEnd: end, self };
      if (self) { cur.end = cur.closeStart = end; out.push(cur); cur = null; continue; }
    }
    if (!self) depth++;
  }
  return out;
}

const xmlEscape = (v) => String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const prefixOf = (qname) => qname.includes(":") ? qname.slice(0, qname.indexOf(":") + 1) : "";
const isWs = (str) => /^\s*$/.test(str);

// Odstraní úsek [a, b) textu; když úsek zabírá celé řádky (před ním i za ním je
// zalomení), odebere i odsazení před ním, aby nezůstal prázdný řádek.
function cutElement(text, a, b){
  let c = a;
  while (c > 0 && /[ \t\r\n]/.test(text[c - 1])) c--;
  const before = text.slice(c, a);
  const after = /^[ \t]*(\r?\n|$)/.test(text.slice(b)) || /^[ \t]*<\//.test(text.slice(b));
  return text.slice(0, before.includes("\n") && after ? c : a) + text.slice(b);
}

// Změní hodnotu atributu v počáteční značce elementu s (zachová uvozovky a mezery)
function setAttrText(s, attr, value){
  const tagEnd = s.indexOf(">") + 1;
  const re = new RegExp(`(\\s${attr}\\s*=\\s*)(["'])[^"']*\\2`);
  const head = s.slice(0, tagEnd);
  if (!re.test(head)) throw new Error(`Attribute ${attr} not found`);
  return head.replace(re, (all, pre, q) => pre + q + value + q) + s.slice(tagEnd);
}

// Pořadí potomků <wpt> podle schématu GPX 1.1 — nový element se vloží na správné místo
const WPT_CHILD_ORDER = ["ele", "time", "magvar", "geoidheight", "name", "cmt", "desc", "src", "link",
  "sym", "type", "fix", "sat", "hdop", "vdop", "pdop", "ageofdgpsdata", "dgpsid", "extensions"];

// Nastaví textový obsah potomka elementu s (value == null nebo "" → potomka odebere).
// Formátování (odsazení / vše na jednom řádku) převezme od stávajících potomků.
function setChildText(s, name, value){
  const root = scanChildren("<r>" + s + "</r>")[0];  // obalení: s je pak potomek kořene
  if (!root) throw new Error("Element not found");
  const off = 3;                                       // délka "<r>"
  const kidsArr = scanChildren(s);                     // přímí potomci s
  const prefix = prefixOf(root.qname);
  const child = kidsArr.find(c => c.name === name);
  const remove = value == null || value === "";

  if (child) {
    if (remove) return cutElement(s, child.start, child.end);
    const inner = xmlEscape(value);
    if (child.self) return s.slice(0, child.start) + `<${child.qname}>${inner}</${child.qname}>` + s.slice(child.end);
    return s.slice(0, child.openEnd) + inner + s.slice(child.closeStart);
  }
  if (remove) return s;

  const xml = `<${prefix}${name}>${xmlEscape(value)}</${prefix}${name}>`;
  const openEnd = root.openEnd - off;
  if (root.self) {
    // <wpt .../> → <wpt ...><name>…</name></wpt>
    const tag = s.slice(0, openEnd).replace(/\s*\/>$/, ">");
    return tag + xml + `</${root.qname}>` + s.slice(openEnd);
  }
  // Oddělovač mezi potomky (např. "\n    ") a před koncovou značkou
  const sep = kidsArr.length && isWs(s.slice(openEnd, kidsArr[0].start)) ? s.slice(openEnd, kidsArr[0].start) : "";
  const rank = (n) => { const i = WPT_CHILD_ORDER.indexOf(n); return i < 0 ? WPT_CHILD_ORDER.length : i; };
  const next = kidsArr.find(c => rank(c.name) > rank(name));
  if (next) return s.slice(0, next.start) + xml + sep + s.slice(next.start);
  const last = kidsArr[kidsArr.length - 1];
  if (last) return s.slice(0, last.end) + sep + xml + s.slice(last.end);
  return s.slice(0, openEnd) + xml + s.slice(openEnd);
}

// Úseky <wpt> v celém textu souboru (přímí potomci <gpx>), v pořadí souboru
function locateWpts(text){
  const body = text.replace(/^﻿/, "");
  const shift = text.length - body.length;
  const top = scanChildren(body);        // potomci „kořene“ = elementy na úrovni 1 → to je jen <gpx>
  // scanChildren vrací potomky kořene; kořenem je <gpx>, takže dostaneme přímo jeho děti
  return top.filter(c => c.name === "wpt").map(c => ({ ...c, start: c.start + shift, openEnd: c.openEnd + shift, end: c.end + shift, closeStart: c.closeStart + shift }));
}
function locateTop(text){
  const body = text.replace(/^﻿/, "");
  const shift = text.length - body.length;
  return scanChildren(body).map(c => ({ ...c, start: c.start + shift, openEnd: c.openEnd + shift, end: c.end + shift, closeStart: c.closeStart + shift }));
}

// Smaže k-tý <wpt> (i s odsazením jeho řádku)
function deleteWptText(text, k){
  const w = locateWpts(text)[k];
  return cutElement(text, w.start, w.end);
}

// Nahradí k-tý <wpt> novým textem elementu
function replaceWptText(text, k, wptXml){
  const w = locateWpts(text)[k];
  return text.slice(0, w.start) + wptXml + text.slice(w.end);
}

// Přesune k-tý <wpt> na pozici to (a nahradí ho textem wptXml). Mezery mezi
// waypointy zůstanou na svých místech — posunou se jen samotné elementy.
function moveWptText(text, from, to, wptXml){
  const slots = locateWpts(text);
  const items = slots.map(w => text.slice(w.start, w.end));
  items.splice(from, 1);
  items.splice(to, 0, wptXml);
  let out = text;
  for (let i = slots.length - 1; i >= 0; i--) out = out.slice(0, slots[i].start) + items[i] + out.slice(slots[i].end);
  return out;
}

// Vytvoří text nového <wpt> ve stylu vzoru (jiného <wpt> ze souboru, může být null)
function buildWptXml(template, { lat, lon, ele, name, type }){
  let prefix = "", sep = "", closeSep = "";
  if (template) {
    const root = scanChildren("<r>" + template + "</r>")[0];
    prefix = prefixOf(root.qname);
    const kidsArr = scanChildren(template);
    const openEnd = root.openEnd - 3;
    if (kidsArr.length) {
      const before = template.slice(openEnd, kidsArr[0].start);
      if (isWs(before)) sep = before;
      const after = template.slice(kidsArr[kidsArr.length - 1].end, root.closeStart - 3);
      if (isWs(after)) closeSep = after;
    }
  }
  const t = (n, v) => `<${prefix}${n}>${xmlEscape(v)}</${prefix}${n}>`;
  const parts = [];
  if (ele != null && ele !== "") parts.push(t("ele", ele));
  if (name) parts.push(t("name", name));
  if (type) parts.push(t("type", type));
  return `<${prefix}wpt lat="${lat}" lon="${lon}">` + (parts.length ? sep + parts.join(sep) + closeSep : "") + `</${prefix}wpt>`;
}

// Vloží nový <wpt> tak, aby byl na pozici k mezi ostatními wpt (k = počet wpt před ním).
// Bez wpt v souboru se vloží před první rte/trk/extensions, jinak před </gpx>.
function insertWptText(text, k, wptXml){
  const wpts = locateWpts(text);
  if (wpts.length) {
    // Mezera mezi sousedními elementy podle souboru (u Suunto často žádná)
    const top = locateTop(text);
    const i0 = top.indexOf(top.find(c => c.start === wpts[0].start));
    const nextEl = top[i0 + 1];
    const gapRaw = nextEl ? text.slice(wpts[0].end, nextEl.start) : "";
    const gap = isWs(gapRaw) ? gapRaw : "";
    if (k < wpts.length) return text.slice(0, wpts[k].start) + wptXml + gap + text.slice(wpts[k].start);
    const last = wpts[wpts.length - 1];
    return text.slice(0, last.end) + gap + wptXml + text.slice(last.end);
  }
  const top = locateTop(text);
  const before = top.find(c => ["rte", "trk", "extensions"].includes(c.name));
  if (before) {
    let a = before.start, ws = "";
    // převezmi odsazení řádku, na kterém element začíná
    let b = a; while (b > 0 && /[ \t]/.test(text[b - 1])) b--;
    if (b > 0 && text[b - 1] === "\n") ws = "\n" + text.slice(b, a);
    return text.slice(0, a) + wptXml + (ws ? ws : "") + text.slice(a);
  }
  const close = text.lastIndexOf("</");
  return text.slice(0, close) + wptXml + text.slice(close);
}

// ---------- GPX: vykreslení na mapu ----------
function endIcon(kind, selected = false){
  return L.divIcon({ className: "end-icon " + kind + (selected ? " selected" : ""), html: "<div>" + (kind === "start" ? "S" : "F") + "</div>", iconSize: [20, 20] });
}
function wptIcon(item, selected){
  const cat = typeCat(item.type);
  const cls = `wpt-icon cat-${cat}` + (selected ? " selected" : "") + (item.warn ? " warn" : "");
  // Natáčí se jen pokyny k odbočení; body zájmu směr nemají
  const deg = cat === "turn" ? (item.bearing || 0) : 0;
  return L.divIcon({ className: cls, html: "<div>" + typeIconHtml(item.type, deg) + "</div>", iconSize: [30, 30] });
}
// Suunto ukládá začátek a konec trasy jako waypointy s <type>Begin/End</type>.
// Zobrazují se jako značky start/cíl a needitují se.
function fixedKind(el, ns){
  const t = childText(el, "type", ns).toLowerCase();
  return t === "begin" ? "start" : t === "end" ? "finish" : null;
}
function wptZ(item){ return item.fixed ? 900 : 1000; }
function iconFor(item, selected){
  return item.fixed ? endIcon(item.fixed, selected) : wptIcon(item, selected);
}

function renderGpx(fit){
  gpxLayer.clearLayers();
  trackLines = [];
  wptItems = [];
  selectedWpt = -1;
  const stats = { trk: 0, trkPts: 0, trkLen: 0, rte: 0, rtePts: 0, rteLen: 0 };
  const allPts = [];

  if (gpx) {
    const { doc, ns } = gpx;
    const root = doc.documentElement;
    const addLine = (pts, els, dashed) => {
      const color = dashed ? ROUTE_COLOR : TRACK_COLOR;
      L.polyline(pts, { color: "#fff", weight: 7, opacity: .8, interactive: false }).addTo(gpxLayer);
      L.polyline(pts, { color, weight: 4, dashArray: dashed ? "8 8" : null, interactive: false }).addTo(gpxLayer);
      trackLines.push({ pts, els, color });
      allPts.push(...pts);
    };
    // Body čáry s platnou polohou: { pts: [L.LatLng], els: [Element] }
    const linePoints = (ptEls) => {
      const pts = [], els = [];
      for (const e of ptEls) { const ll = readLatLng(e); if (ll) { pts.push(ll); els.push(e); } }
      return { pts, els };
    };

    for (const trk of kids(root, "trk", ns)) {
      stats.trk++;
      for (const seg of kids(trk, "trkseg", ns)) {
        const { pts, els } = linePoints(kids(seg, "trkpt", ns));
        if (!pts.length) continue;
        stats.trkPts += pts.length;
        stats.trkLen += lineLength(pts);
        addLine(pts, els, false);
      }
    }
    // Routa je přerušovaná jen vedle tracku; samotná routa (např. export
    // ze Suunto) je hlavní čára a kreslí se plně.
    const dashRoutes = trackLines.length > 0;
    for (const rte of kids(root, "rte", ns)) {
      const { pts, els } = linePoints(kids(rte, "rtept", ns));
      stats.rte++;
      if (!pts.length) continue;
      stats.rtePts += pts.length;
      stats.rteLen += lineLength(pts);
      addLine(pts, els, dashRoutes);
    }

    const wpts = kids(root, "wpt", ns);
    // Editovat jde jen tehdy, když textový tokenizer našel stejné <wpt> jako DOM
    try{ gpx.editable = locateWpts(gpx.text).length === wpts.length; }catch(e){ gpx.editable = false; }
    // Waypointy, které Suunto vytvoří přímo z rtept/trkpt s <name> nebo <type>.
    // Jen se zobrazují — editují se výhradně <wpt>.
    const routeWpts = [];
    trackLines.forEach(({ pts, els }, li) => els.forEach((e, idx) => {
      if (kids(e, "name", ns).length || kids(e, "type", ns).length) routeWpts.push({ el: e, latlng: pts[idx], bearing: incomingBearing(pts, idx), pos: routePos(li, idx) });
    }));
    const kinds = wpts.map(el => fixedKind(el, ns)).concat(routeWpts.map(r => fixedKind(r.el, ns)));
    // Start/cíl odvozený z čáry jen tam, kde ho soubor nemá jako waypoint
    if (trackLines.length) {
      const first = trackLines[0].pts[0];
      const last = trackLines[trackLines.length - 1].pts.at(-1);
      if (!kinds.includes("start")) L.marker(first, { icon: endIcon("start"), keyboard: false, zIndexOffset: 500 }).bindTooltip("Start").addTo(gpxLayer);
      if (!kinds.includes("finish")) L.marker(last, { icon: endIcon("finish"), keyboard: false, zIndexOffset: 600 }).bindTooltip("Finish").addTo(gpxLayer);
    }

    const vertexIndex = buildVertexIndex(trackLines);
    let cursor = null;
    wpts.forEach((el, k) => {
      const latlng = readLatLng(el);
      if (!latlng) return;
      const item = { el, latlng, fixed: kinds[k], type: wptType(el, ns), order: k };
      // Begin/End patří vždy na začátek/konec seznamu
      item.pos = item.fixed === "start" ? -Infinity : item.fixed === "finish" ? Infinity : null;
      if (!item.fixed) {
        const a = analyzeWpt(latlng, trackLines, vertexIndex, cursor);
        if (a.hit) cursor = a.hit;
        item.hit = a.hit || null;
        item.pos = a.pos;
        item.bearing = a.bearing;
        // Varování jen když trasa existuje; soubor bez trasy hlásí panel
        item.warn = trackLines.length && !a.onRoute ? `Not on a route point – Suunto will ignore it (nearest point ${fmtDist(a.dist)})` : null;
        item.typeWarn = typeWarning(item.type);
      }
      const label = item.fixed ? (childText(el, "name", ns) || (item.fixed === "start" ? "Start" : "Finish")) : wptLabel(el, ns);
      const drag = canDrag && gpx.editable && !item.fixed;
      item.marker = L.marker(latlng, { icon: iconFor(item, false), zIndexOffset: wptZ(item), title: label, draggable: drag, autoPan: true })
        .bindTooltip(label, { direction: "top", offset: [0, -14] })
        .on("click", () => selectWpt(wptItems.indexOf(item), { from: "map" }))
        .addTo(gpxLayer);
      if (drag) {
        item.marker.on("dragstart", () => { selectWpt(wptItems.indexOf(item), { from: "map" }); showVertices(true); });
        item.marker.on("dragend", () => {
          // Přichytit k nejbližšímu bodu trasy; daleko od trasy → vrátit zpět
          const v = nearestVertexPx(map.latLngToContainerPoint(item.marker.getLatLng()));
          if (v && v.d <= SNAP_PX * 1.5) moveWptTo(item, v.li, v.idx);
          else { showToast("Drop the waypoint closer to the route – it can only be placed on a route point."); applyText(gpx.text, item.order); }
        });
      }
      wptItems.push(item);
      allPts.push(latlng);
    });

    routeWpts.forEach((r, k) => {
      const item = { el: r.el, latlng: r.latlng, fixed: fixedKind(r.el, ns), type: wptType(r.el, ns), bearing: r.bearing, fromRoute: true, order: wpts.length + k };
      item.pos = item.fixed === "start" ? -Infinity : item.fixed === "finish" ? Infinity : r.pos;
      item.typeWarn = item.fixed ? null : typeWarning(item.type);
      const label = item.fixed ? (childText(r.el, "name", ns) || (item.fixed === "start" ? "Start" : "Finish")) : wptLabel(r.el, ns);
      item.marker = L.marker(r.latlng, { icon: iconFor(item, false), zIndexOffset: wptZ(item), title: label })
        .bindTooltip(label + " (route point)", { direction: "top", offset: [0, -14] })
        .on("click", () => selectWpt(wptItems.indexOf(item), { from: "map" }))
        .addTo(gpxLayer);
      wptItems.push(item);
    });

    // Seznam v pořadí podél trasy (jak na body jezdec narazí); při shodě a bez
    // trasy rozhoduje pořadí v souboru.
    wptItems.sort((a, b) => (a.pos ?? Infinity) - (b.pos ?? Infinity) || a.order - b.order);
  }

  renderPanel(stats);
  updateArrows();
  showVertices(false);
  updateEditButtons();
  updateSaveButton();
  document.title = gpx ? `${gpx.fileName} – AddTurn GPX` : "AddTurn GPX";

  if (fit && allPts.length) {
    const sheet = isMobile() ? parseInt(getComputedStyle(document.documentElement).getPropertyValue("--sheet-peek")) || 0 : 0;
    map.fitBounds(L.latLngBounds(allPts), { paddingTopLeft: [30, 30], paddingBottomRight: [30, 30 + sheet], maxZoom: 16 });
  }
}

// Šipky směru: v pravidelných rozestupech (v pixelech) podél čar, jen ve
// viditelném výřezu. Přepočítávají se po každém posunu a zoomu.
const ARROW_SPACING = 110;
const ARROW_MAX = 400;
function updateArrows(){
  arrowLayer.clearLayers();
  if (!trackLines.length) return;
  const zoom = map.getZoom();
  const view = map.getPixelBounds().pad(0.1);
  let count = 0;
  for (const { pts, color } of trackLines) {
    let prev = map.project(pts[0], zoom);
    let next = ARROW_SPACING / 2;   // vzdálenost od začátku úseku k další šipce
    for (let i = 1; i < pts.length && count < ARROW_MAX; i++) {
      const cur = map.project(pts[i], zoom);
      const dx = cur.x - prev.x, dy = cur.y - prev.y;
      const len = Math.hypot(dx, dy);
      while (next <= len && count < ARROW_MAX) {
        const t = next / len;
        const p = L.point(prev.x + dx * t, prev.y + dy * t);
        if (view.contains(p)) {
          const deg = Math.atan2(dy, dx) * 180 / Math.PI;
          L.marker(map.unproject(p, zoom), {
            interactive: false, keyboard: false,
            icon: L.divIcon({
              className: "dir-arrow", iconSize: [14, 14],
              html: `<svg viewBox="0 0 14 14" style="transform:rotate(${deg}deg)"><path d="M3 2 L12 7 L3 12 L5.5 7 Z" fill="${color}" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>`
            })
          }).addTo(arrowLayer);
          count++;
        }
        next += ARROW_SPACING;
      }
      next -= len;
      prev = cur;
    }
  }
}
map.on("moveend", updateArrows);

// ---------- Panel: obsah ----------
const panelBody = document.getElementById("panel-body");
const wptCountEl = document.getElementById("wpt-count");

function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function fmtKm(m){ return (m / 1000).toFixed(m < 10000 ? 2 : 1) + " km"; }

function renderPanel(stats){
  panelBody.replaceChildren();
  wptCountEl.textContent = gpx ? `(${wptItems.length})` : "";

  if (!gpx) {
    panelBody.append(
      el("p", "empty", "No GPX file loaded."),
      el("p", "hint", "Use Open or Open URL" + (isMobile() ? "." : ", or drag a .gpx file into this window."))
    );
    return;
  }

  const info = el("div", "file-info");
  const text = el("div", "text");
  const nameEl = el("div", "name", gpx.fileName);
  if (gpx.dirty) { const b = el("span", "badge", "Modified"); b.title = "Changes not saved to a file yet"; nameEl.append(b); }
  text.append(nameEl);
  const lines = [];
  if (stats.trk) lines.push(`Track: ${fmtKm(stats.trkLen)} · ${stats.trkPts} points` + (stats.trk > 1 ? ` · ${stats.trk} tracks` : ""));
  if (stats.rte) lines.push(`Route: ${fmtKm(stats.rteLen)} · ${stats.rtePts} points` + (stats.rte > 1 ? ` · ${stats.rte} routes` : ""));
  const noRoute = !stats.trk && !stats.rte;
  if (!noRoute) {
    const routeEl = Array.from(gpx.doc.documentElement.children)
      .find(e => e.namespaceURI === gpx.ns && (e.localName === "trk" || e.localName === "rte"));
    lines.unshift("Name on watch: " + suuntoRouteName(gpx.doc, gpx.ns, routeEl));
  }
  if (noRoute) lines.push("No track or route in this file.");
  if (gpx.sourceUrl) lines.push("Downloaded from " + new URL(gpx.sourceUrl).hostname);
  for (const l of lines) text.append(el("div", "meta", l));
  if (noRoute && wptItems.length) text.append(el("div", "meta warn", "⚠ Without a route, Suunto will not import any waypoints."));
  const routeCount = stats.trk + stats.rte;
  if (routeCount > 1) text.append(el("div", "meta warn", `⚠ ${routeCount} tracks/routes in this file – Suunto imports each one as a separate route.`));
  const close = el("button");
  close.title = "Close file";
  close.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';
  close.addEventListener("click", closeGpx);
  if (gpx.editable === false) text.append(el("div", "meta warn", "⚠ Editing is disabled: the file structure was not recognized."));
  if (!/^utf-?8$/i.test(gpx.encoding || "UTF-8")) text.append(el("div", "meta warn", `⚠ Encoding ${gpx.encoding}: the file will be saved as UTF-8.`));
  const acts = el("div", "file-actions");
  if (canPickSave) {
    const b = el("button", null, "Save as…"); b.type = "button"; b.title = "Save to a new file (Ctrl+Shift+S)";
    b.addEventListener("click", () => saveGpx({ as: true }));
    acts.append(b);
  }
  if (canShareGpx()) {
    const b = el("button", null, "Share…"); b.type = "button"; b.title = "Send the file to another app (e.g. Suunto)";
    b.addEventListener("click", shareGpx);
    acts.append(b);
  }
  if (acts.children.length) text.append(acts);
  info.append(text, close);
  panelBody.append(info);
  const slot = el("div");
  slot.id = "editor-slot";
  panelBody.append(slot);

  if (!wptItems.length) {
    panelBody.append(el("p", "empty", "No waypoints in this file."));
    return;
  }
  const ul = el("ul");
  ul.id = "wpt-list";
  let num = 0;   // číslují se jen editovatelné body (bez Begin/End a bodů z trasy)
  wptItems.forEach((w, i) => {
    const li = el("li");
    const body = el("div");
    const name = childText(w.el, "name", gpx.ns);
    const tl = typeLabel(w.type);
    body.append(el("div", "wname", name || tl));
    const desc = childText(w.el, "desc", gpx.ns) || childText(w.el, "cmt", gpx.ns);
    const sub = w.fixed
      ? (w.fixed === "start" ? "Route start" : "Route end") + " · not editable"
      : [name && name !== tl ? tl : "", desc, w.fromRoute ? "in route point · not editable" : ""].filter(Boolean).join(" · ");
    if (sub) body.append(el("div", "wdesc", sub));
    if (w.warn) body.append(el("div", "wwarn", "⚠ " + w.warn));
    if (w.typeWarn) body.append(el("div", "wwarn", "⚠ " + w.typeWarn));
    if (w.fixed || w.fromRoute) li.classList.add("fixed");
    const icon = el("span", "ticon " + (w.fixed || "cat-" + typeCat(w.type)) + (w.warn ? " warn" : ""));
    if (w.fixed) icon.textContent = w.fixed === "start" ? "S" : "F";
    else icon.innerHTML = typeIconHtml(w.type);
    li.append(el("span", "idx", w.fixed || w.fromRoute ? "" : String(++num)), icon, body);
    li.addEventListener("click", () => selectWpt(i, { from: "list" }));
    ul.append(li);
  });
  panelBody.append(ul);
}

function selectWpt(i, { from }){
  const prev = wptItems[selectedWpt];
  if (prev) {
    // Popisek předchozího bodu zavřít — u blízkých bodů by jinak překryl nový
    prev.marker.closeTooltip();
    prev.marker.setIcon(iconFor(prev, false));
    prev.marker.setZIndexOffset(wptZ(prev));
  }
  selectedWpt = i;
  const w = wptItems[i];
  w.marker.setIcon(iconFor(w, true));
  w.marker.setZIndexOffset(3000);   // vybraný bod vždy nahoře
  const lis = panelBody.querySelectorAll("#wpt-list li");
  lis.forEach((li, j) => li.classList.toggle("selected", j === i));
  renderEditor();
  showVertices(addMode || isEditable(w));
  const editing = isEditable(w);
  if (from === "list") {
    map.setView(w.latlng, Math.max(map.getZoom(), 15), { animate: false });
    if (isMobile()) {
      if (editing) {
        // Panel s editorem zůstane otevřený; bod posuneme do horní (viditelné) části mapy
        document.body.classList.add("sheet-open");
        map.panBy([0, document.getElementById("map").clientHeight / 4], { animate: false });
      } else {
        // Na mobilu panel sbalíme, aby byl vybraný bod na mapě vidět
        document.body.classList.remove("sheet-open");
      }
    }
    w.marker.openTooltip();
  } else {
    if (isMobile() && editing) document.body.classList.add("sheet-open");
    if (from === "edit") {
      // Po úpravě: bod udržet ve výřezu, editor nahoře
      if (!map.getBounds().contains(w.latlng)) map.panTo(w.latlng);
      document.getElementById("editor-slot")?.scrollIntoView({ block: "nearest" });
    } else {
      lis[i]?.scrollIntoView({ block: "nearest" });
    }
    if (from === "edit") w.marker.openTooltip();
  }
}

// ---------- Editace waypointů ----------
// Každá úprava vytvoří nový text souboru (změní se jen dotčený <wpt>), ten se
// znovu načte a vykreslí. Undo/Redo drží předchozí texty v paměti.
const editHistory = { undo: [], redo: [] };     // položky: { text, sel }
let addMode = false;
const vertexLayer = L.layerGroup().addTo(map);
// Tažení značek jen bez dotykového ovládání (na dotyku by se pletlo s posunem mapy)
const canDrag = !matchMedia("(pointer: coarse)").matches;
const btnAdd = document.getElementById("btn-add");
const btnUndo = document.getElementById("btn-undo");
const btnRedo = document.getElementById("btn-redo");

const isEditable = (item) => !!(gpx?.editable && item && !item.fixed && !item.fromRoute);
// Pořadí vybraného <wpt> v souboru (pro obnovení výběru po úpravě)
const selectedOrder = () => { const w = wptItems[selectedWpt]; return w && !w.fromRoute ? w.order : null; };

function wptTextAt(k){
  const w = locateWpts(gpx.text)[k];
  return gpx.text.slice(w.start, w.end);
}
// Přesné textové hodnoty bodu trasy (souřadnice se kopírují znak po znaku)
function vertexData(li, idx){
  const e = trackLines[li].els[idx];
  return { lat: e.getAttribute("lat"), lon: e.getAttribute("lon"), ele: childText(e, "ele", gpx.ns) || null };
}

function updateEditButtons(){
  const hasRoute = !!(gpx && trackLines.length);
  btnAdd.disabled = !(gpx?.editable && hasRoute);
  btnUndo.disabled = !editHistory.undo.length;
  btnRedo.disabled = !editHistory.redo.length;
}

// Použije nový text souboru (po úpravě nebo z historie) a obnoví výběr
function applyText(text, selOrder){
  let parsed;
  try{ parsed = parseGpx(text); }
  catch(e){ showToast("Edit failed: " + e.message, 8000); return false; }
  gpx = { ...gpx, ...parsed, dirty: text !== gpx.cleanText };
  renderGpx(false);
  if (selOrder != null) selectByOrder(selOrder, { from: "edit" });
  saveSession();
  updateEditButtons();
  return true;
}
function commitEdit(text, selOrder){
  if (text === gpx.text) return;
  const prev = { text: gpx.text, sel: selectedOrder() };
  if (applyText(text, selOrder)) {
    editHistory.undo.push(prev);
    editHistory.redo.length = 0;
    updateEditButtons();
  }
}
function undo(){
  const step = editHistory.undo.pop();
  if (!step) return;
  editHistory.redo.push({ text: gpx.text, sel: selectedOrder() });
  applyText(step.text, step.sel);
}
function redo(){
  const step = editHistory.redo.pop();
  if (!step) return;
  editHistory.undo.push({ text: gpx.text, sel: selectedOrder() });
  applyText(step.text, step.sel);
}
btnUndo.addEventListener("click", undo);
btnRedo.addEventListener("click", redo);

function selectByOrder(order, opts){
  const i = wptItems.findIndex(w => !w.fromRoute && w.order === order);
  if (i >= 0) selectWpt(i, opts);
}

// Index, na který vložit wpt s pozicí pos mezi ostatní <wpt> (bez exclude),
// aby pořadí v souboru odpovídalo pořadí na trase
function insertIndexFor(pos, exclude = -1){
  const others = wptItems.filter(w => !w.fromRoute && w.order !== exclude).sort((a, b) => a.order - b.order);
  const k = others.findIndex(w => (w.pos ?? Infinity) > pos);
  return k < 0 ? others.length : k;
}
// Vzor formátování pro nový <wpt>: nejlépe běžný waypoint, jinak Begin/End
function templateWpt(){
  const w = wptItems.find(w => !w.fromRoute && !w.fixed) || wptItems.find(w => !w.fromRoute);
  return w ? wptTextAt(w.order) : null;
}

// ---- Návrh typu podle úhlu trasy ----
// Směr příjezdu a odjezdu se měří na ~15 m (u hustých záznamů tras by
// sousední body dávaly náhodný úhel).
function suggestType(li, idx){
  const pts = trackLines[li].pts, here = pts[idx];
  let a = null, b = null;
  for (let k = idx - 1; k >= 0; k--) { a = pts[k]; if (here.distanceTo(a) >= 15) break; }
  for (let k = idx + 1; k < pts.length; k++) { b = pts[k]; if (here.distanceTo(b) >= 15) break; }
  if (!a || !b || a.equals(here, 0) || b.equals(here, 0)) return null;
  const delta = ((bearing(here, b) - bearing(a, here)) % 360 + 540) % 360 - 180;  // −180…180, + = doprava
  const ad = Math.abs(delta), R = delta > 0;
  if (ad <= 15) return "Straight_turn";
  if (ad <= 45) return R ? "Slight_right_turn" : "Slight_left_turn";
  if (ad <= 135) return R ? "Right_turn" : "Left_turn";
  if (ad <= 170) return R ? "Sharp_right_turn" : "Sharp_left_turn";
  return "U_turn";
}

// ---- Operace ----
function addWptAt(li, idx){
  const v = vertexData(li, idx);
  const k = insertIndexFor(routePos(li, idx));
  const xml = buildWptXml(templateWpt(), { lat: v.lat, lon: v.lon, ele: v.ele, type: suggestType(li, idx) || "Waypoint" });
  commitEdit(insertWptText(gpx.text, k, xml), k);
}
function moveWptTo(item, li, idx){
  const v = vertexData(li, idx);
  let x = wptTextAt(item.order);
  x = setAttrText(x, "lat", v.lat);
  x = setAttrText(x, "lon", v.lon);
  x = setChildText(x, "ele", v.ele);
  const k = insertIndexFor(routePos(li, idx), item.order);
  // Stejné místo v souboru → úprava na místě; jinak přesun mezi „sloty“ wpt
  const text = k === item.order ? replaceWptText(gpx.text, item.order, x)
                                : moveWptText(gpx.text, item.order, k, x);
  commitEdit(text, k);
}
function setWptField(item, field, value){
  commitEdit(replaceWptText(gpx.text, item.order, setChildText(wptTextAt(item.order), field, value)), item.order);
}
function deleteWpt(item){
  commitEdit(deleteWptText(gpx.text, item.order), null);
}

// ---- Body trasy: hledání a zobrazení ----
function nearestVertexPx(containerPoint){
  let best = null;
  trackLines.forEach(({ pts }, li) => pts.forEach((p, idx) => {
    const d = map.latLngToContainerPoint(p).distanceTo(containerPoint);
    if (!best || d < best.d) best = { li, idx, d };
  }));
  return best;
}
function nearestVertexGeo(latlng){
  let best = null;
  trackLines.forEach(({ pts }, li) => pts.forEach((p, idx) => {
    const d = latlng.distanceTo(p);
    if (!best || d < best.d) best = { li, idx, d };
  }));
  return best;
}
const VERTEX_MAX = 4000;
function showVertices(on){
  vertexLayer.clearLayers();
  if (!on) return;
  let n = 0;
  for (const { pts } of trackLines) for (const p of pts) {
    if (n++ > VERTEX_MAX) return;
    L.circleMarker(p, { radius: 3.5, weight: 1.5, color: "#1f6feb", fillColor: "#fff", fillOpacity: 1, interactive: false, className: "vdot" }).addTo(vertexLayer);
  }
}

// ---- Režim přidávání ----
const addBar = document.getElementById("add-bar");
function setAddMode(on){
  addMode = on && !btnAdd.disabled;
  document.body.classList.toggle("adding", addMode);
  addBar.hidden = !addMode;
  btnAdd.setAttribute("aria-pressed", String(addMode));
  if (addMode && isMobile()) document.body.classList.remove("sheet-open");
  showVertices(addMode || isEditable(wptItems[selectedWpt]));
}
btnAdd.addEventListener("click", () => setAddMode(!addMode));
document.getElementById("add-cancel").addEventListener("click", () => setAddMode(false));
const SNAP_PX = 40;
map.on("click", (e) => {
  if (!addMode) return;
  const v = nearestVertexPx(e.containerPoint);
  if (!v || v.d > SNAP_PX) { showToast("Tap closer to the route – a waypoint can only be placed on a route point."); return; }
  setAddMode(false);
  addWptAt(v.li, v.idx);
});

// ---- Klávesnice ----
window.addEventListener("keydown", (e) => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
  if (e.key === "Escape" && addMode) { setAddMode(false); return; }
  if (!(e.ctrlKey || e.metaKey)) return;
  const k = e.key.toLowerCase();
  if (k === "s") { e.preventDefault(); if (gpx) saveGpx({ as: e.shiftKey }); return; }
  if (typing) return;
  if (k === "z" && !e.shiftKey) { e.preventDefault(); undo(); }
  else if (k === "y" || (k === "z" && e.shiftKey)) { e.preventDefault(); redo(); }
});

// ---- Panel editoru ----
const TURN_ORDER = ["Left_turn", "Right_turn", "Slight_left_turn", "Slight_right_turn", "Sharp_left_turn", "Sharp_right_turn",
  "Left_at_fork_turn", "Right_at_fork_turn", "Straight_turn", "U_turn",
  "Roundabout_exit_1_turn", "Roundabout_exit_2_turn", "Roundabout_exit_3_turn", "Roundabout_exit_4_turn", "Roundabout_exit_5_turn", "Roundabout_exit_n_turn"];
const POI_ORDER = Object.keys(POI_TYPES).filter(t => t !== "Waypoint");

function renderEditor(){
  const slot = document.getElementById("editor-slot");
  if (!slot) return;
  slot.replaceChildren();
  const w = wptItems[selectedWpt];
  if (!isEditable(w)) return;

  const ed = el("div", "editor");
  const cur = canonType(w.type) || "Waypoint";
  const hit = w.hit;
  const suggestion = hit ? suggestType(hit.li, hit.idx) : null;

  const h = el("h3");
  const ic = el("span", "ticon cat-" + typeCat(w.type) + (w.warn ? " warn" : ""));
  ic.innerHTML = typeIconHtml(w.type);
  h.append(ic, el("span", null, "Edit waypoint"));
  ed.append(h);

  // Typ
  ed.append(el("div", "elabel", "Type"));
  const typeBtn = (t) => {
    const b = el("button", "tbtn" + (t === cur ? " selected" : "") + (t === suggestion ? " suggested" : ""));
    b.type = "button";
    b.title = typeLabel(t) + (t === suggestion ? " (suggested by route angle)" : "");
    const ti = el("span", "ticon cat-" + typeCat(t));
    ti.innerHTML = typeIconHtml(t);
    b.append(ti);
    b.addEventListener("click", () => { if (t !== cur || w.type !== t) setWptField(w, "type", t); });
    return b;
  };
  const turns = el("div", "tgrid");
  TURN_ORDER.forEach(t => turns.append(typeBtn(t)));
  ed.append(turns);
  const det = el("details");
  det.open = !!POI_TYPES[cur];
  det.append(el("summary", null, "Points of interest"));
  const pois = el("div", "tgrid");
  ["Waypoint", ...POI_ORDER].forEach(t => pois.append(typeBtn(t)));
  det.append(pois);
  ed.append(det);
  ed.append(el("div", "tlabel", typeLabel(w.type) + (suggestion && suggestion !== cur ? ` · suggested: ${typeLabel(suggestion)}` : "")));
  if (w.typeWarn) ed.append(el("div", "wwarn", "⚠ " + w.typeWarn));

  // Název
  const lab = el("label", null, "Name (optional)");
  const inp = el("input");
  inp.type = "text";
  inp.value = childText(w.el, "name", gpx.ns);
  inp.placeholder = typeLabel(w.type);
  inp.maxLength = 100;
  lab.htmlFor = inp.id = "wpt-name";
  inp.addEventListener("keydown", (e) => { if (e.key === "Enter") inp.blur(); });
  inp.addEventListener("change", () => setWptField(w, "name", inp.value.trim()));
  ed.append(lab, inp, el("div", "hint", "Watches may shorten long names."));

  // Poloha
  ed.append(el("div", "elabel", "Position on route"));
  const row = el("div", "row");
  if (hit) {
    const pts = trackLines[hit.li].pts;
    const prev = el("button", null, "◀ Previous point"); prev.type = "button";
    const next = el("button", null, "Next point ▶"); next.type = "button";
    prev.disabled = hit.idx <= 0;
    next.disabled = hit.idx >= pts.length - 1;
    prev.addEventListener("click", () => moveWptTo(w, hit.li, hit.idx - 1));
    next.addEventListener("click", () => moveWptTo(w, hit.li, hit.idx + 1));
    row.append(prev, next);
  } else {
    const snap = el("button", null, "Snap to nearest route point"); snap.type = "button";
    snap.disabled = !trackLines.length;
    snap.addEventListener("click", () => { const v = nearestVertexGeo(w.latlng); if (v) moveWptTo(w, v.li, v.idx); });
    row.append(snap);
  }
  ed.append(row);
  if (canDrag) ed.append(el("div", "hint", "Tip: you can also drag the marker on the map."));

  // Smazání (s potvrzením přímo v panelu)
  const delRow = el("div", "row");
  delRow.style.marginTop = "12px";
  const del = el("button", "danger-outline", "Delete waypoint"); del.type = "button";
  del.addEventListener("click", () => {
    delRow.replaceChildren();
    const c = el("div", "confirm");
    const yes = el("button", "danger", "Delete"); yes.type = "button";
    const no = el("button", null, "Cancel"); no.type = "button";
    yes.addEventListener("click", () => deleteWpt(w));
    no.addEventListener("click", renderEditor);
    c.append(el("span", null, "Delete this waypoint?"), yes, no);
    delRow.append(c);
  });
  delRow.append(del);
  ed.append(delRow);

  slot.append(ed);
}

// ---- Potvrzení před zahozením neuložených změn ----
const confirmDialog = document.getElementById("confirm-dialog");
function confirmDiscard(){
  if (!gpx?.dirty) return Promise.resolve(true);
  document.getElementById("confirm-text").textContent =
    `“${gpx.fileName}” has changes that have not been saved to a file. They will be lost.`;
  confirmDialog.showModal();
  return new Promise((resolve) => {
    const done = (v) => { confirmDialog.close(); cleanup(); resolve(v); };
    const ok = (e) => { e.preventDefault(); done(true); };
    const cancel = () => done(false);
    const onClose = () => { cleanup(); resolve(false); };
    const form = document.getElementById("confirm-form");
    const cbtn = document.getElementById("confirm-cancel");
    function cleanup(){ form.removeEventListener("submit", ok); cbtn.removeEventListener("click", cancel); confirmDialog.removeEventListener("close", onClose); }
    form.addEventListener("submit", ok);
    cbtn.addEventListener("click", cancel);
    confirmDialog.addEventListener("close", onClose);
  });
}

// ---------- GPX: načtení a zavření ----------
function setGpx(next, { fit = true, persist = true } = {}){
  if (next) {
    next.dirty = !!next.dirty;
    next.cleanText = next.dirty ? null : next.text;   // text, který odpovídá souboru na disku
  }
  editHistory.undo.length = editHistory.redo.length = 0;
  setAddMode(false);
  gpx = next;
  renderGpx(fit);
  if (persist) saveSession();
}

// Vrací true při úspěchu; chybu ukáže uživateli
function loadGpxText(text, meta){
  try{
    const parsed = parseGpx(text);
    setGpx({ ...parsed, fileName: meta.fileName || "track.gpx", sourceUrl: meta.sourceUrl || null, handle: meta.handle || null });
    return true;
  }catch(e){
    showToast(`Could not open ${meta.fileName || "the file"}: ${e.message}`, 8000);
    return false;
  }
}

async function closeGpx(){
  if (!(await confirmDiscard())) return;
  setGpx(null, { fit: false });
}

// ---------- Otevření lokálního souboru ----------
const fileInput = document.getElementById("file-input");
// Na dotykových zařízeních filtr přípon vynecháme — Android .gpx často
// nepozná (nemá pro něj MIME typ) a soubor by nešel vybrat.
if (!matchMedia("(pointer: coarse)").matches) fileInput.accept = ".gpx,application/gpx+xml";

async function openLocalFile(){
  if (!(await confirmDiscard())) return;
  if (window.showOpenFilePicker) {
    // Chrome/Edge desktop: získáme i handle, do souboru půjde později uložit zpět
    let handle;
    try{
      [handle] = await window.showOpenFilePicker({
        types: [{ description: "GPX files", accept: { "application/gpx+xml": [".gpx"] } }]
      });
    }catch(e){
      if (e.name !== "AbortError") showToast("Could not open the file: " + e.message, 8000);
      return;
    }
    const file = await handle.getFile();
    loadGpxText(await decodeText(file), { fileName: file.name, handle });
  } else {
    fileInput.value = "";
    fileInput.click();
  }
}
fileInput.addEventListener("change", async () => {
  const file = fileInput.files[0];
  if (file) loadGpxText(await decodeText(file), { fileName: file.name });
});
document.getElementById("btn-open").addEventListener("click", openLocalFile);

// ---------- Přetažení souboru do okna ----------
const dropEl = document.getElementById("drop");
let dragDepth = 0;
const hasFiles = (e) => Array.from(e.dataTransfer?.types || []).includes("Files");
window.addEventListener("dragenter", (e) => { if (hasFiles(e)) { dragDepth++; dropEl.hidden = false; } });
window.addEventListener("dragleave", (e) => { if (hasFiles(e) && --dragDepth <= 0) { dragDepth = 0; dropEl.hidden = true; } });
window.addEventListener("dragover", (e) => { if (hasFiles(e)) e.preventDefault(); });
window.addEventListener("drop", async (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  dragDepth = 0;
  dropEl.hidden = true;
  const item = Array.from(e.dataTransfer.items).find(it => it.kind === "file");
  if (!item) return;
  // Chrome umí i u přetaženého souboru vrátit handle (pro pozdější uložení zpět)
  const handlePromise = item.getAsFileSystemHandle ? item.getAsFileSystemHandle().catch(() => null) : Promise.resolve(null);
  const file = item.getAsFile();
  const handle = await handlePromise;
  if (!(await confirmDiscard())) return;
  loadGpxText(await decodeText(file), { fileName: file.name, handle: handle?.kind === "file" ? handle : null });
});

// ---------- Otevření z URL ----------
// Odkaz na soubor na github.com převedeme na „raw“ adresu, která povoluje CORS
function normalizeUrl(u){
  const m = u.match(/^https:\/\/github\.com\/([^/]+)\/([^/]+)\/blob\/(.+)$/);
  return m ? `https://raw.githubusercontent.com/${m[1]}/${m[2]}/${m[3]}` : u;
}
// Název souboru: z URL, pokud končí na .gpx; jinak (např. Suunto export,
// kde je v URL jen dlouhý kód) podle <metadata><name> ze souboru.
// Hlavička Content-Disposition s názvem se čte, jen pokud ji server zpřístupní.
function fileNameFor(url, res, parsed){
  const cd = res.headers.get("Content-Disposition") || "";
  const m = cd.match(/filename\*?=(?:UTF-8'')?"?([^";]+)"?/i);
  if (m) return decodeURIComponent(m[1]);
  const last = decodeURIComponent(url.pathname.split("/").filter(Boolean).pop() || "");
  if (/\.gpx$/i.test(last)) return last;
  const meta = metadataName(parsed.doc, parsed.ns).replace(/[\\/:*?"<>|]+/g, "_");
  return (meta || "track") + ".gpx";
}

// Stáhne a otevře GPX; při chybě vyhodí Error se srozumitelnou zprávou
async function openFromUrl(input){
  let url;
  try{ url = new URL(normalizeUrl(input.trim())); }
  catch(e){ throw new Error("This is not a valid URL."); }
  if (!/^https?:$/.test(url.protocol)) throw new Error("Only http:// and https:// URLs are supported.");
  if (location.protocol === "https:" && url.protocol === "http:") {
    throw new Error("The browser does not allow loading an http:// URL from this secure (https://) page. Try the https:// version of the link, or download the file and use Open.");
  }
  let res;
  try{
    res = await fetch(url.href, { credentials: "omit", cache: "no-store" });
  }catch(e){
    throw new Error("The file could not be downloaded. Most likely the server does not allow other websites to read its files (CORS), or the network is unavailable. Download the file in your browser and open it with “Open local file” instead.");
  }
  if (!res.ok) throw new Error(`The server responded with HTTP ${res.status}${res.statusText ? " " + res.statusText : ""}.`);
  const parsed = parseGpx(await decodeText(res));
  setGpx({ ...parsed, fileName: fileNameFor(url, res, parsed), sourceUrl: url.href, handle: null });
}

const urlDialog = document.getElementById("url-dialog");
const urlForm = document.getElementById("url-form");
const urlInput = document.getElementById("url-input");
const urlError = document.getElementById("url-error");
const urlOk = document.getElementById("url-ok");
const urlLocal = document.getElementById("url-local");

function openUrlDialog(prefill = "", error = ""){
  urlInput.value = prefill || gpx?.sourceUrl || "";
  urlError.textContent = error;
  urlError.hidden = !error;
  urlLocal.hidden = !error;
  urlOk.disabled = false;
  urlDialog.showModal();
  urlInput.select();
}
urlForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  urlOk.disabled = true;
  urlOk.textContent = "Loading…";
  urlError.hidden = true;
  try{
    if (!(await confirmDiscard())) return;
    await openFromUrl(urlInput.value);
    urlDialog.close();
  }catch(err){
    urlError.textContent = err.message;
    urlError.hidden = false;
    urlLocal.hidden = false;
  }finally{
    urlOk.disabled = false;
    urlOk.textContent = "Open";
  }
});
document.getElementById("url-cancel").addEventListener("click", () => urlDialog.close());
urlLocal.addEventListener("click", () => { urlDialog.close(); openLocalFile(); });
// (openLocalFile se sám zeptá na neuložené změny)
document.getElementById("btn-url").addEventListener("click", () => openUrlDialog());

// ---------- Uložení ----------
// Ukládá se přesně text v paměti (UTF-8). Nezměněné části souboru jsou tak
// bajt po bajtu stejné jako originál — včetně BOM, konců řádků a deklarace.
const btnSave = document.getElementById("btn-save");
const canPickSave = typeof window.showSaveFilePicker === "function";
const GPX_TYPE = "application/gpx+xml";

// Text k uložení; soubor v jiném kódování se převede na UTF-8 (upraví se deklarace)
function textForSave(){
  if (!gpx.encoding || /^utf-?8$/i.test(gpx.encoding)) return { text: gpx.text, converted: false };
  const text = gpx.text.replace(/^(\uFEFF?<\?xml[^>]*?encoding\s*=\s*)(["'])[^"']*\2/i, (all, pre, q) => pre + q + "UTF-8" + q);
  return { text, converted: true };
}
const gpxFile = (text) => new File([new TextEncoder().encode(text)], gpx.fileName, { type: GPX_TYPE });

async function writeToHandle(handle, file){
  if (handle.queryPermission && (await handle.queryPermission({ mode: "readwrite" })) !== "granted") {
    if ((await handle.requestPermission({ mode: "readwrite" })) !== "granted") throw new Error("Permission to write the file was denied.");
  }
  const w = await handle.createWritable();
  await w.write(file);
  await w.close();
}
function downloadFile(file){
  const url = URL.createObjectURL(file);
  const a = el("a");
  a.href = url;
  a.download = file.name;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}

// as = true → vždy se zeptat, kam uložit (Save as…)
async function saveGpx({ as = false } = {}){
  if (!gpx) return;
  document.activeElement?.blur?.();            // potvrdit rozepsaný název waypointu
  const { text, converted } = textForSave();
  const fromEncoding = gpx.encoding;
  const file = gpxFile(text);
  let how;
  try{
    if (!as && gpx.handle) {
      await writeToHandle(gpx.handle, file);
      how = `Saved to ${gpx.handle.name}.`;
    } else if (canPickSave) {
      const handle = await window.showSaveFilePicker({
        suggestedName: gpx.fileName,
        types: [{ description: "GPX file", accept: { [GPX_TYPE]: [".gpx"] } }]
      });
      await writeToHandle(handle, file);
      gpx.handle = handle;
      gpx.fileName = handle.name;
      how = `Saved as ${handle.name}.`;
    } else {
      downloadFile(file);
      how = `Downloaded ${file.name}.`;
    }
  }catch(e){
    if (e.name !== "AbortError") showToast("Could not save the file: " + e.message, 8000);
    return;
  }
  markSaved(text);
  showToast(how + (converted ? ` The file was converted from ${fromEncoding} to UTF-8.` : ""));
}

// Uložený text je nový výchozí stav („Modified“ zmizí; Undo dál funguje)
function markSaved(text){
  gpx.cleanText = text;
  const sel = selectedOrder();
  applyText(text, sel);
}

// Sdílení (mobil): jen kde prohlížeč umí sdílet soubor tohoto typu
function canShareGpx(){
  if (!navigator.canShare || !gpx) return false;
  try{ return navigator.canShare({ files: [gpxFile(gpx.text)] }); }catch(e){ return false; }
}
async function shareGpx(){
  const { text } = textForSave();
  try{
    await navigator.share({ files: [gpxFile(text)], title: gpx.fileName });
  }catch(e){
    if (e.name !== "AbortError") showToast("Could not share the file: " + e.message, 8000);
  }
}

function updateSaveButton(){
  btnSave.disabled = !gpx;
  if (!gpx) { btnSave.title = "Save GPX"; return; }
  btnSave.title = gpx.handle ? `Save – overwrite ${gpx.handle.name} (Ctrl+S)`
    : canPickSave ? "Save as… (Ctrl+S)" : `Download ${gpx.fileName} (Ctrl+S)`;
}
btnSave.addEventListener("click", () => saveGpx());

// ---------- Relace v IndexedDB (přežije obnovení stránky) ----------
const DB_NAME = "addturngpx";
const DB_STORE = "session";
function idbOpen(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(DB_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbRun(mode, fn){
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, mode);
    const req = fn(tx.objectStore(DB_STORE));
    tx.oncomplete = () => { db.close(); resolve(req.result); };
    tx.onerror = tx.onabort = () => { db.close(); reject(tx.error); };
  });
}
async function saveSession(){
  try{
    if (!gpx) { await idbRun("readwrite", s => s.delete("current")); return; }
    const rec = {
      xml: gpx.text,
      fileName: gpx.fileName, sourceUrl: gpx.sourceUrl, handle: gpx.handle, dirty: !!gpx.dirty, savedAt: Date.now()
    };
    try{
      await idbRun("readwrite", s => s.put(rec, "current"));
    }catch(e){
      // Některé prohlížeče neumí uložit file handle — uložíme relaci bez něj
      if (!rec.handle) throw e;
      rec.handle = null;
      await idbRun("readwrite", s => s.put(rec, "current"));
    }
  }catch(e){
    console.warn("Could not save the session:", e);
  }
}
async function restoreSession(){
  try{
    const rec = await idbRun("readonly", s => s.get("current"));
    if (!rec?.xml) return false;
    setGpx({ ...parseGpx(rec.xml), fileName: rec.fileName, sourceUrl: rec.sourceUrl, handle: rec.handle || null, dirty: !!rec.dirty }, { fit: false, persist: false });
    return true;
  }catch(e){
    console.warn("Could not restore the session:", e);
    return false;
  }
}

// ---------- Start ----------
// ?url=… otevře GPX z odkazu; parametr pak z adresy odstraníme, aby obnovení
// stránky načetlo uloženou relaci (i s úpravami), ne znovu původní soubor.
async function startup(){
  const params = new URLSearchParams(location.search);
  const linkUrl = params.get("url");
  if (linkUrl) {
    params.delete("url");
    const rest = params.toString();
    history.replaceState(null, "", location.pathname + (rest ? "?" + rest : "") + location.hash);
    // Neuložené úpravy v relaci nezahodit bez zeptání
    await restoreSession();
    if (!(await confirmDiscard())) return;
    try{
      await openFromUrl(linkUrl);
      return;
    }catch(e){
      openUrlDialog(linkUrl, e.message);
      return;
    }
  }
  if (!(await restoreSession())) renderGpx(false);
}
startup();

// ---------- Service worker (offline chod) ----------
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
