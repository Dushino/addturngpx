<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AddTurn GPX</title>
<meta name="theme-color" content="#f3f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141a17" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AddTurn GPX">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
  /* ---------- Barvy: světlý režim je výchozí, tmavý podle systému ---------- */
  :root{
    color-scheme: light;
    --bg: #f3f5f2;
    --surface: #ffffff;
    --surface-2: #e8ece8;
    --text: #1b231f;
    --text-muted: #5d6b63;
    --border: #cfd7d1;
    --accent: #2f7a55;
    --accent-text: #ffffff;
    --shadow: 0 2px 10px rgba(0,0,0,.15);
    --bar-h: 48px;
    --btn-h: 34px;
    --panel-w: 300px;
    --sheet-peek: 58px; /* výška sbaleného spodního panelu na mobilu */
  }
  @media (prefers-color-scheme: dark){
    :root{
      color-scheme: dark;
      --bg: #141a17;
      --surface: #1c2420;
      --surface-2: #26302b;
      --text: #e3ebe6;
      --text-muted: #97a69d;
      --border: #34413a;
      --accent: #5cb98a;
      --accent-text: #0e1612;
      --shadow: 0 2px 12px rgba(0,0,0,.5);
    }
  }
  /* Dotykové ovládání: větší tlačítka */
  @media (pointer: coarse){
    :root{ --bar-h: 56px; --btn-h: 44px; }
  }

  *{ box-sizing: border-box; }
  /* Atribut hidden musí vyhrát i nad display: flex apod. */
  [hidden]{ display: none !important; }
  html, body{ height: 100%; margin: 0; }
  body{
    background: var(--bg);
    color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- Horní lišta ---------- */
  #topbar{
    flex: 0 0 auto;
    min-height: calc(var(--bar-h) + env(safe-area-inset-top, 0px));
    padding: env(safe-area-inset-top, 0px) max(10px, env(safe-area-inset-right, 0px)) 0 max(10px, env(safe-area-inset-left, 0px));
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    z-index: 1100;
  }
  #topbar .brand{
    display: flex; align-items: center; gap: 8px;
    font-weight: 650; white-space: nowrap; margin-right: auto;
  }
  #topbar .brand img{ width: 26px; height: 26px; border-radius: 6px; }
  .actions{ display: flex; gap: 6px; }
  button{
    font: inherit;
    height: var(--btn-h);
    min-width: var(--btn-h);
    padding: 0 12px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface-2);
    color: var(--text);
    cursor: pointer;
  }
  button:hover:not(:disabled){ border-color: var(--accent); }
  button:focus-visible{ outline: 2px solid var(--accent); outline-offset: 1px; }
  button:disabled{ opacity: .45; cursor: default; }
  button.primary{ background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button svg{ width: 18px; height: 18px; flex: 0 0 auto; }

  /* ---------- Hlavní plocha: mapa + panel ---------- */
  #main{ flex: 1 1 auto; display: flex; min-height: 0; position: relative; }
  #map{ flex: 1 1 auto; min-width: 0; background: #e6e4df; }
  /* Mapa zůstává vždy ve světlém provedení, i v tmavém režimu */
  #map, #map .leaflet-control{ color-scheme: light; color: #333; }

  #panel{
    flex: 0 0 var(--panel-w);
    width: var(--panel-w);
    display: flex; flex-direction: column;
    background: var(--surface);
    border-left: 1px solid var(--border);
    min-height: 0;
  }
  body.panel-hidden #panel{ display: none; }
  #panel-head{
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
  }
  #panel-head .count{ color: var(--text-muted); font-weight: 400; margin-right: auto; }
  #panel-grip{ display: none; }
  #panel-body{ flex: 1 1 auto; overflow: auto; padding: 12px; }
  .empty{ color: var(--text-muted); }

  /* ---------- Zpráva (toast) ---------- */
  #toast{
    position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%);
    max-width: min(90vw, 460px);
    padding: 10px 14px;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    box-shadow: var(--shadow);
    z-index: 1200;
  }

  /* Vlastní ovládací prvek mapy „moje poloha“ */
  .leaflet-control-locate a{ display: flex !important; align-items: center; justify-content: center; }
  .leaflet-control-locate svg{ width: 18px; height: 18px; }
  .leaflet-control-locate.busy a{ opacity: .5; }
  @media (pointer: coarse){
    .leaflet-touch .leaflet-bar a{ width: 44px; height: 44px; line-height: 44px; }
  }

  /* ---------- Panel: info o souboru a seznam waypointů ---------- */
  .file-info{
    display: flex; gap: 8px; align-items: flex-start;
    padding: 10px; margin-bottom: 12px;
    background: var(--surface-2); border-radius: 8px;
  }
  .file-info .text{ flex: 1 1 auto; min-width: 0; }
  .file-info .name{ font-weight: 600; overflow-wrap: anywhere; }
  .file-info .meta{ color: var(--text-muted); font-size: 13px; }
  .file-actions{ display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .file-info .file-actions button{ width: auto; padding: 0 12px; background: var(--surface); border-color: var(--border); }
  .file-info button{ flex: 0 0 auto; padding: 0; width: var(--btn-h); background: transparent; border-color: transparent; }
  .file-info button:hover{ border-color: var(--border); }
  #wpt-list{ list-style: none; margin: 0; padding: 0; }
  #wpt-list li{
    display: flex; gap: 10px; align-items: flex-start;
    padding: 8px 10px; border-radius: 8px; cursor: pointer;
  }
  #wpt-list li:hover{ background: var(--surface-2); }
  #wpt-list li.selected{ background: var(--surface-2); outline: 2px solid var(--accent); outline-offset: -2px; }
  #wpt-list .idx{ color: var(--text-muted); font-variant-numeric: tabular-nums; min-width: 1.4em; text-align: right; align-self: center; }
  #wpt-list .wname{ font-weight: 500; overflow-wrap: anywhere; }
  #wpt-list .wdesc{ color: var(--text-muted); font-size: 13px; overflow-wrap: anywhere; }
  .hint{ color: var(--text-muted); font-size: 13px; }

  /* ---------- Prvky na mapě ---------- */
  /* Waypoint: kroužek se šipkou typu odbočky (šipka natočená podle příjezdu) */
  .wpt-icon div, .ticon{
    width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: #f08c00; color: #fff; border: 2px solid #fff;
    box-shadow: 0 0 0 1px rgba(0,0,0,.35), 0 1px 4px rgba(0,0,0,.4);
    transition: transform .12s ease;
  }
  .wpt-icon svg, .ticon svg{ width: 18px; height: 18px; display: block; }
  .wpt-icon div, .ticon{ position: relative; }
  .wpt-icon.cat-poi div, .ticon.cat-poi{ background: #1098ad; }
  .wpt-icon.cat-danger div, .ticon.cat-danger{ background: #e03131; }
  .wpt-icon.cat-generic div, .ticon.cat-generic{ background: #7048e8; }
  /* Číslo výjezdu z kruhového objezdu — uprostřed kruhu, nenatáčí se */
  .rnum{ position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 700 10px/1 system-ui, sans-serif; }
  .ticon .rnum{ font-size: 8px; }
  .wpt-icon.selected div{ background: #1f6feb; transform: scale(1.25); }
  /* Mimo bod trasy — Suunto by waypoint ignoroval */
  .wpt-icon.warn div, .ticon.warn{ background: #868e96; outline: 2px dashed #e03131; outline-offset: 1px; }
  .wpt-icon.warn.selected div{ background: #1f6feb; }
  .ticon{ flex: 0 0 auto; width: 24px; height: 24px; align-self: center; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
  .ticon svg{ width: 16px; height: 16px; }
  .ticon.start{ background: #2f9e44; font: 700 11px/1 system-ui, sans-serif; }
  .ticon.finish{ background: #e03131; font: 700 11px/1 system-ui, sans-serif; }
  #wpt-list .wwarn{ color: #b35c00; font-size: 13px; }
  .file-info .warn{ color: #b35c00; }
  @media (prefers-color-scheme: dark){ #wpt-list .wwarn, .file-info .warn{ color: #ffc078; } }
  .end-icon div{
    width: 20px; height: 20px; border-radius: 50%;
    border: 3px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.35);
    color: #fff; font: 700 10px/14px system-ui, sans-serif; text-align: center;
  }
  .end-icon.start div{ background: #2f9e44; }
  .end-icon.finish div{ background: #e03131; }
  .end-icon.selected div{ transform: scale(1.3); box-shadow: 0 0 0 3px #1f6feb; }
  #wpt-list li.fixed .wname{ color: var(--text-muted); }
  .dir-arrow svg{ display: block; width: 14px; height: 14px; }

  /* ---------- Editor waypointu ---------- */
  .editor{
    margin-bottom: 12px; padding: 12px;
    border: 2px solid var(--accent); border-radius: 10px;
    background: var(--surface);
  }
  .editor h3{ margin: 0 0 10px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .editor label, .editor .elabel{ display: block; margin: 10px 0 4px; font-size: 13px; color: var(--text-muted); }
  .editor input[type=text]{
    width: 100%; height: var(--btn-h); padding: 0 10px;
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px;
  }
  .editor input[type=text]:focus{ outline: 2px solid var(--accent); outline-offset: -1px; }
  .editor .row{ display: flex; flex-wrap: wrap; gap: 6px; }
  .editor .row button{ flex: 1 1 auto; }
  .editor .hint{ margin-top: 4px; }
  .tgrid{ display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 4px; }
  .tbtn{
    position: relative; padding: 0; height: 38px; min-width: 0;
    background: transparent; border-color: transparent;
  }
  .tbtn .ticon{ margin: auto; }
  .tbtn.selected{ background: var(--surface-2); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  /* Navržený typ podle úhlu trasy */
  .tbtn.suggested::after{
    content: ""; position: absolute; top: 3px; right: 3px;
    width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
  }
  .tlabel{ margin-top: 6px; font-size: 13px; }
  .editor details{ margin-top: 8px; }
  .editor summary{ cursor: pointer; font-size: 13px; color: var(--text-muted); padding: 4px 0; }
  .editor .confirm{ display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .editor .confirm span{ flex: 1 1 100%; font-size: 13px; }
  button.danger{ background: #e03131; border-color: #e03131; color: #fff; }
  button.danger-outline{ color: #e03131; }
  @media (prefers-color-scheme: dark){ button.danger-outline{ color: #ff8787; } }
  @media (pointer: coarse){ .tgrid{ grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); } .tbtn{ height: 44px; } }
  .badge{
    display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 9px;
    font-size: 12px; font-weight: 600; background: #f08c00; color: #fff; vertical-align: 1px;
  }

  /* Režim přidávání */
  #add-bar{
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center;
    max-width: calc(100% - 120px);
    padding: 8px 8px 8px 14px; border-radius: 10px;
    background: var(--accent); color: var(--accent-text); box-shadow: var(--shadow);
    z-index: 1150; font-weight: 600;
  }
  #add-bar .short{ display: none; }
  @media (max-width: 760px){
    #add-bar{ padding: 6px 6px 6px 12px; font-size: 14px; flex-wrap: nowrap; white-space: nowrap; }
    #add-bar .long{ display: none; }
    #add-bar .short{ display: inline; }
  }
  body.adding #map{ cursor: crosshair; }
  .vdot{ pointer-events: none; }

  /* ---------- Dialog „Open URL“ ---------- */
  dialog{
    width: min(92vw, 520px);
    padding: 18px;
    color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--shadow);
  }
  dialog::backdrop{ background: rgba(0,0,0,.4); }
  dialog h2{ margin: 0 0 12px; font-size: 17px; }
  dialog input[type=url]{
    width: 100%; height: var(--btn-h); padding: 0 10px;
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px;
  }
  dialog input[type=url]:focus{ outline: 2px solid var(--accent); outline-offset: -1px; }
  dialog .error{ margin: 10px 0 0; color: #e03131; }
  @media (prefers-color-scheme: dark){ dialog .error{ color: #ff8787; } }
  .dialog-actions{ display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .dialog-actions .spacer{ flex: 1 1 auto; }

  /* ---------- Přetažení souboru ---------- */
  #drop{
    position: fixed; inset: 10px;
    display: flex; align-items: center; justify-content: center;
    border: 3px dashed var(--accent); border-radius: 16px;
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    font-size: 20px; font-weight: 600;
    z-index: 2000; pointer-events: none;
  }

  /* ---------- Mobilní rozložení ----------
     Úzká obrazovka, nebo dotykové zařízení s malou výškou (telefon na šířku).
     Boční panel se mění na vysouvací spodní panel. */
  @media (max-width: 760px), (pointer: coarse) and (max-height: 500px){
    #topbar .brand span{ display: none; }
    .actions button .label{ display: none; }
    #btn-panel{ display: none; }

    #main{ flex-direction: column; }
    #panel, body.panel-hidden #panel{
      display: flex;
      position: absolute; left: 0; right: 0; bottom: 0;
      width: auto;
      height: 50%;
      border-left: none;
      border-top: 1px solid var(--border);
      border-radius: 14px 14px 0 0;
      box-shadow: var(--shadow);
      z-index: 1000;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      transition: transform .22s ease;
    }
    /* Sbalený panel: vidět je jen hlavička */
    body:not(.sheet-open) #panel{
      transform: translateY(calc(100% - var(--sheet-peek) - env(safe-area-inset-bottom, 0px)));
    }
    #panel-head{ cursor: pointer; flex-wrap: wrap; row-gap: 0; padding-top: 0; height: var(--sheet-peek); }
    #panel-grip{
      display: block; flex: 0 0 100%; height: 14px;
      background: linear-gradient(var(--border), var(--border)) center / 40px 4px no-repeat;
    }
    /* Atribuce a spodní prvky mapy nad sbaleným panelem, ať nejsou zakryté */
    #map .leaflet-bottom{ bottom: calc(var(--sheet-peek) + env(safe-area-inset-bottom, 0px)); }
    #toast{ bottom: calc(var(--sheet-peek) + 16px + env(safe-area-inset-bottom, 0px)); }
  }
</style>
</head>
<body>

<header id="topbar">
  <div class="brand"><img src="icon.svg" alt=""><span>AddTurn GPX</span></div>
  <div class="actions">
    <button id="btn-open" title="Open GPX file">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span class="label">Open</span>
    </button>
    <button id="btn-url" title="Open GPX from URL">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
      <span class="label">Open URL</span>
    </button>
    <button id="btn-add" disabled title="Add a waypoint: then tap a point on the route">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      <span class="label">Add</span>
    </button>
    <button id="btn-undo" disabled title="Undo (Ctrl+Z)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
    </button>
    <button id="btn-redo" disabled title="Redo (Ctrl+Y)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
    </button>
    <button id="btn-save" class="primary" disabled title="Save GPX">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
      <span class="label">Save</span>
    </button>
    <button id="btn-panel" title="Show / hide waypoint panel" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
    </button>
  </div>
</header>

<div id="main">
  <div id="map"></div>
  <aside id="panel">
    <div id="panel-head">
      <div id="panel-grip"></div>
      <span>Waypoints</span><span class="count" id="wpt-count"></span>
    </div>
    <div id="panel-body"></div>
  </aside>
  <div id="toast" hidden></div>
  <div id="add-bar" hidden>
    <span class="long">Tap a point on the route to add a waypoint</span><span class="short">Tap the route</span>
    <button id="add-cancel">Cancel</button>
  </div>
</div>

<input type="file" id="file-input" hidden>

<dialog id="url-dialog">
  <form id="url-form">
    <h2>Open GPX from URL</h2>
    <input type="url" id="url-input" placeholder="https://example.com/track.gpx" required autocomplete="url">
    <p class="error" id="url-error" hidden></p>
    <div class="dialog-actions">
      <button type="button" id="url-local" hidden>Open local file instead</button>
      <span class="spacer"></span>
      <button type="button" id="url-cancel">Cancel</button>
      <button type="submit" class="primary" id="url-ok">Open</button>
    </div>
  </form>
</dialog>

<div id="drop" hidden>Drop a GPX file to open it</div>

<dialog id="confirm-dialog">
  <form id="confirm-form">
    <h2 id="confirm-title">Discard changes?</h2>
    <p id="confirm-text"></p>
    <div class="dialog-actions">
      <span class="spacer"></span>
      <button type="button" id="confirm-cancel">Cancel</button>
      <button type="submit" class="primary danger" id="confirm-ok">Discard</button>
    </div>
  </form>
</dialog>

<script src="vendor/leaflet/leaflet.js"></script>
<script>
"use strict";

// ---------- Nastavení a perzistence ----------
const VIEW_KEY = "addturngpx.view";
const PANEL_KEY = "addturngpx.panelHidden";
const DEFAULT_VIEW = { lat: 49.8, lng: 15.5, zoom: 7 }; // Česko

function loadJSON(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  }catch(e){ return fallback; }
}
function saveJSON(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){}
}

// ---------- Rozložení: mobil / desktop ----------
// Řídí se CSS media query (stejná jako v <style>), ne podle User-Agent,
// takže se GUI přizpůsobí i změně velikosti okna nebo otočení telefonu.
const mobileQuery = window.matchMedia("(max-width: 760px), (pointer: coarse) and (max-height: 500px)");
function isMobile(){ return mobileQuery.matches; }

// ---------- Mapa ----------
const savedView = loadJSON(VIEW_KEY, DEFAULT_VIEW);
const map = L.map("map", { zoomControl: true }).setView([savedView.lat, savedView.lng], savedView.zoom);

L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  // OSM vyžaduje hlavičku Referer — bez ní dlaždice blokuje (HTTP 403)
  referrerPolicy: "strict-origin-when-cross-origin",
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors'
}).addTo(map);

map.on("moveend", () => {
  const c = map.getCenter();
  saveJSON(VIEW_KEY, { lat: +c.lat.toFixed(6), lng: +c.lng.toFixed(6), zoom: map.getZoom() });
});

// ---------- Ovládací prvek „moje poloha“ ----------
let locationMarker = null;
const LocateControl = L.Control.extend({
  options: { position: "topleft" },
  onAdd(){
    const box = L.DomUtil.create("div", "leaflet-bar leaflet-control leaflet-control-locate");
    const a = L.DomUtil.create("a", "", box);
    a.href = "#";
    a.title = "Show my location";
    a.setAttribute("role", "button");
    a.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>';
    L.DomEvent.disableClickPropagation(box);
    L.DomEvent.on(a, "click", (ev) => {
      L.DomEvent.preventDefault(ev);
      box.classList.add("busy");
      map.locate({ setView: true, maxZoom: 16, enableHighAccuracy: true });
    });
    this._box = box;
    return box;
  }
});
const locateControl = new LocateControl().addTo(map);

map.on("locationfound", (e) => {
  locateControl._box.classList.remove("busy");
  if (locationMarker) locationMarker.remove();
  locationMarker = L.layerGroup([
    L.circle(e.latlng, { radius: e.accuracy, weight: 1, color: "#2a7de1", fillOpacity: .12 }),
    L.circleMarker(e.latlng, { radius: 7, weight: 3, color: "#fff", fillColor: "#2a7de1", fillOpacity: 1 })
  ]).addTo(map);
});
map.on("locationerror", (e) => {
  locateControl._box.classList.remove("busy");
  showToast("Location unavailable: " + e.message);
});

// ---------- GPX: stav ----------
// Drží se původní text souboru (přesně, jak byl načten) a z něj vytvořený
// DOM pro čtení. Editují se jen <wpt>; vše ostatní (deklarace XML, metadata,
// <extensions>, formátování) musí při uložení zůstat beze změny.
let gpx = null;          // { doc, ns, text, fileName, sourceUrl, handle }
let trackLines = [];     // pole polí L.LatLng — pro šipky směru
let wptItems = [];       // [{ el, latlng, marker, fixed }]
let selectedWpt = -1;
const gpxLayer = L.layerGroup().addTo(map);
const arrowLayer = L.layerGroup().addTo(map);

const TRACK_COLOR = "#1f6feb";
const ROUTE_COLOR = "#7c3aed";

// Přímí potomci elementu v jmenném prostoru GPX (GPX 1.0 i 1.1)
function kids(parent, name, ns){
  return Array.from(parent.children).filter(el => el.localName === name && el.namespaceURI === ns);
}
function childText(parent, name, ns){
  const el = kids(parent, name, ns)[0];
  return el ? el.textContent.trim() : "";
}
function readLatLng(el){
  const lat = parseFloat(el.getAttribute("lat"));
  const lon = parseFloat(el.getAttribute("lon"));
  return (isFinite(lat) && isFinite(lon)) ? L.latLng(lat, lon) : null;
}
function lineLength(pts){
  let d = 0;
  for (let i = 1; i < pts.length; i++) d += pts[i - 1].distanceTo(pts[i]);
  return d;
}
